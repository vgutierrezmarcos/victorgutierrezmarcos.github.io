<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Portada de las recopilaciones de exámenes</title>
<!--
  Portada de las recopilaciones de exámenes oficiales del primer ejercicio.
  Se imprime a PDF con Edge (A4 apaisado) y la pone scripts/recopilaciones-examenes.py:
  portada-recopilacion.html#test o portada-recopilacion.html#dictamen.
  Autor: Víctor Gutiérrez Marcos
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=block">
<style>
@page { size: 297mm 210mm; margin: 0; }
:root { --morado: #5F2987; --morado-suave: #8a63a8; --salvia: #E2EFD9; --ficha: #F2F7EE; --tinta: #3d2a4d; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 297mm; height: 210mm; background: var(--salvia); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: 'Palatino Linotype', Palatino, Georgia, serif; color: var(--morado); position: relative; overflow: hidden; }
.marco { position: absolute; inset: 9mm; border: 2.2mm solid var(--morado); }
.marco::after { content: ''; position: absolute; inset: 2.2mm; border: 0.3mm solid var(--morado); }
.contenido { position: absolute; inset: 22mm 25mm 17mm; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
.cabecera { display: flex; flex-direction: column; align-items: center; }
.antetitulo { font-family: 'Source Sans 3', sans-serif; font-weight: 600; font-size: 10.5pt; letter-spacing: 0.32em; text-transform: uppercase; color: var(--morado-suave); }
h1 { font-weight: 700; font-size: 40pt; letter-spacing: 0.04em; line-height: 1.05; margin-top: 4mm; text-transform: uppercase; }
.cuerpo { font-style: italic; font-size: 17pt; margin-top: 2.5mm; color: var(--tinta); }
.adorno { display: flex; align-items: center; gap: 3mm; width: 120mm; margin: 6mm 0 5mm; }
.adorno span { flex: 1; height: 0.3mm; background: var(--morado); }
.adorno i { width: 2.4mm; height: 2.4mm; background: var(--morado); transform: rotate(45deg); }
.ejercicio { font-weight: 700; font-size: 19pt; letter-spacing: 0.05em; }
.ejercicio em { font-weight: 400; font-style: italic; letter-spacing: 0; }
.anios { width: 100%; flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 3mm; }
.anios h2 { display: flex; align-items: center; gap: 4mm; font-style: italic; font-weight: 400; font-size: 12pt; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 3.5mm; }
.anios h2::before, .anios h2::after { content: ''; flex: 1; height: 0.3mm; background: var(--morado); opacity: 0.5; }
.fichas { display: grid; gap: 3mm; }
.ficha { background: var(--ficha); border: 0.3mm solid rgba(95, 41, 135, 0.45); border-top: 1.2mm solid var(--morado); padding: 3.2mm 0 3.4mm; display: flex; flex-direction: column; align-items: center; }
.ficha b { font-size: 21pt; font-weight: 700; line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; }
.ficha em { font-size: 10.5pt; color: var(--tinta); margin-top: 0.8mm; }
.pie { width: 100%; display: flex; justify-content: space-between; font-family: 'Source Sans 3', sans-serif; font-size: 9.5pt; letter-spacing: 0.06em; color: var(--morado-suave); }
.pie strong { color: var(--morado); font-weight: 600; }
</style></head>
<body>
<div class="marco"></div>
<div class="contenido">
  <div class="cabecera">
    <div class="antetitulo" id="antetitulo"></div>
    <h1>Exámenes de la oposición</h1>
    <div class="cuerpo">al Cuerpo Superior de Técnicos Comerciales y Economistas del Estado</div>
    <div class="adorno"><span></span><i></i><span></span></div>
    <div class="ejercicio" id="ejercicio"></div>
  </div>
  <div class="anios">
    <h2>Años</h2>
    <div class="fichas" id="fichas"></div>
  </div>
  <div class="pie"><span id="resumen"></span><span>victorgutierrezmarcos.es</span></div>
</div>
<script>
// Exámenes de cada recopilación, del más reciente al más antiguo.
const RECIENTES = [['2026', 'marzo'], ['2025', 'marzo'], ['2024', 'junio'], ['2023', 'junio'], ['2022', 'julio'], ['2021', 'julio'], ['2020', 'enero'],
  ['2019', 'febrero'], ['2018', 'enero'], ['2016', 'noviembre'], ['2016', 'enero'], ['2014', 'septiembre'], ['2013', 'noviembre'], ['2011', 'octubre']];
const RECOPILACIONES = {
  test: {
    parte: 'PRIMER EJERCICIO – PRIMERA PARTE <em>(test)</em>',
    anios: [...RECIENTES, ['2009', 'octubre'], ['2008', 'julio'], ['2007', 'julio'], ['2006', 'septiembre'], ['2005', 'septiembre'], ['2004', 'junio'], ['2003', 'julio'], ['2002', 'octubre']],
    resumen: n => `<strong>${n} exámenes oficiales</strong> · cada uno con su plantilla de corrección`,
  },
  dictamen: {
    parte: 'PRIMER EJERCICIO – SEGUNDA PARTE <em>(dictamen)</em>',
    anios: RECIENTES,
    resumen: n => `<strong>${n} exámenes oficiales</strong> · enunciados con sus cuadros y gráficos`,
  },
};
const r = RECOPILACIONES[location.hash.slice(1)] || RECOPILACIONES.test;
const n = r.anios.length;
document.getElementById('antetitulo').textContent = `Recopilación · ${r.anios[n - 1][0]} – ${r.anios[0][0]}`;
document.getElementById('ejercicio').innerHTML = r.parte;
document.getElementById('resumen').innerHTML = r.resumen(n);
const fichas = document.getElementById('fichas');
fichas.style.gridTemplateColumns = `repeat(${Math.ceil(n / 2)}, 1fr)`;
fichas.innerHTML = r.anios.map(([a, m]) => `<div class="ficha"><b>${a}</b><em>${m}</em></div>`).join('');
</script>
</body></html>
