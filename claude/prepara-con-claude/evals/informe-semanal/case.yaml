name: informe-semanal
expected_outcome: |
  El informe de la semana del 26 de octubre al 1 de noviembre de 2026 con los cinco
  apartados fijos de la skill (la semana en tres líneas; qué ha mejorado y qué se repite;
  tests por tema; ritmo, racha y horas; las tres tareas de la semana que viene), escrito
  en informe-semana.md. Compara con la semana anterior (19-25 de octubre: cante del 3.A.16
  el día 24, valorado 4) y reconoce que el cante de esta semana es el test del 28 de
  octubre (6,4 sobre 10, 115 minutos, 3.B.4 con 1 acierto y 3 fallos) y que no ha habido
  cante; dice que con una sola semana de test no hay tendencia; pone 3.B.4 y 3.A.19 entre
  lo primero que repasar; señala el atraso del cronograma (fin previsto el 31 de octubre)
  estima las horas con el `horario` del JSON y da tres tareas concretas con la herramienta
  de la app. Sin comparar con nadie, con el
  aviso final.
