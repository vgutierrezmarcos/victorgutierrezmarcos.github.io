schema_version: "1.1"
name: cronograma-6-meses
expected_outcome: |
  Un plan por semanas con un resumen (semanas disponibles, temas pendientes, ritmo), una
  tabla legible y el bloque para la app en el formato de «Traer el tuyo»: una línea por
  semana con la fecha del cante (siempre sábado) seguida de dos puntos y los códigos de
  tema separados por comas, cabecera con «#», sin líneas de las semanas de descanso
  (del 21 de diciembre al 6 de enero), sin repetir temas, con los 50 temas que faltan del
  3.º (los 3.A.21-45 y 3.B.21-45) más la vuelta de los flojos (3.A.8 y 3.B.4) en las primeras
  semanas, ritmo de no más de seis temas por semana, y las últimas semanas antes del 12 de
  junio reservadas al repaso. Termina con el aviso de la IA.
context:
  scaffold_script: place-files.sh
