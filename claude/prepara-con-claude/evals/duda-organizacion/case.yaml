schema_version: "1.1"
name: duda-organizacion
expected_outcome: |
  Una respuesta que propone un orden de estudio justificado con los bloques y las
  conexiones del temario (references/temario/bloques-y-conexiones.md), que dice qué modelos
  del 3.A.16 se reutilizan en los otros temas usando references/canon/modelos-indice.md,
  que distingue los temas revisados (según references/temas/INDICE.md) de los que no, y que
  usa los títulos oficiales exactos de references/temario/programa-tcee.md sin inventar
  ninguno. Termina con el aviso de la IA.
