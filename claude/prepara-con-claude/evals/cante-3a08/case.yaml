schema_version: "1.1"
name: cante-3a08
expected_outcome: |
  Un informe de corrección del cante con las ocho secciones de la skill (en tres líneas,
  estructura y tiempos, errores de contenido, omisiones y sobras, expresión y pizarra,
  preguntas de comprobación, preguntas del tribunal, para la app) y el aviso final.
  Detecta los errores plantados: saludo inicial, Slutsky en 1925 (es 1915), efecto
  sustitución «siempre positivo» (es no positivo), consumo de los hogares «más o menos el
  sesenta por ciento» sin fecha (54,1 % del PIB en 2025), «como veremos en el tema 3.A.9»
  (no se dicen números de tema), «termino ya» y «muchas gracias» en la conclusión, y
  conclusión sin «En conclusión,» ni opinión ni idea final. Cita cada error con su minuto
  y con la fuente del tema revisado. Valoración de 1 a 5 coherente (2 o 3) y comentarios de
  hasta 300 caracteres.
context:
  scaffold_script: place-files.sh
