schema_version: "1.1"
name: simulacro-tcee
expected_outcome: |
  El primer turno de un simulacro completo del tercer ejercicio de TCEE: sortea de verdad
  dos bolas de la parte A y dos de la B (cuatro códigos distintos, con sus títulos oficiales
  del programa), ponderadas como la app (más peso a los temas menos cantados y peor
  valorados: 3.A.8 y 3.B.4 valen más que 3.A.16), pide al opositor que elija uno de cada
  parte y para ahí: no da pistas de contenido, no corrige nada todavía y no hace el
  tribunal. Explica en una línea lo que viene después (45 minutos de esquema con la hora,
  30 minutos por tema con la transcripción, corrección y tribunal). Guarda en simulacro.md
  el sorteo con la bolsa y los pesos usados. No reproduce el temario.
context:
  scaffold_script: place-files.sh
