schema_version: "1.1"
name: dictamen-manuscrito
expected_outcome: |
  Un informe que transcribe el dictamen, y que detecta: (1) la incoherencia central entre
  el diagnóstico (output gap positivo, inflación del 6 %, recalentamiento) y la
  recomendación de expansión fiscal (procíclica; el policy mix choca con la subida de
  tipos); (2) el umbral del procedimiento de desequilibrios macroeconómicos para el
  déficit por cuenta corriente, que es del 4 % del PIB (no del 6 %), por lo que un 5 %
  sí es un desequilibrio, agravado por la financiación a corto plazo y una PII neta
  del −70 % (umbral −35 %); (3) que la frase «creo que el país es Portugal» sobra: no se
  adivina el país; (4) que se pasó del tiempo (1 h 50 min frente a 1 h 45 min) y la regla
  de reparto (10-12 minutos de lectura, repaso al final); (5) preguntas de los 15 minutos
  de lectura. Bloque para la app con valoración (1-3) y comentarios, y el aviso final.
context:
  scaffold_script: place-files.sh
