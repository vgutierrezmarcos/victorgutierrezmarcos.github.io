# Familias de datos que caducan (lista viva). Un mismo dato que aparece en
# varios temas lleva la misma familia en cada datos-actualizables.yaml y se
# actualiza de una vez con /actualizartemario. «temas» se rellena con lo que
# hay inventariado; el coordinador la completa al reunir todos los inventarios.
# proxima: AAAA-MM de la próxima publicación conocida (a 9/11/2026).
fecha: 2026-11-09
familias:
  # --- Las de la skill (aparecen en muchos temas) ---
  bis-trienal:
    organismo: BIS (y Banco de España para los datos de España)
    que_es: "Encuesta Trienal de Bancos Centrales: volumen del mercado de divisas y de derivados OTC de tipos en abril (divisas, pares, plazas, contrapartidas, instrumentos, liquidación)"
    periodicidad: trienal (preliminares en septiembre, definitivos al año siguiente)
    url: https://www.bis.org/statistics/rpfx25.htm
