    temas: [3B13, 3B14, 3B25]
  mff-ue:
    organismo: Consejo de la UE / Comisión Europea
    que_es: "Marco financiero plurianual: techos de compromisos y pagos por rúbrica (2021-2027 en vigor; 2028-2034 en negociación)"
    periodicidad: septenal (con ajustes técnicos anuales)
    url: https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget_en
