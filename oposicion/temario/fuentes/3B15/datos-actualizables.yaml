    valor: [44.8, 32.5, 13.4, 9.3]
    unidad: "% de los miembros del FMI (y territorios)"
    periodo: "30/4/2023"
    fuente: FMI2024AREAER2023
    organismo: FMI
    serie: "AREAER, tablas 3 y 4 «Exchange Rate Arrangements»"
    url: https://www.elibrary.imf.org/fileasset/downloads/AEIEA2023001-S001.pdf
