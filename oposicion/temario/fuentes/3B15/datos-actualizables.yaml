# Propuesto en la fase 2 (verificación de datos). Las frases definitivas las
# pone el revisor de contenido: al escribirlas, ajustar «texto» y «donde».
# Los CSV están ahora en datos/; al pasar a D/datos/ cambiar «depende».
datos:
  - id: areaer-porcentajes
    texto: "a 30 de abril de 2023, el 44,8~\\% de sus miembros tenía un anclaje blando, el 32,5~\\% flotaba, el 13,4~\\% tenía un anclaje duro y el 9,3~\\% otros regímenes gestionados"
