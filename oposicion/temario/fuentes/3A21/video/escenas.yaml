# Guion de escenas del vídeo del cante del tema 3.A.21 (formato en scripts/temario/generar-video.py).
# Dice lo mismo que guion-cante.md: el texto de cada «di» es el del cante.
# Pizarra: las 3 funciones clave (exceso de demanda, ley de Walras y condición de equilibrio) se
# recuadran en morado en la esquina 1a y se quedan hasta el final; la caja de intercambio se dibuja
# en I.3 en la columna 3 y crece sin borrarse hasta III.2 (capas 1-6, 7-8, 9 y 10).
# Autor: Víctor Gutiérrez Marcos
tema: 3.A.21
duracion: 1800
voz: {motor: voicestudio, motor_tts: omnivoice, velocidad: 1.0, referencia: /mnt/c/Users/vgutierrez/Documents/voz/referencia-12s.wav}   # voz clonada de Víctor con OmniVoice (VoiceStudio)
