tema: 3B32
fecha_inventario: 2026-11-14
# Tema de datos: se pone al día cada año tras el WEO de octubre del FMI.
# 1) python3 graficos/datos-3B32.py   (rehace datos/*.csv y graficos/centro-gravedad.tex)
# 2) revisar las cifras de cada entrada en el .tex y en la ficha, y los rótulos y comentarios de los gráficos
# 3) construir-tema.py 3B32 --solo graficos; después --solo pdf
datos:
  - id: weo-crecimiento
    texto: "el 3,5~\\% en 2025, el 3,1~\\% en 2026 y el 3,4~\\% en 2027"
    donde: [3B32.tex, repaso/3B32-repaso.tex]
    valor: 3.1
    unidad: "% (PIB real, mundo, pesos en PPA)"
    periodo: "2025-2027 (avanzadas 2,0/2,1/1,8; EMED 4,5/3,7/4,4; EE. UU. 2,3; zona del euro 1,2/1,1/1,2; España 2,6/2,5/1,8; Japón 0,7; China 5,0/4,5/4,0; India 7,8/7,0/7,0; Oriente Medio y Asia Central 3,7/-0,3/6,3; Arabia Saudí -3,3; ASEAN-5 4,4; América Latina 2,3; África subsahariana 4,5)"
    fuente: FMI2026WEO
    organismo: FMI
    serie: "DataMapper NGDP_RPCH (WEOWORLD, ADVEC, OEMDC, AS5, WE, MECA, SSA y países)"
    url: https://www.imf.org/external/datamapper/NGDP_RPCH
    periodicidad: semestral (abril y octubre; actualizaciones en enero y julio)
    proxima: 2027-04
    familia: fmi-weo
    depende: [datos/crecimiento-mundial.csv, datos/crecimiento-regiones.csv, graficos/crecimiento-mundial.tex, graficos/crecimiento-regiones.tex]
    frase: "enganche; I.1 «las cifras»; III.2 (China, India, ASEAN, Golfo, América Latina, África); conclusión; ficha"
    nota: "segunda comprobación: cuadro 1.1 del capítulo 1 del WEO (copia previa a la publicación) y DataMapper. A tipos de mercado: 2,9/2,5/2,8"

  - id: weo-medio-plazo
    texto: "el FMI prevé un 3,2~\\% anual en 2028-2031, frente al 3,7~\\% de 2000-2019"
    donde: [3B32.tex, repaso/3B32-repaso.tex]
    valor: 3.2
    unidad: "% anual"
    periodo: 2028-2031
    fuente: FMI2026WEO
    organismo: FMI
    url: https://www.imf.org/en/publications/weo/issues/2026/10/13/world-economic-outlook-october-2026
    periodicidad: semestral
    proxima: 2027-04
    familia: fmi-weo
    depende: [graficos/crecimiento-mundial.tex]

  - id: weo-inflacion-petroleo
    texto: "la inflación mundial repunta del 4,1~\\% en 2025 al 4,7~\\% en 2026"
    donde: [3B32.tex, repaso/3B32-repaso.tex]
    valor: 4.7
    unidad: "% (IPC, media anual)"
    periodo: "2025-2027 (4,1/4,7/4,1); petróleo APSP 67,74/95,74/87,39 $ (+41,3 % en 2026); Ormuz: ~20 mb/d; reapertura supuesta en marzo de 2027; deuda pública avanzadas 108 → 115 % (2025-2031), EMED 74 → 84 %; IA +0,1-0,8 pp a medio plazo"
    fuente: FMI2026WEO
    organismo: FMI
    serie: "DataMapper PCPIPCH; capítulo 1 del WEO"
    url: https://www.imf.org/external/datamapper/PCPIPCH
    periodicidad: semestral
    proxima: 2027-04
    familia: fmi-weo
    depende: [datos/inflacion-mundial.csv]

  - id: otras-previsiones
    texto: "la OCDE prevé un 2,9~\\% para 2026 y un 3~\\% para 2027, y el Banco Mundial, un 2,5~\\% para 2026"
    donde: [3B32.tex]
    valor: 2.9
    unidad: "%"
    periodo: "OCDE, informe intermedio de septiembre de 2026; Banco Mundial, GEP de junio de 2026"
    fuente: [OCDE2026Interim, BM2026GEP]
    organismo: OCDE y Banco Mundial
    url: https://www.oecd.org/en/publications/oecd-economic-outlook-interim-report-september-2026_f751d02b-en.html
    periodicidad: semestral (OCDE junio y diciembre, intermedios en marzo y septiembre; BM enero y junio)
    proxima: 2026-12
    familia: ocde-eo
    nota: "las cifras de la OCDE, de prensa (Euronews): la nota oficial daba 403. Comprobar en la publicación de diciembre de 2026. BM: «casi una década de convergencia perdida» para EMED sin China ni India"

  - id: peso-pib-ppa
