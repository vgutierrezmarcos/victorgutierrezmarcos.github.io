    donde: [3B32.tex, repaso/3B32-repaso.tex]
    valor: 39.5
    unidad: "% del PIB mundial en PPA"
    periodo: "1980-2031 (China 2,1 → 19,6, supera a EE. UU. en 2016; EE. UU. 21,6 → 14,6; UE 27,4 → 14,0; India 2,7 → 8,2 → 10,2 en 2031; EMED superan a avanzadas en 2009; a tipos de mercado, 2025: EE. UU. 26,0, China 16,6, EMED 41,3; BRICS de 11 miembros, 40,5 % en PPA)"
    fuente: FMI2026DataMapper
    organismo: FMI
    serie: "DataMapper PPPSH (y NGDPD para las cuotas a tipos de mercado)"
    url: https://www.imf.org/external/datamapper/PPPSH
    periodicidad: semestral
    proxima: 2027-04
    familia: fmi-weo
    depende: [datos/peso-pib-ppa.csv, graficos/peso-pib-ppa.tex]

  - id: centro-gravedad
