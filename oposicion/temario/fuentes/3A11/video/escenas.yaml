# Guion de escenas del vídeo del cante del tema 3.A.11 (formato en scripts/temario/generar-video.py).
# Dice lo mismo que guion-cante.md: el texto de cada «di» es el del cante.
# Pizarra: las 2 funciones clave del tema (\funcionclave: la función de producción como problema de
# máximo y la elasticidad de sustitución σ) se recuadran en morado en la esquina 1a (columna 1 del
# 30 % y fila a del 48 % en todas las rejillas desde I.2) y se quedan hasta el final con «conservar».
# Cada apartado tiene su rejilla. Ninguna superficie 3D se dibuja a mano: van como apoyo y avanzan
# por estados con la narración (la superficie, luego el corte de corto plazo, las isocuantas, el
# rayo y el desplazamiento del muy largo plazo); en la pizarra solo se dibujan sus cortes en el plano.
# Autor: Víctor Gutiérrez Marcos
tema: 3.A.11
duracion: 1800
voz: {motor: voicestudio, motor_tts: omnivoice, velocidad: 1.0, referencia: /mnt/c/Users/vgutierrez/Documents/voz/referencia-12s.wav}   # voz clonada de Víctor con OmniVoice (VoiceStudio)
