escenas:

  # ==================================================================== INTRODUCCIÓN
  - bloque: Introducción
    titulo: Introducción
    modo: guion
    estructura: [Enganche, Relevancia, Contextualización, Problemática, Estructura]
    pasos:
      - di: "¿Puede una sola función resumir todo lo que una empresa sabe hacer? [pausa 800] Adam Smith abre La riqueza de las naciones con una fábrica de alfileres: 10 operarios que se repartían 18 operaciones hacían 48.000 alfileres al día, 4.800 por persona, cuando cada uno, trabajando solo, no habría hecho ni 20. La organización y la escala multiplican lo que se produce."
        parte: Enganche
        guion: ["¿Puede una sola función resumir todo lo que una empresa sabe hacer?", "Smith (1776): la fábrica de alfileres", "> 10 operarios, 18 operaciones: 48.000 alfileres al día, 4.800 por persona (ni 20 por separado)"]
      - di: "Detrás está la pregunta de esta exposición: ¿qué puede producir una empresa con unos recursos y unos conocimientos dados, y cómo cambia lo que puede producir cuando cambian sus factores, su tamaño o su tecnología? La teoría neoclásica responde desde el individualismo metodológico: lo agregado se explica desde agentes que optimizan."
        guion: ["¿Qué puede producir una empresa, y cómo cambia con sus factores, su tamaño y su tecnología?", "Individualismo metodológico: lo agregado, desde agentes que optimizan"]
      - di: "La empresa transforma factores en productos con tres restricciones: técnicas, qué es posible; económicas, qué es lo más barato, y de mercado, a qué precio vender. Aquí tratamos las primeras: [pausa] la tecnología, la pieza sobre la que se construyen los costes y la oferta."
        guion: ["Restricciones técnicas (la producción), económicas (los costes) y de mercado", "> Aquí, las técnicas: modelizar la tecnología"]
      - di: "¿Por qué importa? [pausa] De la tecnología salen los costes, la oferta y la remuneración de los factores; la función agregada es el núcleo del crecimiento, y las diferencias de tecnología explican el comercio. Y en política económica, la elasticidad de sustitución decide si la automatización reduce la participación del trabajo en la renta, y los rendimientos a escala, si un mercado tiende al monopolio natural."
        parte: Relevancia
        guion: ["Micro: costes, oferta, remuneración de los factores · Macro: crecimiento", "Comercio: diferencias de tecnología", "Política: σ y la participación del trabajo · rendimientos y monopolio natural"]
      - di: "La reflexión es antigua: Hesíodo ve en el trabajo la respuesta a la escasez y Jenofonte elogia la división del trabajo. Turgot formula en 1767 la ley de las proporciones variables, base de los rendimientos decrecientes de los clásicos, y Wicksteed, Clark y Wicksell, la función de producción."
        parte: Contextualización
        guion: ["Hesíodo y Jenofonte: escasez y división del trabajo", "Turgot (1767): proporciones variables · clásicos (1815)", "Wicksteed (1894), Clark (1899), Wicksell (1901): la función de producción"]
      - di: "Marshall ordena el análisis por plazos; Cobb y Douglas estiman la primera función de producción en 1928; Hicks y Joan Robinson definen la elasticidad de sustitución, y Koopmans y Debreu dan a la tecnología su enfoque axiomático."
        guion: ["Marshall (1890): plazos · Cobb y Douglas (1928)", "Hicks (1932), Robinson (1933): σ", "Koopmans (1951), Debreu (1959): enfoque axiomático"]
      - di: "De ahí, las preguntas clave. ¿Cómo se representa lo que una empresa puede producir? ¿Cómo responde la producción cuando cambia un factor, cuando cambian todos o cuando cambia la tecnología? ¿Cómo se miden la sustitución y la escala? Y ¿qué cambia con varios productos?"
        parte: Problemática
        guion: ["¿Cómo se representa lo que se puede producir?", "¿Cómo responde a un factor, a todos y a la tecnología?", "¿Cómo se miden la sustitución y la escala? ¿Y con varios productos?"]
      - di: "La exposición sigue tres bloques: la tecnología, con el conjunto de posibilidades de producción, la función de producción y sus isocuantas; las leyes temporales de la producción, del corto al muy largo plazo, y la empresa multiproducto. [pausa] De lo posible, a cómo varía con el plazo y con varios productos."
        parte: Estructura
        guion: ["I. La tecnología: conjunto, función de producción, isocuantas y σ", "II. Leyes temporales: corto, largo y muy largo plazo", "III. Empresa multiproducto: caja de Edgeworth y producción conjunta"]

  # ==================================================================== I
  - bloque: "I. La tecnología"
    titulo: "I. La tecnología: definición y propiedades de la función de producción"
    modo: pizarra
    rejilla: "100"
    pasos:
      - di: "Paso al primer bloque: la tecnología. Adelanto la conclusión: [pausa] con unos pocos axiomas se obtiene una función de producción, y sus isocuantas miden, con un solo número, la facilidad para sustituir factores."
        guion: "Conclusión anticipada: de los axiomas a la función de producción; las isocuantas y σ miden la sustitución"
      - di: "Seguiremos el método de la teoría del consumidor, en tres pasos, que esquematizo. Primero, el conjunto de posibilidades de producción, i griega caligráfica, y de él, sus axiomas."
        pizarra: [{grafico: esquema-tecnologia, capa: 2, zona: "1", alto: 0.8}]
        guion: "1. Conjunto de posibilidades de producción y sus axiomas"
      - di: "Segundo, con un solo producto, la función de producción, cu igual a efe de zeta. Tercero, sus curvas de nivel, las isocuantas, con la relación marginal de sustitución técnica y la elasticidad de sustitución, sigma."
        pizarra: [{grafico: esquema-tecnologia, capa: 4}]
        guion: "2. Función de producción · 3. Isocuantas, RMST y σ"
      - di: "Con varios productos, la frontera será una función de transformación, en el tercer bloque. Y añadiendo los precios de los factores llegaríamos a los costes y a la dualidad, el paso siguiente de la teoría de la empresa."
        pizarra: [{grafico: esquema-tecnologia, capa: 6}]
        guion: "Varios productos: función de transformación · con precios: costes y dualidad"

  - bloque: "I. La tecnología"
    titulo: "I.1. Conjunto tecnológico: el conjunto de posibilidades de producción"
    modo: pizarra
    rejilla: "36|64"
    pasos:
      - di: "Empiezo por lo más general. Con ese bienes, cada plan de producción es un vector de producción neta, un netput, que escribo: sus componentes negativos son factores empleados, y los positivos, productos obtenidos."
        pizarra: [{formula: '\vect{y}=(y_1,\dots,y_S)\in\mathbb{R}^S', zona: "1", tam: 0.8}]
        guion: "Netput: negativos, factores; positivos, productos"
        apunte: "Conjunto de posibilidades de producción (Mas-Colell, Whinston y Green, 1995, cap. 5): todos los planes que permite la tecnología"
      - di: "El conjunto de posibilidades de producción, i griega caligráfica, reúne todos los planes posibles. Lo dibujo con dos bienes, i griega uno e i griega dos."
        pizarra:
          - {formula: '\mathcal{Y}\subset\mathbb{R}^S', zona: "1", tam: 0.8}
          - {grafico: conjunto-produccion, capa: 1, zona: "2"}
        guion: "Dos bienes: y₁ e y₂"
      - di: "Trazo su frontera, que baja del segundo cuadrante al cuarto pasando por el origen, y sombreo el conjunto. Primer axioma, que escribo: no vacío. Hay al menos un plan posible; si no, no habría actividad productiva."
        pizarra:
          - {grafico: conjunto-produccion, capa: 2}
          - {formula: '(1)\ \ \mathcal{Y}\neq\varnothing', zona: "1", tam: 0.8, alinear: izquierda}
        guion: "Axioma 1: no vacío"
      - di: "Segundo: el conjunto es cerrado, incluye su frontera, como señala la flecha. El límite de una sucesión de planes posibles también es posible, y eso garantiza un máximo de producción para cada vector de factores: [pausa] de ahí saldrá la función de producción."
        pizarra:
          - {grafico: conjunto-produccion, capa: 3}
          - {formula: '(2)\ \ \mathcal{Y}\ \text{cerrado}', zona: "1", tam: 0.8, alinear: izquierda}
        guion: "Axioma 2: cerrado (existe un máximo)"
      - di: "Tercero, la eliminación gratuita: si un plan es posible, también lo es cualquiera que use más factores u obtenga menos productos. En el gráfico, si con la cantidad de factor del plan i griega cero se produce i griega dos cero, la misma producción puede lograrse con más factor, en el plan i griega uno. Todo el sudoeste de un plan posible es posible, [pausa] y por eso la frontera es no creciente."
        pizarra:
          - {grafico: conjunto-produccion, capa: 4}
          - {formula: '(3)\ \ \vect{y}\in\mathcal{Y},\ \vect{y}\,''\leq\vect{y}\ \Rightarrow\ \vect{y}\,''\in\mathcal{Y}', zona: "1", tam: 0.8, alinear: izquierda}
        guion: "Axioma 3: eliminación gratuita (el «sudoeste» es posible)"
      - di: "Cuarto, la imposibilidad de producción gratuita: no se obtiene nada sin emplear algún factor. Formalmente, la intersección del conjunto con el ortante positivo se reduce, como mucho, al vector cero. En el gráfico, el primer cuadrante, donde todos los componentes son positivos, queda excluido: ningún plan da productos sin usar factores. [pausa] Como los dos primeros, es un axioma poco discutible, y junto con el tercero da forma a la frontera: decreciente y apoyada en el origen."
        pizarra:
          - {grafico: conjunto-produccion, capa: 5}
          - {formula: '(4)\ \ \mathcal{Y}\cap\mathbb{R}^S_+\subseteq\{\vect{0}\}', zona: "1", tam: 0.8, alinear: izquierda}
        guion: "Axioma 4: imposibilidad de producción gratuita"
      - di: "Se suele añadir la posibilidad de inacción, que señalo en el origen: el vector cero pertenece al conjunto, la empresa puede no producir. No se cumple si hay costes hundidos, como a corto plazo."
        pizarra: [{grafico: conjunto-produccion, capa: 6}]
        guion: "Inacción: la empresa puede no producir (no con costes hundidos)"
      - di: "Aquí la tecnología permite usar cada bien como factor o como producto. Si el bien uno solo pudiera ser factor y el dos solo producto, el cuarto cuadrante, que rayo, desaparecería."
        pizarra: [{grafico: conjunto-produccion, capa: 7}]
      - di: "Y con una dotación dada del bien uno, lo que queda a la izquierda de esa vertical no es factible; fijar un factor recorta igual el conjunto a corto plazo."
        pizarra: [{grafico: conjunto-produccion, capa: 8}]
        guion: "Dotación dada: a su izquierda, no factible"
      - di: "La frontera reúne los planes técnicamente eficientes. Y para cada nivel de producción, cu, el conjunto de requerimientos, uve de cu, que escribo, reúne las combinaciones de factores que permiten obtener al menos cu: [pausa] su frontera será la isocuanta."
        pizarra: [{formula: 'V(q)=\{\vect{z}\geq\vect{0}:\ (q,-\vect{z})\in\mathcal{Y}\}', zona: "1", tam: 0.8}]
        guion: "Frontera: planes técnicamente eficientes · V(q): conjunto de requerimientos"
        apunte: "Axiomas necesarios (1-4): permiten la función de producción · deseables (inacción, convexidad): buen comportamiento"

  - bloque: "I. La tecnología"
    titulo: "I.2. La función de producción: definición y propiedades"
    modo: pizarra
    rejilla: "30(48/52)|35|35"     # 1a: las funciones clave, que se quedan hasta el final
    pasos:
      - di: "Una vez definido el conjunto, paso a la función de producción, la primera función clave, que recuadro en esta esquina porque volveremos a ella. Con un solo producto, da la máxima producción que permite la tecnología con cada vector de factores: cu igual a efe de zeta es el máximo de cu, [pausa] sujeto a que el plan, cu y menos zeta, pertenezca al conjunto de posibilidades de producción."
        pizarra: [{formula: '\funcionclave{q=F(\vect{z})\equiv\optim{\max}{q\geq 0}{q}{(q,-\vect{z})\in\mathcal{Y}}}', zona: "1a", tam: 0.62}]
        guion: "Función clave, en la esquina: se queda hasta el final"
        apunte: "Función de producción: relación técnica entre los factores y la máxima producción; solo recoge los métodos técnicamente eficientes"
      - di: "Con trabajo y capital, la vemos en tres dimensiones, en el apoyo: en la base, zeta ele y zeta ka; en vertical, la producción. Sale del origen, porque sin factores no se produce nada; sube con los dos factores, y se aplana arriba. [pausa] Será el mapa de toda la exposición."
        apoyo: {grafico: funcion-produccion-3d, capa: 2, zona: "2"}
        guion: "Superficie de producción: la altura es la producción máxima"
        apunte: "Wicksteed (1894): la producción como función general de los factores, P = f(a, b, c, …)"
      - di: "Tomo un vector de factores, zeta cero, y subo en vertical hasta la superficie: esa altura, efe de zeta cero, es lo máximo que se produce con él."
        borrar: ["2"]
        apoyo: {grafico: funcion-produccion-3d, capa: 4, zona: "2"}
        guion: "F(z⁰): la producción máxima con z⁰"
      - di: "Debajo de la superficie quedan los planes posibles; encima, los imposibles. Por construcción, la función solo recoge los métodos técnicamente eficientes."
        borrar: ["2"]
        apoyo: {grafico: funcion-produccion-3d, capa: 5, zona: "2"}
        guion: "Solo métodos técnicamente eficientes"
      - di: "De los axiomas salen sus propiedades, que escribo debajo. Es cardinal, porque el producto se mide en unidades físicas. Efe de cero es cero, por la imposibilidad de producción gratuita y la inacción. Y es no decreciente, por la eliminación gratuita: las productividades marginales no son negativas. Además, se supone continua y dos veces diferenciable."
        pizarra: [{formula: 'F(\vect{0})=0,\qquad \mathrm{PMg}_i\equiv\frac{\partial F}{\partial z_i}\geq 0', zona: "1b", tam: 0.8}]
        guion: "Cardinal · F(0) = 0 · no decreciente · continua y diferenciable"
        apunte: "Diferenciable: supuesto instrumental (factores continuamente sustituibles, infinitas técnicas, producto divisible)"
      - di: "Los axiomas no dicen nada de su curvatura: hacen falta propiedades de escala del conjunto, y la más importante es la convexidad. A la derecha trazo los ejes y un conjunto con su frontera cóncava."
        pizarra: [{grafico: convexidad-conjunto, capa: 2, zona: "3", alto: 0.55}]
        guion: "Propiedades de escala: divisibilidad, aditividad, rendimientos constantes, convexidad, irreversibilidad"
      - di: "Es convexo: si los planes a y be son posibles, también lo es cualquier combinación de los dos, como ce, sobre el segmento que los une."
        pizarra: [{grafico: convexidad-conjunto, capa: 4}]
        guion: "Convexidad: c = τa + (1 − τ)b también es posible"
      - di: "Y aquí hay que distinguir dos cosas, que escribo. [pausa] Si la función es cuasicóncava, las isocuantas son convexas, pero eso no dice nada de la escala. El conjunto es convexo si y solo si la función es cóncava, con rendimientos no crecientes. Y la concavidad implica la cuasiconcavidad, pero no al revés."
        pizarra: [{formula: '\begin{array}{l}\mathcal{Y}\ \text{convexo}\ \Leftrightarrow\ F\ \text{cóncava}\\[4pt] F\ \text{cóncava}\ \Rightarrow\ F\ \text{cuasicóncava}\end{array}', zona: "3", tam: 0.75}]
        guion: "F cuasicóncava: isocuantas convexas · conjunto convexo si y solo si F es cóncava"
        apunte: "Una Cobb-Douglas con α + β > 1 es cuasicóncava, pero no cóncava: rendimientos crecientes"
      - di: "La diferencia importa: [pausa] con rendimientos constantes o crecientes, maximizar el beneficio no es un problema acotado; minimizar costes solo exige cuasiconcavidad. La función de buen comportamiento añade rendimientos constantes y las condiciones de Inada."
        guion: "Buen comportamiento: rendimientos constantes, PMg > 0 y decrecientes, Inada"
        apunte: "Inada (1963): la PMg de cada factor tiende a infinito cuando el factor tiende a 0 y a 0 cuando tiende a infinito"

  - bloque: "I. La tecnología"
    titulo: "I.3. Las curvas isocuantas: RMST y elasticidad de sustitución"
    modo: pizarra
    pasos:
      - di: "Paso a sus curvas de nivel, las isocuantas: las combinaciones de factores que, usadas eficientemente, dan la misma producción. Las escribo debajo de la función. Son el corte de la superficie a la altura cu barra, proyectado sobre la base."
        borrar: true
        conservar: ["1a"]
        pizarra: [{formula: '\{\vect{z}:\ F(\vect{z})=\overline{q}\}', zona: "1b", tam: 0.8}]
        apunte: "Isocuanta: curva de nivel de la superficie de producción y frontera del conjunto de requerimientos V(q)"
      - di: "Como las curvas de indiferencia, hay infinitas, las más alejadas dan más producto, no se cortan, decrecen y son convexas si la función es cuasicóncava; pero son cardinales. Dibujo una, convexa, en el plano del trabajo y el capital."
        pizarra: [{grafico: isocuantas-rmst, capa: 2, zona: "2"}]
        guion: "Infinitas · más lejos, más producto · no se cortan · pendiente negativa · convexas · cardinales"
      - di: "En el punto A trazo la tangente y su triángulo: el capital que puede dejar de usarse al emplear una unidad más de trabajo sin que cambie la producción. Es la relación marginal de sustitución técnica, que escribo al lado: menos de zeta ka entre de zeta ele, igual al cociente de las productividades marginales. [pausa] Aquí es alta."
        pizarra: [{grafico: isocuantas-rmst, capa: 3}]
        guion: "RMST: capital que libera una unidad más de trabajo = cociente de las PMg del trabajo y del capital"
        apunte: "Con el signo menos, la RMST es positiva: la isocuanta es decreciente por la eliminación gratuita"
      - di: "En be, con más trabajo y menos capital, la tangente es más plana: la relación marginal de sustitución técnica decrece a lo largo de la isocuanta. Pero depende de las unidades."
        pizarra: [{grafico: isocuantas-rmst, capa: 4}]
        guion: "RMST decreciente; depende de las unidades"
      - di: "Las curvas que unen puntos de igual pendiente en distintas isocuantas son las isoclinas: rectas por el origen si la función es homotética."
        guion: "Isoclinas: igual RMST; rectas por el origen si F es homotética"
      - di: "Para medir la sustituibilidad sin depender de las unidades, Hicks y Joan Robinson definen la elasticidad de sustitución, sigma, la segunda función clave, que recuadro en la esquina, debajo de la primera. Es la variación porcentual de la proporción entre capital y trabajo ante una variación porcentual de la relación marginal de sustitución técnica: [pausa] mide la curvatura de la isocuanta."
        pizarra: [{formula: '\funcionclave{\sigma\equiv\frac{d\ln(z_K/z_L)}{d\ln\mathrm{RMST}_{LK}}\geq 0}', zona: "1a", tam: 0.6}]
        guion: "Segunda función clave, en la esquina"
        apunte: "Hicks (1932): «una medida de la facilidad con la que el factor variable puede sustituirse por otros»"
      - di: "Cuanto mayor es sigma, más fácil es sustituir. Y decide el reparto. Escribo el cociente de las rentas del trabajo y del capital: el salario relativo entre la proporción de capital por trabajador. [pausa] Si sigma es menor que uno, una subida del salario relativo aumenta la participación del trabajo; si es mayor, la reduce."
        pizarra: [{formula: '\frac{w_Lz_L}{w_Kz_K}=\frac{w_L/w_K}{z_K/z_L}', zona: "3", tam: 0.8}]
        guion: "σ < 1: sube el salario relativo, sube la participación del trabajo"
        apunte: "Si la empresa minimiza costes, la RMST iguala el salario relativo: σ mide cuánto sustituye trabajo por capital cuando el salario relativo sube un 1 %"

  - bloque: "I. La tecnología"
    titulo: "I.3. Las curvas isocuantas: la función Cobb-Douglas"
    modo: pizarra
    pasos:
      - di: "Sigma ordena las formas funcionales. La primera, la Cobb-Douglas, que escribo: A por zeta ka elevado a alfa por zeta ele elevado a beta, con A el nivel tecnológico y alfa y beta, las elasticidades-producto."
        borrar: true
        conservar: ["1a"]
        pizarra: [{formula: 'q=A\,z_K^{\alpha}z_L^{\beta},\qquad A,\alpha,\beta>0', zona: "1b", tam: 0.85}]
        apunte: "Cobb y Douglas (1928): exponentes ≈ 1/4 (capital) y 3/4 (trabajo) en la industria de EE. UU., 1899-1922"
      - di: "Cada productividad marginal es el exponente por la productividad media. La relación marginal de sustitución técnica depende solo de la proporción de factores, y de ahí sale que sigma, la de la esquina, vale uno en todo punto."
        pizarra: [{formula: '\mathrm{PMg}_L=\beta\,\frac{q}{z_L},\quad \mathrm{RMST}_{LK}=\frac{\beta}{\alpha}\,\frac{z_K}{z_L}\ \Rightarrow\ \sigma=1', zona: "2", tam: 0.85}]
        guion: "PMg = exponente × PMe · σ = 1"
      - di: "En el apoyo, su superficie: los cortes horizontales, proyectados sobre la base, son las isocuantas, convexas y asintóticas a los ejes."
        apoyo: {grafico: superficie-produccion, capa: 3, zona: "3"}
        guion: "Curvas de nivel: las isocuantas"
      - di: "Es homogénea de grado alfa más beta, como escribo: rendimientos crecientes, constantes o decrecientes según esa suma supere, iguale o no alcance uno."
        pizarra: [{formula: 'F(\lambda\vect{z})=\lambda^{\alpha+\beta}F(\vect{z})', zona: "2", tam: 0.85}]
        guion: "Homogénea de grado α + β"
      - di: "Con rendimientos constantes y factores pagados por su productividad marginal, el teorema de Euler, que escribo, agota el producto, y las participaciones son constantes: alfa para el capital y uno menos alfa para el trabajo. [pausa] El precio de esa sencillez es imponer sigma igual a uno."
        pizarra: [{formula: 'q=\mathrm{PMg}_K\,z_K+\mathrm{PMg}_L\,z_L', zona: "2", tam: 0.85}]
        guion: "Euler: el producto se agota · participaciones constantes α y 1 − α"
        apunte: "Por eso en macroeconomía Y = A·Kᵅ·L¹⁻ᵅ, con α la participación del capital en la renta"

  - bloque: "I. La tecnología"
    titulo: "I.3. Las curvas isocuantas: la función CES y la de Leontief"
    modo: pizarra
    pasos:
      - di: "Para estimar sigma hace falta la CES, de elasticidad de sustitución constante, de Arrow, Chenery, Minhas y Solow: A por la suma ponderada de los factores elevados a ro, todo elevado a nu entre ro. Su elasticidad de sustitución, uno entre uno menos ro, es constante."
        borrar: true
        conservar: ["1a"]
        pizarra: [{formula: 'q=A\Big[\sum_{i}a_i\,z_i^{\rho}\Big]^{\nu/\rho},\qquad \sigma=\frac{1}{1-\rho}', zona: "1b", tam: 0.85}]
        apunte: "Arrow, Chenery, Minhas y Solow (1961): la CES generaliza la Cobb-Douglas a cualquier σ constante"
      - di: "Lo vemos con sus isocuantas. Trazo los ejes, un punto común a todas y el rayo en el que capital y trabajo guardan la proporción a entre be."
        pizarra: [{grafico: ces-isocuantas, capa: 1, zona: "2"}]
      - di: "Cuando sigma tiende a cero, obtenemos la de coeficientes fijos de Leontief, que escribo: el mínimo de zeta ka entre a y zeta ele entre be, con isocuantas en ángulo recto."
        pizarra:
          - {grafico: ces-isocuantas, capa: 2}
          - {formula: '\sigma\to 0:\ \ q=\min\{z_K/a;\ z_L/b\}', zona: "3", tam: 0.8}
        guion: "σ = 0: Leontief (ángulo recto)"
      - di: "Con sigma cero coma cinco, una isocuanta muy curvada; con sigma cinco, casi recta."
        pizarra: [{grafico: ces-isocuantas, capa: 3}]
      - di: "Con sigma uno, la Cobb-Douglas que ya conocemos."
        pizarra: [{grafico: ces-isocuantas, capa: 4}]
        guion: "σ = 1: Cobb-Douglas"
      - di: "Y con sigma infinita, la lineal, de sustitutivos perfectos: isocuantas rectas. [pausa] Son límites, no casos exactos."
        pizarra: [{grafico: ces-isocuantas, capa: 5}]
        guion: "σ infinita: lineal (sustitutivos perfectos)"
      - di: "En la de Leontief, fuera del vértice, el factor que sobra no produce nada: [pausa] minimizar costes es producir en el vértice, y la proporción eficiente no depende de los precios."
        guion: "Leontief: proporción eficiente independiente de los precios; coste lineal"
        apunte: "Cassel (1918): coeficientes técnicos fijos · Leontief (1936): tablas input-output · Koopmans (1951): varias técnicas, isocuantas poligonales"
      - di: "¿Y los datos? [pausa] Sigma entre capital y trabajo se estima por debajo de uno: entre cero coma cuatro y cero coma seis según Chirinko. La Cobb-Douglas es una simplificación cómoda, no un hecho empírico."
        guion: "Evidencia: σ < 1"
        apunte: "Chirinko (2008): σ entre 0,4 y 0,6 · Gechert et al. (2022): ≈ 0,3"
      - di: "Recapitulando: los axiomas dan la función de producción, y sigma mide la sustitución; las dos se quedan en la esquina. [pausa] Y la superficie será el mapa del bloque siguiente: cada plazo, un corte de ella."
        guion: "Recapitulación: axiomas, función de producción, isocuantas, RMST y σ"

  # ==================================================================== II
  - bloque: "II. Leyes temporales de la producción"
    titulo: "II. Análisis de la función de producción: las leyes temporales de la producción"
    modo: pizarra
    rejilla: "30(48/52)|70"
    conservar: ["1a"]
    pasos:
      - di: "Paso al segundo bloque: las leyes temporales de la producción. ¿Cómo responde la producción cuando cambian los factores o la tecnología? Adelanto la conclusión: [pausa] los tres plazos de Marshall son tres cortes de la misma superficie, con tres leyes: rendimientos decrecientes, rendimientos a escala y progreso técnico."
        guion: "Conclusión anticipada: tres plazos, tres cortes de la superficie"
      - di: "Los plazos de Marshall no son periodos de calendario, sino grados de libertad de la empresa. Volvemos a la superficie de producción, la de la esquina, ahora con un nivel tecnológico, a sub cero. [pausa] Lo que cambia de un plazo a otro es qué puede mover la empresa sobre ella."
        apoyo: {grafico: plazos-3d, capa: 2, zona: "2"}
        guion: "Superficie A₀F(z)"
        apunte: "Marshall (1890), libro V, cap. V: los plazos son grados de libertad, no periodos de calendario"
      - di: "A corto plazo, el capital es fijo. Cortamos la superficie por el plano zeta ka barra, y la curva es la producción a corto plazo, que escribo: cu igual a efe de zeta ele y zeta ka barra."
        borrar: ["2"]
        apoyo: {grafico: plazos-3d, capa: 3, zona: "2"}
        pizarra: [{formula: '\text{Corto: }q=F(z_L,\overline{z}_K)', zona: "1b", tam: 0.8, alinear: izquierda}]
        guion: "Corto plazo: corte con el capital fijo"
      - di: "A largo plazo, todo es variable. Los cortes horizontales de la superficie, proyectados sobre la base, son las isocuantas."
        borrar: ["2"]
        apoyo: {grafico: plazos-3d, capa: 4, zona: "2"}
        guion: "Largo plazo: isocuantas"
      - di: "Y si aumentamos todos los factores en la misma proporción, nos movemos por un rayo desde el origen. Su plano vertical corta la superficie en la curva efe de lambda zeta barra, que escribo: [pausa] mide los rendimientos a escala."
        borrar: ["2"]
        apoyo: {grafico: plazos-3d, capa: 5, zona: "2"}
        pizarra: [{formula: '\text{Largo: }q=F(\lambda\overline{\vect{z}})', zona: "1b", tam: 0.8, alinear: izquierda}]
        guion: "Largo plazo: corte por un rayo desde el origen"
      - di: "Y el muy largo plazo, los movimientos seculares de Marshall. Aquí ya no nos movemos sobre la superficie: [pausa] es la superficie la que sube. Es el progreso técnico, que escribo: a sub uno por efe de zeta, con a sub uno mayor que a sub cero."
        borrar: ["2"]
        apoyo: {grafico: plazos-3d, capa: 6, zona: "2"}
        pizarra: [{formula: '\text{Muy largo: }A_1F(\vect{z}),\ A_1>A_0', zona: "1b", tam: 0.8, alinear: izquierda}]
        guion: "Muy largo plazo: la superficie se desplaza hacia arriba (A₁ > A₀)"

  - bloque: "II. Leyes temporales de la producción"
    titulo: "II.1. Corto plazo: región económica de la producción"
    modo: pizarra
    pasos:
      - di: "Empiezo por el corto plazo, el corte con el capital fijo, que resalto. Como deja fuera planes posibles, [pausa] la producción máxima a largo plazo es siempre al menos la de corto, y el coste a largo será la envolvente de los de corto."
        borrar: true
        conservar: ["1a"]
        apoyo: {grafico: plazos-3d-corto, capa: 5, zona: "1b"}
        guion: "Corto plazo: el capital, fijo; un subconjunto del conjunto de largo plazo"
      - di: "Una advertencia al tribunal: [pausa] la función clásica de corto plazo, pasado un máximo, decrece, e incumple la eliminación gratuita. Se mantiene por historia, porque Cassels sistematiza las etapas en 1936, antes de la axiomática, y porque delimita dónde es eficiente producir."
        guion: "Se relaja la eliminación gratuita: motivo histórico y didáctico"
        apunte: "Cassels (1936), «On the Law of Variable Proportions»: las etapas de la producción"
      - di: "Lo muestra su mapa de isocuantas, en el apoyo. Arriba, donde las tangentes son verticales, la productividad marginal del capital es nula: la línea de contorno superior. Abajo, donde son horizontales, es nula la del trabajo: la inferior. [pausa] Las dos son isoclinas, y entre ellas, sombreada, está la región económica de la producción, con las dos productividades marginales positivas."
        apoyo: {grafico: region-economica, capa: 7, zona: "2"}
        guion: "Líneas de contorno (isoclinas): PMg del capital y del trabajo nulas · región económica: las dos PMg positivas"
      - di: "Con el capital fijo en zeta ka barra, al añadir trabajo subimos de isocuanta hasta A; a partir de ahí, más trabajo lleva a isocuantas más bajas: [pausa] la productividad marginal del trabajo es negativa. Con las condiciones de Inada, como en la Cobb-Douglas, toda la función está en la región económica."
        guion: "Más allá de A: PMg del trabajo negativa · con Inada, todo es región económica"
        apunte: "Con las condiciones de Inada la RMST nunca es 0 ni ∞: no hay líneas de contorno"

  - bloque: "II. Leyes temporales de la producción"
    titulo: "II.1. Corto plazo: productividad y etapas de la producción"
    modo: pizarra
    rejilla: "30(48/52)|40|30"
    conservar: ["1a"]
    pasos:
      - di: "Con el capital fijo, dibujo el producto total: crece primero a ritmo creciente, después decreciente, hasta un máximo, y luego cae. Es la ley de las proporciones variables de Turgot."
        pizarra: [{grafico: corto-plazo, capa: 2, zona: "2"}]
        apunte: "Turgot (1767): proporciones variables · West, Malthus, Ricardo y Torrens (1815): rendimientos decrecientes de la tierra"
      - di: "La productividad marginal, que escribo, es la derivada del producto total respecto al trabajo, con el capital constante: la pendiente de la tangente, máxima en el punto de inflexión."
        pizarra:
          - {formula: '\mathrm{PMg}_L=\frac{\partial F(z_L,\overline{z}_K)}{\partial z_L}', zona: "1b", tam: 0.85}
          - {grafico: corto-plazo, capa: 3}
        guion: "PMg: pendiente de la tangente; máxima en la inflexión"
      - di: "La productividad media es el producto total entre el trabajo: la pendiente del rayo desde el origen. Es máxima donde ese rayo es tangente al producto total, en el punto que marco."
        pizarra:
          - {formula: '\mathrm{PMe}_L=\frac{q}{z_L}', zona: "1b", tam: 0.85}
          - {grafico: corto-plazo, capa: 4}
        guion: "PMe: pendiente del rayo; máxima donde el rayo es tangente"
      - di: "El producto total alcanza su máximo donde la productividad marginal se anula."
        pizarra: [{grafico: corto-plazo, capa: 5}]
      - di: "Debajo, en el segundo panel, los ejes de las productividades. La marginal sube hasta la inflexión y después cae, hasta hacerse negativa."
        pizarra: [{grafico: corto-plazo, capa: 7}]
      - di: "La media corta a la marginal en su máximo. ¿Por qué? [pausa] Mientras la marginal supera a la media, la media crece; cuando queda por debajo, la media cae."
        pizarra: [{grafico: corto-plazo, capa: 8}]
        guion: "PMg = PMe en el máximo de la PMe"
        apunte: "dPMe/dz = (PMg − PMe)/z: se anula cuando PMg = PMe"
      - di: "Quedan dos márgenes: el extensivo, u óptimo técnico, en el máximo de la productividad media, y el intensivo, o máximo técnico, donde el producto total es máximo."
        pizarra: [{grafico: corto-plazo, capa: 9}]
        guion: "Margen extensivo (óptimo técnico) e intensivo (máximo técnico)"
      - di: "Y las tres etapas de Cassels. En la primera sobra factor fijo y se produce extensivamente; en la tercera sobra factor variable y su productividad marginal es negativa. [pausa] La empresa que maximiza el beneficio produce en la segunda."
        pizarra: [{grafico: corto-plazo, capa: 10}]
        guion: "Se produce en la etapa II"
      - di: "Las ordena la elasticidad-producto, que escribo a la derecha: la productividad marginal por el trabajo entre la producción, es decir, el cociente entre la marginal y la media. Como resume la tabla: mayor que uno en la primera etapa, uno en el margen extensivo, entre cero y uno en la segunda, y negativa en la tercera."
        pizarra: [{formula: '\varepsilon_{q,z_L}\equiv\frac{\partial q}{\partial z_L}\,\frac{z_L}{q}=\frac{\mathrm{PMg}_L}{\mathrm{PMe}_L}', zona: "3", tam: 0.8}]
        apoyo:
          formula: '\begin{array}{lcc}\text{Tramo} & \text{PMg y PMe} & \varepsilon_{q,z_L}\\ \hline \text{Etapa I} & \mathrm{PMg}_L>\mathrm{PMe}_L & >1\\ \text{Margen extensivo} & \mathrm{PMg}_L=\mathrm{PMe}_L & =1\\ \text{Etapa II} & 0<\mathrm{PMg}_L<\mathrm{PMe}_L & (0,1)\\ \text{Margen intensivo} & \mathrm{PMg}_L=0 & =0\\ \text{Etapa III} & \mathrm{PMg}_L<0 & <0\end{array}'
          zona: "3"
        guion: "ε > 1 (I) · 0 < ε < 1 (II) · ε < 0 (III)"
      - di: "En suma, a corto plazo los rendimientos decrecientes delimitan las etapas. [pausa] ¿Y si la empresa ajusta todos sus factores?"
        guion: "Recapitulación del corto plazo"

  - bloque: "II. Leyes temporales de la producción"
    titulo: "II.2. Largo plazo: rendimientos a escala"
    modo: pizarra
    rejilla: "30(48/52)|35|35"
    conservar: ["1a"]
    pasos:
      - di: "Una vez estudiado el corto plazo, paso al largo, el corte por un rayo desde el origen, que resalto en la superficie. ¿Cómo responde la producción cuando todos los factores varían en la misma proporción, lambda? Son los rendimientos a escala, que defino: para lambda mayor que uno, efe de lambda zeta mayor, igual o menor que lambda por efe de zeta, según sean crecientes, constantes o decrecientes."
        apoyo: {grafico: plazos-3d-largo, capa: 5, zona: "3"}
        pizarra: [{formula: '\lambda>1:\ \ F(\lambda\vect{z})\gtreqless\lambda F(\vect{z})', zona: "1b", tam: 0.8}]
        guion: "Variación equiproporcional de todos los factores: λ"
      - di: "Lo vemos en el plano. En el primer panel trazo los ejes, un rayo desde el origen y, sobre él, las isocuantas de niveles cu, dos cu y tres cu. Si la producción crece en mayor proporción que los factores, cada unidad más exige menos factores, y las isocuantas están cada vez más juntas: rendimientos crecientes."
        pizarra: [{grafico: rendimientos-escala-isocuantas, capa: 1, zona: "2"}]
        guion: "Crecientes: isocuantas cada vez más juntas"
      - di: "En el segundo, si la producción crece en la misma proporción que los factores, las isocuantas son equidistantes: duplicar los factores duplica la producción. Ocurre si las plantas se pueden replicar sin estorbarse: el conjunto de producción es un cono y la función, homogénea de grado uno."
        pizarra: [{grafico: rendimientos-escala-isocuantas, capa: 2}]
        guion: "Constantes: equidistantes (el conjunto es un cono)"
      - di: "En el tercero, si crece en menor proporción, las isocuantas están cada vez más separadas: rendimientos decrecientes. ¿Por qué ocurre cada caso? [pausa] Los crecientes se deben a la especialización, como en la fábrica de alfileres, y a las indivisibilidades; los decrecientes, a las dificultades de dirección y a los factores que no se pueden ampliar."
        pizarra: [{grafico: rendimientos-escala-isocuantas, capa: 3}]
        guion: "Decrecientes: cada vez más separadas"
        apunte: "Crecientes: especialización, indivisibilidades · Decrecientes: dirección, factores no ampliables"
      - di: "Y en el último panel, las isocuantas primero se juntan y después se separan: los rendimientos cambian con la escala, porque ninguna empresa crece sin límite con la misma eficiencia. [pausa] Volveremos a este caso, sin duda el más realista."
        pizarra: [{grafico: rendimientos-escala-isocuantas, capa: 4}]
        guion: "Variables: primero más juntas, después más separadas"
      - di: "Formalmente, se miden con la elasticidad de escala, que escribo: la variación porcentual de la producción ante una variación porcentual de todos los factores, mayor, igual o menor que uno. El caso más sencillo son las funciones homogéneas de grado ka, cuya elasticidad de escala es ka en todo punto; y las homotéticas, transformaciones crecientes de una homogénea, tienen isoclinas rectas por el origen."
        pizarra: [{formula: '\varepsilon_{q,\lambda}\equiv\frac{dq/q}{d\lambda/\lambda}', zona: "1b", tam: 0.8}]
        guion: "Elasticidad de escala mayor, igual o menor que 1: crecientes, constantes, decrecientes"
        apunte: "Homogénea de grado k: F(λz) = λᵏF(z) · teorema de Euler: Σ PMgᵢ zᵢ = k F(z)"

  - bloque: "II. Leyes temporales de la producción"
    titulo: "II.2. Largo plazo: rendimientos globales y locales a escala"
    modo: pizarra
    rejilla: "30(48/52)|70(42/58)"
    conservar: ["1a"]
    pasos:
      - di: "Esto lleva a los dos conceptos del título. Los rendimientos globales son una propiedad de toda la tecnología; los locales se miden en un punto, [pausa] y pueden cambiar con el tamaño. En el apoyo, una función homogénea de grado uno, la raíz de zeta ele por zeta ka."
        apoyo: {grafico: rendimientos-globales-locales-superficies, capa: 1, zona: "2a"}
        guion: "Globales: toda la tecnología · locales: en un punto"
      - di: "Debajo trazo los ejes, lambda en horizontal y la producción en vertical, y su corte por el rayo: una recta que sale del origen, con elasticidad de escala igual a uno en todo punto. [pausa] Rendimientos constantes en todos los puntos y en todos los rayos: globales, y coinciden con los locales."
        pizarra: [{grafico: rendimientos-globales-locales-cortes, capa: 1, zona: "2b"}]
        guion: "(a) Rendimientos globales constantes"
        apunte: "Globales: propiedades de escala del conjunto (cono, divisibilidad, aditividad) · las homogéneas de grado k, el caso más sencillo"
      - di: "Al lado, el ejemplo de Jehle y Reny: kappa entre uno más la inversa de zeta ele por zeta ka. Su superficie sale del origen muy plana, se empina y se aplana hasta una meseta, a la altura kappa."
        borrar: ["2a"]
        apoyo: {grafico: rendimientos-globales-locales-superficies, capa: 2, zona: "2a"}
        guion: "(b) Tecnología «en S»"
      - di: "Su corte frente a lambda, que dibujo, es una curva en ese. Es la ley de los rendimientos a escala variables, la ley ultra passum de Frisch: crecientes cuando la empresa es pequeña, por las indivisibilidades, y decrecientes cuando es grande, por las dificultades de dirección."
        pizarra: [{grafico: rendimientos-globales-locales-cortes, capa: 2}]
        guion: "(b) Rendimientos locales variables"
        apunte: "Frisch (1965): regular ultra passum law · rendimientos «wicksellianos»"
      - di: "El rayo desde el origen es tangente a la curva en lambda asterisco: ahí la elasticidad de escala local es exactamente uno."
        pizarra: [{grafico: rendimientos-globales-locales-cortes, capa: 3}]
        guion: "En λ*, elasticidad de escala 1"
      - di: "Escribo esa elasticidad de escala local: la suma de cada productividad marginal por su factor, entre la producción; es decir, la suma de las elasticidades-producto. [pausa] Une el corto y el largo plazo, y en la Cobb-Douglas es alfa más beta."
        pizarra: [{formula: '\varepsilon_{q,\lambda}(\vect{z})=\frac{\sum_i\mathrm{PMg}_i\,z_i}{F(\vect{z})}=\sum_i\varepsilon_{q,z_i}', zona: "1b", tam: 0.8}]
        guion: "Elasticidad de escala local: suma de las elasticidades-producto"
        apunte: "Jehle y Reny (2011), cap. 3"
      - di: "Antes de lambda asterisco, en verde, la producción crece más que la escala: rendimientos locales crecientes. Después, en naranja, crece menos: decrecientes. [pausa] Es la tecnología que está detrás de los costes medios en forma de U."
        pizarra: [{grafico: rendimientos-globales-locales-cortes, capa: 4}]
        guion: "Crecientes antes de λ*, decrecientes después"
      - di: "Ojo: los rendimientos no son las economías de escala, propiedad de los costes, aunque coinciden con tecnologías homotéticas. Basu y Fernald encuentran en la industria estadounidense rendimientos constantes o algo decrecientes. [pausa] Recapitulando: la elasticidad de escala, global o local, mide la respuesta al tamaño."
        guion: "Rendimientos (tecnología) ≠ economías de escala (costes) · evidencia: constantes o algo decrecientes"
        apunte: "Hanoch (1975): elasticidad de escala = CMe/CMg en la senda de mínimo coste · Basu y Fernald (1997)"

  - bloque: "II. Leyes temporales de la producción"
    titulo: "II.3. Muy largo plazo: progreso técnico"
    modo: pizarra
    rejilla: "30(48/52)|70(64/36)"
    conservar: ["1a"]
    pasos:
      - di: "Tras el corto y el largo plazo, con la tecnología dada, paso al muy largo plazo, en el que cambia la propia tecnología: hay progreso técnico, de proceso, que produce más con los mismos factores, o de producto. La superficie sube y la isocuanta se acerca al origen, como en el apoyo."
        apoyo: {grafico: plazos-3d-muy-largo, capa: 4, zona: "1b"}
        guion: "Progreso técnico: de proceso o de producto"
      - di: "Desde Hicks, se clasifica por su efecto sobre el reparto de la renta: [pausa] es neutral si no altera una relación concreta entre las productividades marginales, y sesgado, ahorrador de trabajo o de capital, si la altera."
        guion: "Neutral o sesgado (ahorrador de trabajo o de capital)"
      - di: "Hay tres criterios, que rotulo bajo tres paneles: el de Hicks, a por efe, aumentador del producto; el de Solow, con a multiplicando al capital, y el de Harrod, con a multiplicando al trabajo. En el primero trazo los ejes, una isocuanta y dos rayos desde el origen."
        pizarra: [{grafico: progreso-tecnico-neutral, capa: 1, zona: "2a"}]
        guion: "Hicks: aumentador del producto · Solow: del capital · Harrod: del trabajo"
      - di: "Con el de Hicks, la nueva isocuanta se acerca al origen por cada rayo con la misma pendiente: [pausa] para una proporción de factores dada, la relación marginal de sustitución técnica no cambia. Es el supuesto con el que se mide la productividad total de los factores."
        pizarra: [{grafico: progreso-tecnico-neutral, capa: 2}]
        guion: "Hicks: RMST constante para una proporción de factores dada"
      - di: "Con el de Solow, la isocuanta se contrae solo en la dirección del capital, que se mide en unidades de eficiencia; con el trabajo por unidad de producto dado, las participaciones no cambian."
        pizarra: [{grafico: progreso-tecnico-neutral, capa: 3}]
        guion: "Solow: participaciones constantes con el trabajo por unidad de producto dado"
      - di: "Con el de Harrod, se contrae en la dirección del trabajo, un trabajo que aprende; con el capital por unidad de producto dado, las participaciones no cambian."
        pizarra: [{grafico: progreso-tecnico-neutral, capa: 4}]
        guion: "Harrod: participaciones constantes con el capital por unidad de producto dado"
      - di: "Son tres criterios distintos, no una jerarquía. [pausa] Con una Cobb-Douglas coinciden, como escribo debajo: el mismo progreso puede escribirse como aumentador del capital o del trabajo, cambiando el exponente de a sub te."
        pizarra: [{formula: 'A_t\,z_K^{\alpha}z_L^{\beta}=\big(A_t^{1/\alpha}z_K\big)^{\alpha}z_L^{\beta}=z_K^{\alpha}\big(A_t^{1/\beta}z_L\big)^{\beta}', zona: "2b", tam: 0.8}]
        guion: "Con Cobb-Douglas, las tres neutralidades coinciden"
      - di: "Y aquí vuelve sigma, la de la esquina: con sigma menor que uno, el progreso aumentador del capital eleva más la productividad marginal del trabajo: [pausa] está sesgado hacia el trabajo."
        guion: "Aumentar un factor ≠ sesgar el progreso a su favor"
        apunte: "Acemoglu (2009), cap. 15: con σ < 1, el progreso aumentador del capital está sesgado hacia el trabajo"
      - di: "Importa por el teorema de Uzawa: el crecimiento equilibrado exige progreso aumentador del trabajo, neutral en sentido de Harrod, y por eso el modelo de Solow lo supone."
        guion: "Uzawa: el crecimiento equilibrado exige neutralidad de Harrod"
        apunte: "Uzawa (1961): una senda de crecimiento equilibrado exige progreso aumentador del trabajo"
      - di: "Recapitulando el bloque: cada plazo es un corte de la superficie, con su ley; los rendimientos decrecientes, los rendimientos a escala y el progreso técnico. Hasta aquí, un solo producto. [pausa] ¿Qué cambia cuando se obtienen varios con los mismos factores?"
        guion: "Recapitulación: tres plazos, tres cortes"

  # ==================================================================== III
  - bloque: "III. Empresa multiproducto"
    titulo: "III.1. La caja de Edgeworth: curva de contrato y frontera de posibilidades de producción"
    modo: pizarra
    rejilla: "30(48/52)|70"
    conservar: ["1a"]
    pasos:
      - di: "Paso al tercer bloque: la empresa multiproducto. Adelanto la conclusión: [pausa] con varios productos hay que asignar bien los factores, en la curva de contrato, y la frontera pasa a ser una función de transformación."
        guion: "Conclusión anticipada: curva de contrato y función de transformación"
      - di: "Empiezo por dos bienes, equis e i griega, cada uno con su función de producción, como la de la esquina, en procesos separados y con dotaciones fijas de trabajo y de capital: lo que usa uno no lo usa el otro."
        pizarra: [{formula: '\begin{array}{l}X=F_X(L_X,K_X),\quad Y=F_Y(L_Y,K_Y)\\[4pt] L_X+L_Y=\overline{L},\quad K_X+K_Y=\overline{K}\end{array}', zona: "1b", tam: 0.8}]
        guion: "Dos bienes, dos factores, dotaciones fijas"
      - di: "Para construir la caja de Edgeworth, dibujo el mapa de isocuantas de equis, con su origen abajo a la izquierda."
        pizarra: [{grafico: formacion-caja, capa: 1, zona: "2"}]
      - di: "Al lado, el mapa de isocuantas de i griega, con su origen, que giro ciento ochenta grados para que quede arriba, a la derecha, frente al de equis."
        pizarra: [{grafico: formacion-caja, capa: 2}]
        guion: "Giro de 180° del mapa de Y"
      - di: "Y los superpongo: los ejes cierran un rectángulo de lados ele barra y ka barra, las dotaciones totales de trabajo y de capital. Cada punto de la caja es un reparto de los factores: lo que no va a equis, va a i griega."
        pizarra: [{grafico: formacion-caja, capa: 3}]
        guion: "La caja: cada punto, un reparto de los factores"
      - di: "Borro y dibujo la caja con sus orígenes, o equis y o i griega; dentro, las isocuantas de equis, que crecen hacia arriba a la derecha, y las de i griega, hacia abajo a la izquierda."
        borrar: ["2"]
        pizarra: [{grafico: caja-edgeworth-fpp, capa: 3, zona: "2"}]
      - di: "En A, donde se cortan, se emplean todos los factores, pero [pausa] estar sobre la isocuanta de cada bien ya no garantiza la eficiencia."
        pizarra: [{grafico: caja-edgeworth-fpp, capa: 4}]
        guion: "A: ineficiente"
      - di: "Reasignando factores, podemos ir a be, con más equis y la misma i griega, o a ce, con más i griega y la misma equis. En be y en ce las isocuantas son tangentes."
        pizarra: [{grafico: caja-edgeworth-fpp, capa: 5}]
        guion: "B y C: tangencias"
      - di: "La asignación es técnicamente eficiente cuando las relaciones marginales de sustitución técnica de los dos bienes son iguales, como escribo. Sus tangencias forman la curva de contrato, de un origen al otro."
        pizarra:
          - {formula: '\mathrm{RMST}^X_{LK}=\mathrm{RMST}^Y_{LK}', zona: "1b", tam: 0.75}
          - {grafico: caja-edgeworth-fpp, capa: 6}
        guion: "Curva de contrato: RMST iguales"
      - di: "Llevando cada punto de la curva de contrato al plano de los productos, obtenemos la frontera de posibilidades de producción, con be y ce sobre ella; A, ineficiente, queda dentro."
        pizarra: [{grafico: caja-edgeworth-fpp, capa: 8}]
        guion: "FPP: combinaciones técnicamente eficientes"
      - di: "Su pendiente, que rotulo en be, es la relación marginal de transformación, menos de i griega entre de equis: el coste de oportunidad de una unidad más de equis. Escribo a la izquierda que es igual al cociente de los costes marginales. [pausa] Es la análoga de la relación marginal de sustitución técnica."
        pizarra:
          - {grafico: caja-edgeworth-fpp, capa: 9}
          - {formula: '\mathrm{RMT}_{XY}=\frac{\mathrm{CMg}_X}{\mathrm{CMg}_Y}', zona: "1b", tam: 0.75}
        guion: "RMT: coste de oportunidad de X"
      - di: "El progreso técnico y más dotaciones la desplazan hacia fuera. ¿Y quién lleva a la curva de contrato? [pausa] La competencia perfecta: todas las empresas pagan los mismos precios por los factores, y sus relaciones marginales de sustitución técnica se igualan."
        pizarra: [{grafico: caja-edgeworth-fpp, capa: 10}]
        guion: "FPP′: progreso técnico o más dotaciones · competencia perfecta: RMST iguales"
        apunte: "FPP estrictamente cóncava con rendimientos decrecientes; lineal con rendimientos constantes e intensidades iguales"
      - di: "Pero la caja supone procesos separables. [pausa] No recoge un proceso que da varios productos a la vez."
        guion: "Límite: procesos separables"

  - bloque: "III. Empresa multiproducto"
    titulo: "III.2. La empresa multiproducto y la producción conjunta"
    modo: pizarra
    rejilla: "30(48/52)|35|35"
    conservar: ["1a"]
    pasos:
      - di: "Paso a los procesos que dan varios productos a la vez. Ya no sirve la función de producción: la frontera se describe con una función de transformación, te de i griega, menor o igual que cero. [pausa] La de la esquina es su caso con un solo producto: te igual a cu menos efe de zeta."
        pizarra: [{formula: '\mathcal{Y}=\{\vect{y}:\ T(\vect{y})\leq 0\}', zona: "1b", tam: 0.8}]
        apunte: "La función de producción es el caso de un solo producto: T(q, −z) = q − F(z)"
      - di: "Con dos productos y unos factores dados, es la curva de transformación de la empresa. Trazo los ejes de los dos productos y la curva, cóncava si el conjunto es convexo; debajo, sombreados, los planes posibles."
        pizarra: [{grafico: transformacion-empresa, capa: 2, zona: "2"}]
        guion: "Curva de transformación de la empresa"
      - di: "Su pendiente es la relación marginal de transformación de la empresa, que rotulo: menos de cu dos entre de cu uno, lo que hay que dejar de producir del bien dos para obtener una unidad más del uno, con los mismos factores. En A trazo la tangente y su triángulo. A la derecha escribo que es igual al cociente de las derivadas de te. Crece al especializarse."
        pizarra:
          - {grafico: transformacion-empresa, capa: 3}
          - {formula: '\mathrm{RMT}_{12}=\frac{\partial T/\partial q_1}{\partial T/\partial q_2}', zona: "3", tam: 0.75}
        guion: "RMT₁₂: coste de oportunidad del bien 1"
      - di: "Con precios dados, la empresa elige el punto en el que esa relación iguala el precio relativo de los productos, como rotulo: la recta de isobeneficio es tangente a la curva en A."
        pizarra: [{grafico: transformacion-empresa, capa: 4}]
        guion: "Óptimo: RMT = p₁/p₂"
      - di: "Y con más factores o con progreso técnico, la curva se desplaza hacia fuera, como la frontera de la economía, y la empresa puede producir más de los dos bienes."
        pizarra: [{grafico: transformacion-empresa, capa: 5}]
      - di: "Hay producción conjunta en sentido estricto cuando un proceso da varios productos a la vez: en proporciones fijas, como la carne y el cuero de Marshall, o variables, como en el refino del petróleo."
        guion: "Proporciones fijas (carne y cuero) o variables (refino del petróleo)"
        apunte: "Marshall (1890), libro V, cap. VI: oferta conjunta · con proporciones fijas no hay forma técnica de imputar el coste a cada producto"
      - di: "¿Por qué producir juntos? [pausa] Por los factores compartidos, como instalaciones o marca: son la base de las economías de alcance de Panzar y Willig, que escribo: producir los dos juntos cuesta menos que por separado."
        pizarra: [{formula: 'C(q_1,q_2)<C(q_1,0)+C(0,q_2)', zona: "3", tam: 0.8}]
        guion: "Economías de alcance: factores compartidos"
        apunte: "Panzar y Willig (1981): economías de alcance · con las de escala, subaditividad y monopolio natural multiproducto"
      - di: "Recapitulando: con varios productos, la eficiencia exige la curva de contrato, y la frontera es una función de transformación. Como la de producción, solo dice qué es posible: [pausa] qué se produce lo decidirán los precios."
        guion: "Recapitulación: curva de contrato y función de transformación"

  # ==================================================================== CONCLUSIÓN
  - bloque: Conclusión
    titulo: Conclusión
    modo: guion
    estructura: [Recapitulación, Relevancia, Extensiones, Opinión, Idea final]
    pasos:
      - di: "En conclusión, hemos caracterizado la tecnología en tres pasos: unos pocos axiomas la resumen en una función de producción, cuyas isocuantas y sigma miden la sustitución; los plazos de Marshall son tres cortes de su superficie, y con varios productos la eficiencia exige además la curva de contrato."
        parte: Recapitulación
        guion: ["I. Axiomas, función de producción, isocuantas y σ", "II. Corto, largo y muy largo plazo: tres cortes de la superficie", "III. Curva de contrato y función de transformación"]
      - di: "La forma de la tecnología decide resultados. En España, los asalariados recibieron el 48,4 por ciento del PIB en 2025, y la caída de esa participación desde los años 80 es difícil de explicar con sigma igual a uno."
        parte: Relevancia
        guion: ["Remuneración de los asalariados: 48,4 % del PIB (España, 2025)", "> Caída desde los años 80: difícil con σ = 1"]
      - di: "La exposición abre varias puertas: los costes y la dualidad, la oferta según la estructura de mercado, la controversia de los dos Cambridge sobre el capital y el crecimiento endógeno con rendimientos crecientes."
        parte: Extensiones
        guion: ["Costes y dualidad · oferta y estructura de mercado", "Controversia de los dos Cambridge · crecimiento endógeno"]
      - di: "En mi opinión, la función de producción es una idealización poderosa, pero trata a la empresa como una caja negra que transforma factores en productos."
        parte: Opinión
        guion: ["Idealización poderosa: la empresa como caja negra"]
      - di: "Volvamos a la pregunta del principio: ¿puede una sola función resumir todo lo que una empresa sabe hacer? [pausa 800] Resume lo que puede producir, no lo que producirá ni cómo se organiza por dentro: es el mapa de lo técnicamente posible sobre el que los precios, los costes y los mercados trazarán después la elección. [pausa] Y lo que queda dentro de la caja negra, los contratos y los incentivos, es lo que viene a abrir la organización industrial."
        parte: Idea final
        guion: ["¿Una sola función resume lo que una empresa sabe hacer?", "> Lo que puede producir, no lo que producirá ni cómo se organiza", "> El mapa de lo técnicamente posible; precios, costes y mercados eligen después", "Dentro de la caja negra: la organización industrial"]
