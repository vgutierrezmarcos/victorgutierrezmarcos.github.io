  Cassels: Cásels
  Cassel: Kásel
  Koopmans: Kúpmans
  Wicksteed: Uíksted
  Wicksell: Víksel
  Turgot: Turgó
  Harrod: Járod
  Solow: Sólou
  Inada: Ináda
  Euler: Óiler
  Robinson: Róbinson
  Joan: Yóun
  Malthus: Máltus
  Torrens: Tórens
  West: Güest
  Clark: Klark
  Chenery: Chéneri
  Minhas: Mínjas
  Chirinko: Chirínko
  Gechert: Guéjert
  Frisch: Frish
  Basu: Básu
  Fernald: Férnald
  Hanoch: Jánok
  Jehle: Yéle
  Reny: Réni
