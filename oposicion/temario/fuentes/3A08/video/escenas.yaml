tema: 3.A.8
voz: es-ES-AlvaroNeural
velocidad: "+0%"
escenas:

  # ======================================================================
  - apartado: Introducción
    minutos: 3
    pasos:
      - di: "Señores miembros del tribunal: el tema que voy a exponer es el tres A ocho, «Teoría de la demanda del consumidor, primera parte», que comprende los axiomas sobre las preferencias, la función de utilidad y la función de demanda marshalliana, la teoría de la preferencia revelada y los precios hedónicos."
        escribe: "3.A.8 Teoría de la demanda del consumidor (I)"
      - di: "Alfred Marshall definía en 1890 la economía como «el estudio de la humanidad en los asuntos ordinarios de la vida». Pocas decisiones son más ordinarias que la de qué comprar, y esa definición encierra un principio que la teoría neoclásica lleva hasta el final: el individualismo metodológico. Los fenómenos sociales se explican a partir de las metas, las creencias y las acciones de los individuos."
        escribe: "Marshall (1890): individualismo metodológico"
      - di: "El tema es relevante a dos niveles. En el microeconómico, la demanda es el paso previo para determinar el equilibrio de mercado. En el macroeconómico, el consumo es el principal componente de la demanda agregada: en España, el gasto en consumo final de los hogares supuso en 2025 el 54,1 % del PIB."
        escribe: "Relevancia: micro (equilibrio) y macro (consumo: 54 % del PIB)"
      - di: "Históricamente, la teoría parte del concepto de utilidad. Gossen formula en 1854 sus dos leyes: la utilidad marginal decreciente y la igualdad de las utilidades marginales ponderadas por los precios. La revolución marginalista de Jevons, Menger y Walras sitúa la utilidad marginal en el centro de la teoría del valor, y Marshall la sistematiza con una utilidad cardinal en la que, con utilidad marginal del dinero constante, no hay efecto renta."
        escribe: "Gossen, marginalistas, Marshall (cardinal)"
      - di: "Edgeworth idea las curvas de indiferencia, y Pareto advierte que solo importa el orden de las preferencias: es la utilidad ordinal. Slutsky, en 1915, descompone el efecto de un cambio de precio en efecto sustitución y efecto renta; Hicks y Allen, en 1934, reformulan la teoría con la relación marginal de sustitución, y Debreu, en 1959, le da su forma axiomática actual."
        escribe: "Pareto, Slutsky, Hicks y Allen (ordinal), Debreu (1959)"
      - di: "Desde entonces, la teoría se ha acercado a lo observable por tres vías que también forman parte de este tema: la preferencia revelada de Samuelson, en 1938; la producción doméstica de Becker, en 1965, y los precios hedónicos, a los que Rosen da fundamento teórico en 1974."
        escribe: "Samuelson (1938), Becker (1965), Rosen (1974)"
      - di: "La exposición trata de responder a tres preguntas. ¿Cómo se obtiene la demanda de un consumidor a partir de sus preferencias y de su restricción presupuestaria, y cuándo puede hablarse de una demanda de mercado? ¿Cómo varía la demanda cuando cambian la renta y los precios? ¿Y puede construirse la teoría a partir de lo que observamos, en lugar de a partir de preferencias inobservables?"
      - di: "Para ello, organizaré la exposición en tres partes. En la primera construiremos la función de demanda: preferencias y utilidad, restricción presupuestaria y demanda individual, y agregación."
        borrar: true
        escribe: "I. La función de demanda"
      - di: "En la segunda haremos estática comparativa: efecto renta, efecto precio propio y efecto precio cruzado."
        escribe: "II. Estática comparativa"
      - di: "Y en la tercera veremos otros desarrollos: la preferencia revelada, la producción doméstica y los precios hedónicos. Terminaré con una conclusión."
        escribe: "III. Otros desarrollos"

  # ======================================================================
  - apartado: I. La función de demanda
    minutos: 10
    pasos:
      - di: "Comienzo con la primera parte. La teoría neoclásica ordinal parte de dos herramientas. La primera son las preferencias del consumidor sobre el conjunto de elección, el de todas las cestas de bienes posibles."
        borrar: true
        escribe: "I. LA FUNCIÓN DE DEMANDA"
        grafico: esquema-ingredientes
        capa: 1
      - di: "Si las preferencias cumplen ciertos axiomas, pueden representarse mediante una función de utilidad."
        capa: 2
      - di: "La segunda herramienta es la restricción presupuestaria, que determina qué cestas puede comprar."
        capa: 3
      - di: "Combinándolas se plantea el problema de maximización de la utilidad,"
        capa: 4
      - di: "cuya solución es la demanda marshalliana, que depende de los precios y de la renta."
        capa: 5
      - di: "Y sumando las demandas individuales llegaremos a la demanda de mercado."
        capa: 6
      - di: "Trabajaremos con unos supuestos simplificadores: un contexto estático y sin incertidumbre, información perfecta, un consumidor precio-aceptante, bienes homogéneos y perfectamente divisibles, y la decisión de consumo separada de la de oferta de trabajo y de las decisiones intertemporales."

      # ---------------- I.1 ----------------
      - di: "Empezamos por las preferencias. El conjunto de elección está formado por cestas: vectores de cantidades no negativas de cada bien. Sobre él, el consumidor tiene una relación de preferencia débil, «al menos tan buena como», de la que se derivan la preferencia estricta y la indiferencia."
        escribe: "I.1 Preferencias y función de utilidad"
      - di: "Supondremos que esta relación cumple siete axiomas, que voy a dibujar construyendo poco a poco una curva de indiferencia. Los tres primeros son la completitud, todo par de cestas es comparable; la reflexividad, toda cesta es al menos tan buena como sí misma, y la transitividad, que impide que los conjuntos de indiferencia se corten. Juntos hacen de la relación un preorden completo, que es lo que entendemos por racionalidad."
        grafico: axiomas-curva-indiferencia
        capa: 1
        escribe: "> 1-3. Completitud, reflexividad, transitividad: racionalidad"
      - di: "El cuarto axioma es la continuidad: no hay saltos en las preferencias. Su importancia la da el teorema de Debreu: unas preferencias racionales y continuas pueden representarse mediante una función de utilidad continua. Las preferencias lexicográficas son el contraejemplo clásico: son racionales, pero no continuas, y no admiten ninguna función de utilidad."
        capa: 2
        escribe: "> 4. Continuidad: teorema de Debreu"
      - di: "El quinto es la deseabilidad, que tiene varios grados: la insaciabilidad local, que basta para que el consumidor agote su renta; la monotonía, y la monotonía estricta, con la que las curvas de indiferencia son estrictamente decrecientes y las más alejadas del origen dan más utilidad."
        capa: 3
        escribe: "> 5. Deseabilidad (insaciabilidad local, monotonía)"
      - di: "El sexto es la convexidad: una combinación de dos cestas es al menos tan buena como la peor de ellas. Expresa la preferencia por la diversificación y hace que la función de utilidad sea cuasicóncava, de modo que las condiciones de primer orden del problema del consumidor son también suficientes."
        capa: 4
        escribe: "> 6. Convexidad (y convexidad estricta)"
      - di: "Con la convexidad estricta desaparecen los tramos rectos de las curvas de indiferencia, y la demanda será única."
        capa: 5
      - di: "Y el séptimo, la diferenciabilidad, elimina los vértices. No es un axioma sobre la conducta, sino un supuesto de conveniencia técnica que nos permite usar el cálculo diferencial."
        capa: 6
        escribe: "> 7. Diferenciabilidad"
      - di: "Con estos axiomas, la función de utilidad asigna a cada cesta un número real, de forma que una cesta es al menos tan buena como otra si y solo si su utilidad es mayor o igual. Es ordinal: cualquier transformación monótona creciente representa las mismas preferencias. Por eso solo tienen sentido sus propiedades ordinales, como la cuasiconcavidad, y no la utilidad marginal decreciente."
        formula: 'x^1 \succeq x^2 \iff U(x^1)\geq U(x^2)'
      - di: "El valor absoluto de la pendiente de una curva de indiferencia es la relación marginal de sustitución: la cantidad del bien dos a la que el consumidor está dispuesto a renunciar por una unidad más del bien uno, manteniendo su utilidad. Es igual al cociente de las utilidades marginales, y la convexidad hace que sea decreciente."
        formula: 'RMS_{12}=-\left.\frac{dx_2}{dx_1}\right|_{U=\overline{U}}=\frac{U_1}{U_2}'
        escribe: "> RMS = U1/U2 (decreciente); elasticidad de sustitución"
      - di: "Como la relación marginal de sustitución depende de las unidades, se define la elasticidad de sustitución, un número puro que mide la curvatura de las curvas de indiferencia. La función CES la mantiene constante e incluye tres casos: con elasticidad cero, los complementarios perfectos de Leontief; con elasticidad uno, la Cobb-Douglas, y con elasticidad infinita, los sustitutivos perfectos."
        grafico: ces-curvas-indiferencia
        capa: 4

      # ---------------- I.2 ----------------
      - di: "Pasamos al segundo ingrediente, la restricción presupuestaria. Con precios positivos, conocidos y que el consumidor no puede alterar, una cesta es asequible si su coste no supera la renta. Las cestas asequibles forman el conjunto presupuestario walrasiano, que es no vacío, cerrado, acotado si todos los precios son positivos, y convexo."
        borrar: true
        escribe: "I.2 Restricción presupuestaria y demanda individual"
        grafico: solucion-interior-esquina
        capa: 1
      - di: "Con dos bienes, su frontera es la recta de balance, cuya pendiente, el cociente de precios cambiado de signo, es el coste de oportunidad del bien uno que fija el mercado."
        escribe: "> p·x ≤ W; recta de balance con pendiente −p1/p2"
      - di: "El consumidor resuelve entonces el problema de maximización de la utilidad: elige la cesta que maximiza su utilidad sujeto a que el gasto no supere la renta y a que las cantidades no sean negativas. Con una utilidad continua y estrictamente cuasicóncava y un conjunto presupuestario compacto y convexo, la solución existe, es global y es única."
        formula: '\max_{x}\ U(x)\quad\text{sujeto a}\quad p\cdot x\leq\overline{W},\quad x\geq 0'
        escribe: "> Maximización de U: condiciones de Kuhn-Tucker"
      - di: "Como hay restricciones de desigualdad, se resuelve con las condiciones de Kuhn y Tucker. El multiplicador lambda es un precio sombra: la utilidad marginal de la renta. La holgura complementaria nos dice que, para cada bien, o se consume, y entonces su utilidad marginal es igual a lambda por su precio, o no se consume, porque a esos precios no compensa. Y por la insaciabilidad local, lambda es positivo y el consumidor agota su renta."
      - di: "En una solución interior, todos los bienes se consumen y la utilidad marginal por euro gastado es la misma en todos ellos: es la segunda ley de Gossen. Con dos bienes, como vemos en el gráfico, la relación marginal de sustitución se iguala al cociente de precios: la curva de indiferencia es tangente a la recta de balance. La tasa a la que el consumidor está dispuesto a intercambiar los bienes coincide con la que fija el mercado."
        grafico: solucion-interior-esquina
        capa: 2
        escribe: "> Interior: RMS = p1/p2 (segunda ley de Gossen)"
      - di: "En una solución de esquina, algún bien no se consume y la tangencia no tiene por qué cumplirse. Si solo se compra el bien uno, su relación marginal de sustitución es mayor o igual que el cociente de precios: incluso en la esquina, el consumidor valora el bien uno más de lo que le cuesta en el mercado."
        capa: 3
        escribe: "> Esquina: RMS ≥ p1/p2"
      - di: "La solución del problema, expresada en función de los parámetros, es el sistema de demandas marshallianas, que dependen de todos los precios y de la renta. Tiene cuatro propiedades. Existe y es única. Es continua. Es homogénea de grado cero en precios y renta: si se multiplican todos por el mismo número, el conjunto presupuestario no cambia, de modo que no hay ilusión monetaria. Y cumple la ley de Walras: el consumidor gasta toda su renta."
        formula: 'x(kp,k\overline{W})=x(p,\overline{W}),\qquad p\cdot x(p,\overline{W})=\overline{W}'
        escribe: "> x(p, W): homogénea de grado 0 y ley de Walras"
      - di: "Sustituyendo la demanda en la función de utilidad se obtiene la función indirecta de utilidad: la utilidad máxima que se alcanza con unos precios y una renta. De ella se recuperan las demandas mediante la identidad de Roy. Y si damos la vuelta al problema y minimizamos el gasto, llegamos a la dualidad, que se estudia en el tema tres A nueve."
        escribe: "> Utilidad indirecta V(p, W); identidad de Roy"

      # ---------------- I.3 ----------------
      - di: "Pasamos a la agregación. La demanda de mercado de un bien es la suma de las demandas individuales: gráficamente, la suma horizontal de sus curvas de demanda. El primer problema es que, en general, depende de toda la distribución de la renta y no solo de la renta total: si los consumidores tienen efectos renta distintos, una redistribución cambia la demanda aunque la renta total no varíe."
        borrar: true
        quitar_visual: true
        escribe: "I.3 Agregación y efecto renta nulo"
      - di: "La condición de Gorman, de 1953, responde a este problema: la demanda agregada depende solo de los precios y de la renta total si y solo si la función indirecta de utilidad de cada consumidor tiene la forma polar de Gorman, lineal en la renta y con una pendiente común a todos."
        formula: 'V_h(p,\overline{W}_h)=a_h(p)+b(p)\,\overline{W}_h'
        escribe: "> Forma polar de Gorman: curvas de Engel rectas y paralelas"
      - di: "Equivale a que las curvas de Engel de todos los consumidores sean rectas y paralelas: el efecto renta es el mismo para todos,"
        grafico: engel-gorman
        capa: 1
      - di: "de modo que, si un consumidor cede renta a otro, lo que uno deja de comprar lo compra exactamente el otro, y la demanda agregada no cambia."
        capa: 2
      - di: "Hay dos casos particulares: las preferencias homotéticas idénticas y las cuasilineales respecto a un mismo bien numerario, en las que la demanda de los demás bienes no depende de la renta. Es el efecto renta nulo. Si se cumple la condición de Gorman, la economía se comporta como un consumidor representativo."
        escribe: "> Homotéticas idénticas; cuasilineales (efecto renta nulo)"
      - di: "El efecto renta nulo es el caso más usado en equilibrio parcial, porque la demanda marshalliana coincide con la hicksiana y el excedente del consumidor mide exactamente el bienestar. Pero tiene problemas: descarta los bienes inferiores y los Giffen, contradice la evidencia de la ley de Engel y solo es razonable para bienes que pesan poco en el gasto."
      - di: "El segundo problema es que la demanda agregada no hereda todas las propiedades de la individual. Conserva la continuidad, la homogeneidad y la ley de Walras, pero no mucho más: el teorema de Sonnenschein, Mantel y Debreu muestra que cualquier función con esas tres propiedades puede ser el exceso de demanda agregado de alguna economía, de modo que no se garantizan ni la unicidad ni la estabilidad del equilibrio general."
        quitar_visual: true
        escribe: "> Teorema de Sonnenschein-Mantel-Debreu"

  # ======================================================================
  - apartado: II. Estática comparativa
    minutos: 7
    pasos:
      - di: "Hasta aquí hemos respondido a la primera pregunta: qué cesta elige el consumidor. Ahora veremos cómo cambia su elección cuando cambian la renta y los precios, comparando los óptimos sin estudiar el proceso de ajuste: es la estática comparativa. Como la demanda es diferenciable, basta estudiar sus derivadas, que expresaremos como elasticidades, números puros que no dependen de las unidades de medida."
        borrar: true
        escribe: "II. ESTÁTICA COMPARATIVA"

      # ---------------- II.1 ----------------
      - di: "Empezamos por el efecto renta. Si la renta aumenta con los precios constantes, la recta de balance se desplaza en paralelo hacia fuera y obtenemos un nuevo óptimo."
        escribe: "II.1 Efecto renta"
        grafico: renta-consumo-engel
        capa: 1
      - di: "Repitiendo el ejercicio con otros niveles de renta,"
        capa: 2
      - di: "y uniendo los óptimos, obtenemos la curva de renta-consumo. Con preferencias homotéticas sería una semirrecta desde el origen."
        capa: 3
      - di: "Si llevamos cada óptimo a un plano de renta y cantidad, obtenemos la curva de Engel. Su pendiente es el efecto renta: el bien es normal si es positiva, e inferior si es negativa. En el gráfico, el bien uno es normal a rentas bajas e inferior a partir de cierto nivel, como ocurre con bienes que el consumidor sustituye por otros de más calidad cuando se enriquece."
        capa: 4
        escribe: "> Curva de renta-consumo y curva de Engel"
      - di: "La elasticidad-renta permite clasificar los bienes: inferiores, si es negativa; necesarios, si está entre cero y uno, y de lujo, si es mayor que uno."
        escribe: "> Elasticidad-renta: inferior, necesario, de lujo"
      - di: "La regularidad empírica más conocida de la demanda es la ley de Engel, de 1857: el peso de la alimentación en el gasto disminuye a medida que aumenta la renta. Se sigue cumpliendo: según la Encuesta de Presupuestos Familiares del INE, en 2025 los hogares del quintil de menor gasto dedicaron el 19,6 % de su presupuesto a alimentos y bebidas no alcohólicas, frente al 12,3 % del quintil de mayor gasto."
        grafico: epf-alimentos-quintil
        capa: 1
      - di: "La media de todos los hogares fue el 16 %."
        capa: 2
      - di: "Por último, derivando la ley de Walras respecto a la renta se obtiene la agregación de Engel: la media de las elasticidades-renta, ponderada por la participación de cada bien en el gasto, es igual a uno. Por eso no todos los bienes pueden ser inferiores: si la renta aumenta y el consumidor la gasta toda, no puede comprar menos de todo."
        formula: '\sum_{i=1}^{n} s_i\,\varepsilon_{x_i,\overline{W}}=1'
        escribe: "> Agregación de Engel: Σ s·ε renta = 1"

      # ---------------- II.2 ----------------
      - di: "Pasamos al efecto precio propio. Cuando baja el precio del bien uno, la recta de balance gira sobre su corte con el eje del bien dos"
        escribe: "II.2 Efecto precio propio"
        grafico: precio-consumo-demanda
        capa: 1
      - di: "y obtenemos nuevos óptimos."
        capa: 2
      - di: "Uniéndolos, obtenemos la curva de precio-consumo."
        capa: 3
      - di: "Y llevando cada par de precio y cantidad a otro plano, obtenemos la curva de demanda marshalliana del bien, para unos precios de los demás bienes y una renta dados."
        capa: 4
      - di: "La elasticidad-precio propia distingue los bienes ordinarios, si es negativa, de los bienes Giffen, si es positiva. Y la demanda de un bien ordinario es elástica si la elasticidad es menor que menos uno, e inelástica si está entre menos uno y cero: en el primer caso, al subir el precio, el gasto en el bien disminuye."
        escribe: "> Curva de precio-consumo y curva de demanda"
      - di: "Pero un cambio de precio tiene dos consecuencias: cambia el precio relativo y cambia el poder adquisitivo. La ecuación de Slutsky, de 1915, las separa. El efecto total es la suma del efecto sustitución, la derivada de la demanda hicksiana, que mantiene constante la utilidad, y del efecto renta, que es la cantidad demandada multiplicada por la pendiente de la curva de Engel, con signo negativo."
        formula: '\underbrace{\frac{\partial x_i}{\partial p_i}}_{\text{total}}=\underbrace{\frac{\partial h_i(p,\overline{U})}{\partial p_i}}_{\text{sustitución}}\;\underbrace{-\,x_i\,\frac{\partial x_i}{\partial \overline{W}}}_{\text{renta}}'
        escribe: "> Slutsky: efecto total = sustitución + renta"
      - di: "Veámoslo en el gráfico central del tema. El consumidor parte del óptimo A."
        grafico: efecto-sustitucion-renta
        capa: 1
      - di: "Al bajar el precio del bien uno, la nueva recta de balance le lleva al óptimo C, en una curva de indiferencia más alta."
        capa: 2
      - di: "Para separar los dos efectos, trazamos una recta con la nueva pendiente que sea tangente a la curva de indiferencia inicial: es el punto B."
        capa: 3
      - di: "El paso de A a B es el efecto sustitución: con la utilidad constante, el consumidor compra más del bien que se ha abaratado. Es siempre de signo contrario a la variación del precio. El paso de B a C es el efecto renta: el aumento del poder adquisitivo desplaza la recta en paralelo y, si el bien es normal, el consumidor compra todavía más."
        capa: 4
      - di: "En el panel inferior, la demanda marshalliana pasa por A y por C, y la hicksiana, por A y por B. Para un bien normal, la hicksiana es más inclinada, porque solo recoge el efecto sustitución."
        capa: 5
      - di: "De aquí sale la clasificación de los bienes. Un bien normal es siempre ordinario, porque los dos efectos van en el mismo sentido: es la ley de la demanda. Un bien inferior es ordinario si domina el efecto sustitución, y Giffen si domina el efecto renta. Todo bien Giffen es inferior, pero no todo bien inferior es Giffen: además debe pesar mucho en el presupuesto. La evidencia más sólida es la de Jensen y Miller, que en 2008 subvencionaron el arroz a hogares muy pobres de China y observaron que su consumo caía."
        escribe: "> Normal: ordinario. Inferior: ordinario o Giffen"

      # ---------------- II.3 ----------------
      - di: "Por último, el efecto precio cruzado. La elasticidad cruzada define las relaciones brutas: el bien i es sustitutivo bruto del bien j si su demanda aumenta cuando sube el precio de j, y complementario bruto si disminuye. Como se basan en la demanda marshalliana, que incluye el efecto renta, no son simétricas."
        borrar: true
        quitar_visual: true
        escribe: "II.3 Efecto precio cruzado"
      - di: "La ecuación de Slutsky cruzada aísla el efecto sustitución cruzado, que define las relaciones netas: sustitutivos netos si es positivo y complementarios netos si es negativo. Estas sí son simétricas. Y como el efecto sustitución propio es no positivo, cada bien tiene al menos un sustitutivo neto."
        formula: '\frac{\partial x_i}{\partial p_j}=\frac{\partial h_i(p,\overline{U})}{\partial p_j}-x_j\,\frac{\partial x_i}{\partial \overline{W}}'
        escribe: "> Brutos (marshalliana): no simétricos"
      - di: "Las relaciones netas se estudian con detalle, junto a la matriz de Slutsky, en el tema tres A nueve."
        escribe: "> Netos (hicksiana): simétricos"
      - di: "Derivando la ley de Walras respecto a un precio se obtiene la agregación de Cournot: la media ponderada de las elasticidades respecto al precio del bien j es igual a la participación de ese bien cambiada de signo. Junto con la homogeneidad y la agregación de Engel, son las restricciones contrastables de la teoría; la simetría y la negatividad de los efectos sustitución exigen, además, que el consumidor maximice su utilidad."
        formula: '\sum_{i=1}^{n} s_i\,\varepsilon_{x_i,p_j}=-s_j'
        escribe: "> Agregación de Cournot: Σ s·ε cruzada = −s"
      - di: "La teoría permite, por tanto, derivar la demanda individual con restricciones contrastables. Pero tiene limitaciones: las preferencias no se observan, el consumo no exige tiempo y los bienes no se distinguen por su calidad ni por sus características. Son precisamente las tres que abordan los desarrollos de la tercera parte."
        quitar_visual: true

  # ======================================================================
  - apartado: III. Otros desarrollos
    minutos: 7
    pasos:
      - di: "La teoría de la preferencia revelada, de Paul Samuelson en 1938, invierte el enfoque. En lugar de partir de unas preferencias que no se observan, parte de las elecciones del consumidor: frente al enfoque deductivo de la teoría ordinal, sigue un enfoque inductivo. Supone un consumidor individual que, ante cada vector de precios y cada renta, elige una única cesta y gasta toda su renta."
        borrar: true
        escribe: "III. OTROS DESARROLLOS"
      - di: "Si en la situación cero el consumidor elige la cesta x cero cuando también podía comprar la cesta x uno, decimos que x cero se revela preferida a x uno."
        escribe: "III.1 Preferencia revelada (Samuelson, 1938)"
        grafico: adpr-efecto-sustitucion
        capa: 1
      - di: "El axioma débil de la preferencia revelada exige coherencia: si x cero se revela preferida a x uno, en cualquier situación en la que se elija x uno, x cero no puede ser asequible. En el gráfico, con los precios uno el consumidor elige x uno, y x cero queda fuera de su conjunto presupuestario."
        capa: 2
        escribe: "> Axioma débil: coherencia de las elecciones"
      - di: "El axioma débil tiene dos implicaciones. La primera, que la demanda es homogénea de grado cero. La segunda, que el efecto sustitución es no positivo. Partimos de la elección x cero."
        capa: 3
      - di: "Si baja el precio del bien uno y compensamos la renta para que el consumidor pueda seguir comprando x cero, las cestas de la nueva recta situadas a la izquierda de x cero ya eran asequibles antes y no se eligieron. Por el axioma débil, el consumidor elegirá una cesta a la derecha, con más bien uno. Obtenemos así el signo del efecto sustitución sin hablar de utilidad."
        capa: 4
        escribe: "> Homogeneidad y efecto sustitución ≤ 0"
      - di: "Sin embargo, el axioma débil no garantiza la simetría de la matriz de Slutsky, y con más de dos bienes no basta para que exista una utilidad. Houthakker, en 1950, formula el axioma fuerte, que es la transitividad de las preferencias reveladas, y demuestra que una demanda lo cumple si y solo si puede generarse maximizando unas preferencias racionales. La preferencia revelada y la teoría ordinal son, por tanto, equivalentes."
        quitar_visual: true
        escribe: "> Axioma fuerte (Houthakker, 1950): equivalencia"
      - di: "Con un número finito de observaciones, el teorema de Afriat, de 1967, da la condición necesaria y suficiente para que unos datos de precios y cantidades sean compatibles con la maximización de una utilidad: es la base del contraste no paramétrico de la teoría. Su principal crítica la hizo Amartya Sen: si la elección depende del contexto o de compromisos, lo que se revela no es necesariamente el bienestar."
        escribe: "> Afriat (1967): contraste con datos finitos"

      # ---------------- III.2 ----------------
      - di: "La segunda vía es la de las tecnologías del consumo. Gary Becker, en 1965, ve el hogar como una pequeña fábrica que combina bienes de mercado y tiempo para producir lo que de verdad le satisface: una comida, una noche de cine, el cuidado de los hijos. El hogar se enfrenta a una restricción de dinero y a otra de tiempo, que se funden en una sola, la de renta completa: la que obtendría si dedicara todo su tiempo al mercado."
        escribe: "III.2 Producción doméstica (Becker, 1965)"
        formula: '\sum_i \left(p_i x_i + w\,t_i\right) = w\,T + V'
      - di: "Cada actividad tiene así un precio sombra que incluye el coste de oportunidad del tiempo, y el salario pasa a ser también un precio del consumo. Al subir el salario se encarecen las actividades intensivas en tiempo, y los hogares sustituyen tiempo por bienes: comida preparada, guarderías, electrodomésticos. Ayuda a explicar la incorporación de la mujer al mercado de trabajo, cuyo estudio corresponde al tema tres A veinticinco."
        escribe: "> Renta completa; el precio incluye el coste del tiempo"
      - di: "Lancaster, en 1966, propone la otra tecnología del consumo: la utilidad no depende de los bienes, sino de sus características. Es el antecedente de los precios hedónicos."

      # ---------------- III.3 ----------------
      - di: "Muchos bienes son paquetes de características que no se venden por separado: una vivienda, un coche o un ordenador. El método de los precios hedónicos descompone su precio en el valor implícito de cada característica. Es también un método de preferencias reveladas: el precio que se paga revela cómo se valoran las características."
        borrar: true
        quitar_visual: true
        escribe: "III.3 Precios hedónicos"
      - di: "Andrew Court acuña el término en 1939; Zvi Griliches lo convierte en 1961 en un método para ajustar por calidad los índices de precios, y Sherwin Rosen le da fundamento teórico en 1974."
        escribe: "> Court (1939), Griliches (1961), Rosen (1974)"
      - di: "La función hedónica relaciona el precio de mercado del bien con sus características."
        grafico: funcion-hedonica-rosen
        capa: 1
        escribe: "> Función hedónica p(z) y precios implícitos"
      - di: "En el modelo de Rosen, cada consumidor tiene una curva de puja: lo máximo que pagaría por cada nivel de la característica manteniendo su utilidad."
        capa: 2
      - di: "Y cada productor tiene una curva de oferta: lo mínimo que aceptaría manteniendo su beneficio. La función hedónica es la envolvente de ambas: en cada variedad que se compra, la curva de puja del comprador y la de oferta del vendedor son tangentes a ella. Por eso no es una curva de demanda ni de oferta, sino un lugar geométrico de equilibrios."
        capa: 3
      - di: "Su pendiente es el precio implícito de la característica: lo que el mercado paga por una unidad más de ella. En el óptimo, el consumidor iguala la relación marginal de sustitución entre la característica y el resto de bienes a ese precio implícito: es la misma tangencia de la primera parte, ahora sobre una restricción no lineal."
        capa: 4
      - di: "La estimación se hace en dos etapas. Primero se estima la función hedónica con datos de muchas variedades, por ejemplo con una forma semilogarítmica, y se obtienen los precios implícitos. Después se estiman las demandas de cada característica, una etapa con un grave problema de identificación."
        escribe: "> Estimación en dos etapas"
      - di: "Sus aplicaciones son muy relevantes. La primera, ajustar los índices de precios por calidad: el informe Boskin estimó en 1996 que el IPC de Estados Unidos sobrestimaba la inflación en torno a 1,1 puntos al año, en buena parte por no corregir bien los cambios de calidad y los productos nuevos. En España, el INE elabora desde 2008 el Índice de Precios de Vivienda con regresiones hedónicas."
        escribe: "> Aplicaciones: IPC, vivienda, medio ambiente, salarios"
      - di: "La segunda, valorar bienes sin mercado: el valor de vivir frente al Retiro se capitaliza en el precio de la vivienda, y comparando viviendas iguales salvo en esa característica se estima cuánto se paga por ella. Y la tercera, los salarios hedónicos, que descomponen el salario en las características del puesto y permiten estimar el valor estadístico de la vida."
      - di: "Sus límites son la dependencia de la forma funcional y de las variables incluidas, la mala identificación de la segunda etapa y el supuesto de un mercado competitivo, en equilibrio y con información perfecta. En suma, los tres desarrollos acercan la teoría a lo observable."
        quitar_visual: true

  # ======================================================================
  - apartado: Conclusión
    minutos: 3
    pasos:
      - di: "Termino ya."
        borrar: true
        escribe: "CONCLUSIÓN"
      - di: "Hemos construido la demanda marshalliana a partir de unos pocos axiomas sobre las preferencias, de su representación mediante una función de utilidad y de la restricción presupuestaria. Sus propiedades son restricciones contrastables, y su agregación exige condiciones muy restrictivas: la forma polar de Gorman y, en el caso extremo, el efecto renta nulo."
        escribe: "> I. Axiomas, utilidad, demanda x(p, W); Gorman"
      - di: "Hemos analizado cómo responde la demanda a la renta y a los precios, con la descomposición de Slutsky en efecto sustitución y efecto renta, que explica la clasificación de los bienes y la diferencia entre relaciones brutas y netas."
        escribe: "> II. Slutsky: sustitución y renta"
      - di: "Y hemos visto tres desarrollos que acercan la teoría a lo observable: la preferencia revelada, la producción doméstica y los precios hedónicos."
        escribe: "> III. Preferencia revelada, Becker, hedónicos"
      - di: "En cuanto a su valoración, es una de las construcciones lógicas más acabadas de la economía: de las preferencias se llega a la demanda, y gracias a la preferencia revelada puede recorrerse el camino inverso. Su estatus empírico es más discutible. Las restricciones de homogeneidad y simetría se han rechazado con frecuencia al estimar sistemas de demanda con datos agregados. Friedman defendió en 1953 que basta con que los consumidores se comporten como si maximizaran su utilidad."
        escribe: "Valoración: «como si» (Friedman), economía conductual"
      - di: "Y la economía conductual ha documentado desviaciones sistemáticas de los axiomas: la racionalidad limitada de Simon, la teoría de las perspectivas de Kahneman y Tversky o el efecto dotación de Thaler. Aun así, sigue siendo el punto de partida del análisis: los desarrollos conductuales la amplían más que sustituirla, y el teorema de Afriat permite contrastarla con datos sin suponer formas funcionales."
      - di: "El tema enlaza con muchos otros: con la dualidad, la medición del bienestar y los sistemas de demanda del tema tres A nueve; con la incertidumbre y las decisiones intertemporales, en los temas tres A diez y tres A veintinueve; con el equilibrio parcial y general; con la oferta de trabajo, y con la diferenciación de productos."
        escribe: "Extensiones: 3.A.9, 3.A.10, 3.A.16, 3.A.21, 3.A.29"
      - di: "En definitiva, la teoría de la demanda del consumidor es el primer ladrillo del análisis de los mercados: sin entender cómo eligen los consumidores no puede explicarse cómo se forman los precios, ni medirse la inflación cuando cambia la calidad de los bienes, ni valorarse el bienestar que una política gana o pierde. Muchas gracias."
