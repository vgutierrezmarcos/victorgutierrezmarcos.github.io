# Guion de escenas del vídeo del cante del tema 3.A.8 (formato en scripts/temario/generar-video.py).
# Dice lo mismo que guion-cante.md: el texto de cada «di» es el del cante.
# Rehecho el 18/10/2026 con las reglas de CRITERIOS.md § 8 y la lista de instrucciones de Víctor
# (tema aprobado el 17/10/2026). Funciones clave (\funcionclave del tema): el problema de
# maximización de la utilidad (eq:pmu, con \optim) y la demanda marshalliana (eq:scedm), recuadradas
# en morado en la columna 1 (22 % del ancho) desde I.2 hasta el final: cada apartado tiene su
# rejilla y las conserva con «conservar», porque la exposición vuelve a ellas (FIU y Roy, Slutsky y
# las elasticidades, la maximización que exigen la simetría y el signo, Houthakker, Becker y Rosen).
# 3D solo como apoyo que avanza por estados; nada se escribe dos veces (el esquema de la
# clasificación de los bienes se construye de II.1 a II.2).
# Autor: Víctor Gutiérrez Marcos
tema: 3.A.8
duracion: 1800
voz: {motor: voicestudio, motor_tts: omnivoice, velocidad: 1.0, referencia: /mnt/c/Users/vgutierrez/Documents/voz/referencia-12s.wav}   # voz clonada de Víctor con OmniVoice (VoiceStudio)
pronunciacion:
  Kuhn: Kun
  Tucker: Táker
  Sonnenschein: Sónenshain
  Mantel: Mántel
  Bernoulli: Bernúli
  Jensen: Yénsen
  Miller: Míler
  Hunan: Junán
  Gronau: Gronáu
  Enthoven: Éntoven
bloques:
  - {nombre: Introducción, minutos: 2.5}
  - {nombre: "I. Fundamentos de la elección racional", minutos: 11}
  - {nombre: "II. Estática comparativa", minutos: 8}
  - {nombre: "III. Otros desarrollos", minutos: 7.5}
  - {nombre: Conclusión, minutos: 1}

escenas:

  # ==================================================================== INTRODUCCIÓN
  - bloque: Introducción
    titulo: Introducción
    modo: guion
    estructura: [Enganche, Relevancia, Contextualización, Problemática, Estructura]
    pasos:
      - di: "¿Puede una teoría explicar lo que elegimos sin ver lo que queremos? [pausa 800] Marshall definía la economía como «el estudio de la humanidad en los asuntos ordinarios de la vida», y pocas decisiones son más ordinarias que qué comprar. Detrás hay un principio de método, el individualismo metodológico: lo social se explica desde individuos que deciden."
        parte: Enganche
        guion: ["¿Puede una teoría explicar lo que elegimos sin ver lo que queremos?", "Marshall (1890): «los asuntos ordinarios de la vida»", "> Individualismo metodológico"]
      - di: "Los consumidores demandan bienes y ofrecen factores, y optimizan sujetos a un presupuesto. Aquí modelizamos sus decisiones en los mercados de bienes, para explicar las cestas que observamos."
        guion: ["Consumidores: demandan bienes, ofrecen factores; optimizan", "> Objetivo: modelizar sus decisiones y explicar las cestas observadas"]
      - di: "¿Por qué importa? En lo microeconómico, la demanda es el paso previo para determinar el equilibrio de mercado. En lo macroeconómico, es la base del consumo, el principal componente de la demanda agregada: en España, el gasto en consumo final de los hogares fue en 2025 el 54,1 por ciento del PIB."
        parte: Relevancia
        guion: ["Micro: paso previo al equilibrio de mercado", "Macro: consumo de los hogares = 54,1 % del PIB (España, 2025)"]
      - di: "En cuanto al contexto, la teoría parte de la utilidad. Bernoulli usa ya en 1738 la utilidad marginal decreciente, y Gossen formula sus dos leyes. Con la revolución marginalista de los años 70 del siglo diecinueve, Jevons, Menger y Walras la ponen en el centro del valor, y Marshall la trata como cardinal."
        parte: Contextualización
        guion: ["Bernoulli (1738), Gossen (1854)", "Revolución marginalista (1871-1874): Jevons, Menger, Walras", "> Marshall (1890): utilidad cardinal"]
      - di: "Edgeworth idea las curvas de indiferencia, y Pareto advierte que solo importa el orden: la utilidad es ordinal. Slutsky separa en 1915 el efecto sustitución del efecto renta, Hicks y Allen lo reformulan sin utilidad marginal, y Debreu da en 1959 a la teoría su forma axiomática."
        guion: ["Edgeworth (1881), Pareto (1906): utilidad ordinal", "Slutsky (1915), Hicks y Allen (1934), Debreu (1959)"]
      - di: "Después, la teoría se acerca a lo observable por tres vías: la preferencia revelada de Samuelson y Houthakker, que Afriat lleva a datos finitos; la producción doméstica de Becker, y los precios hedónicos, de Court y Griliches a Rosen."
        guion: ["Hacia lo observable:", "> Samuelson (1938), Houthakker (1950), Afriat (1967)", "> Becker (1965)", "> Court (1939), Griliches (1961), Rosen (1974)"]
      - di: "De ahí, las preguntas clave. ¿Cómo se obtiene la demanda de un consumidor a partir de sus preferencias y de su presupuesto, y cuándo puede hablarse de una demanda de mercado? ¿Cómo varía cuando cambian la renta y los precios? Y [pausa] ¿puede construirse la teoría desde lo que se observa, y no desde unas preferencias que nadie ve?"
        parte: Problemática
        guion: ["¿Cómo se obtiene la demanda? ¿Y la de mercado?", "¿Cómo responde a la renta y a los precios?", "¿Puede construirse desde lo observable?"]
      - di: "Para responderlas, la exposición sigue tres bloques. Primero, los fundamentos de la elección racional: los ingredientes, el equilibrio y su solución, hasta la demanda de mercado. Segundo, la estática comparativa, con la ecuación de Slutsky en el centro. Y tercero, tres desarrollos que acercan la teoría a lo observable. Del modelo a sus implicaciones y, por último, a los datos."
        parte: Estructura
        guion: ["I. Fundamentos: ingredientes, equilibrio y solución", "II. Estática comparativa: renta y precios (Slutsky)", "III. Preferencia revelada, producción doméstica y precios hedónicos"]

  # ==================================================================== I
  - bloque: "I. Fundamentos de la elección racional"
    titulo: "I. Fundamentos de la teoría de la elección racional"
    modo: pizarra
    rejilla: "100"
    pasos:
      - di: "Paso al primer bloque: los fundamentos de la elección racional. ¿Qué cesta elige el consumidor? Adelanto la conclusión: [pausa] unos pocos axiomas sobre las preferencias y un presupuesto lineal bastan para obtener una demanda con propiedades contrastables; agregarla, en cambio, exige mucho."
        borrar: true
        guion: "Conclusión anticipada: pocos axiomas y un presupuesto lineal dan una demanda contrastable; agregarla exige mucho"
      - di: "El camino tiene dos herramientas. La primera, unas preferencias que, si cumplen ciertos axiomas, se representan con una función de utilidad."
        apoyo: {grafico: esquema-ingredientes, capa: 2, zona: "1"}
        guion: "Preferencias que cumplen unos axiomas: función de utilidad"
      - di: "La segunda, la restricción presupuestaria. Juntas plantean el problema de maximización de la utilidad."
        borrar: ["1"]
        apoyo: {grafico: esquema-ingredientes, capa: 4, zona: "1"}
        guion: "Con la restricción presupuestaria: problema de maximización de la utilidad"
      - di: "Su solución es la demanda marshalliana y, sumando, la de mercado. Todo, con un consumidor precio-aceptante y sin incertidumbre."
        borrar: ["1"]
        apoyo: {grafico: esquema-ingredientes, capa: 6, zona: "1"}
        guion: "De la demanda marshalliana a la de mercado"
        apunte: "Supuestos: estático y sin incertidumbre, información perfecta, precio-aceptante, bienes divisibles y homogéneos"

  - bloque: "I. Fundamentos de la elección racional"
    titulo: "I.1. Ingredientes: conjunto de elección y preferencias"
    modo: pizarra
    rejilla: {columnas: [48, 52], filas: {1: [22, 78]}}
    pasos:
      - di: "Empiezo por los ingredientes, y el primero es el conjunto de elección, ese: las cestas de bienes, vectores con la cantidad de cada bien, de equis uno a equis ene."
        pizarra: [{formula: 'S\subseteq\mathbb{R}^n_+,\ \ \vect{x}=(x_1,\dots,x_n)', zona: "1a", tam: 0.85}]
        guion: "Cestas de bienes: vectores de cantidades"
        apunte: "S: no vacío, cerrado, acotado inferiormente y convexo (bienes perfectamente divisibles)"
      - di: "Sobre él, las preferencias son una relación binaria, y la primitiva es la preferencia débil: [pausa] equis cero es al menos tan buena como equis uno. De ella salen la estricta y la indiferencia, como en el apoyo."
        apoyo: {grafico: preferencias-venn, capa: 7, zona: "1b"}
        guion: "Preferencia débil: x⁰ es «al menos tan buena» como x¹"
        apunte: "Preferencia estricta: x⁰ ≽ x¹ y no x¹ ≽ x⁰ · indiferencia: x⁰ ≽ x¹ y x¹ ≽ x⁰"
      - di: "Para cada cesta, la relación define tres conjuntos. Trazo los ejes de los dos bienes y marco una cesta, equis cero."
        pizarra: [{grafico: conjuntos-contorno, capa: 2, zona: "2"}]
      - di: "Por encima sombreo el contorno superior, be de equis cero: el conjunto de las cestas equis tales que equis es al menos tan buena como equis cero. Es decir, las cestas «al menos tan buenas como» la cesta equis cero."
        pizarra: [{grafico: conjuntos-contorno, capa: 3}]
        guion: "Contorno superior: «al menos tan bueno como» x⁰"
      - di: "Por debajo sombreo el contorno inferior, hache de equis cero: el conjunto de las cestas equis tales que equis cero es al menos tan buena como ellas. Es decir, las cestas que no son mejores que equis cero."
        pizarra: [{grafico: conjuntos-contorno, capa: 4}]
        guion: "Contorno inferior: «no mejor que» x⁰"
      - di: "Y su intersección, i de equis cero, es el conjunto de indiferencia. [pausa] Con preferencias regulares es la frontera común de los dos: las cestas indiferentes a equis cero, la curva de indiferencia que pasa por ella."
        pizarra: [{grafico: conjuntos-contorno, capa: 5}]
        guion: "I(x⁰) = B(x⁰) ∩ H(x⁰): la curva de indiferencia"
        apunte: "La curva de indiferencia es la frontera común de los conjuntos de contorno superior e inferior"

  - bloque: "I. Fundamentos de la elección racional"
    titulo: "I.1. Ingredientes: axiomas sobre las preferencias"
    modo: pizarra
    rejilla: "50|50"
    pasos:
      - di: "Una vez definidas las preferencias, ¿qué les pedimos? Siete axiomas, agrupados por su papel. La completitud: dadas dos cestas, o equis es al menos tan buena como i griega, o al revés. Y la reflexividad: toda cesta lo es como sí misma."
        pizarra: [{formula: '(1)\ \vect{x}\succcurlyeq\vect{y}\ \lor\ \vect{y}\succcurlyeq\vect{x}\qquad(2)\ \vect{x}\succcurlyeq\vect{x}', zona: "1", tam: 0.8, alinear: izquierda}]
        guion: "1. Completitud · 2. Reflexividad"
        apunte: "Debreu (1959), cap. 4; Mas-Colell, Whinston y Green (1995), cap. 3"
      - di: "La transitividad: si equis es al menos tan buena como i griega, e i griega como zeta, equis lo es como zeta. Los tres hacen de la preferencia un preorden completo: [pausa] eso es la racionalidad."
        pizarra: [{formula: '(3)\ \vect{x}\succcurlyeq\vect{y},\ \vect{y}\succcurlyeq\vect{z}\ \Rightarrow\ \vect{x}\succcurlyeq\vect{z}', zona: "1", tam: 0.8, alinear: izquierda}]
        apoyo: {grafico: esquema-axiomas, capa: 4, zona: "2"}
        guion: "1-3: preorden completo = racionalidad"
        apunte: "Las cestas se reparten en conjuntos de indiferencia que no se cortan y quedan ordenados"
      - di: "Pero la racionalidad no basta para usar números. Hace falta la continuidad: los contornos superior e inferior son cerrados: no hay saltos en las preferencias."
        borrar: ["2"]
        pizarra: [{formula: '(4)\ B(\vect{x}),\ H(\vect{x})\ \text{cerrados}', zona: "1", tam: 0.8, alinear: izquierda}]
        apoyo: {grafico: esquema-axiomas, capa: 5, zona: "2"}
        guion: "4. Continuidad: sin saltos"
      - di: "De ahí el resultado central, el teorema de Debreu, que escribo en rojo: con los cuatro primeros existe una función de utilidad continua. [pausa] Las preferencias lexicográficas son racionales, pero no continuas, y no la admiten."
        borrar: ["2"]
        pizarra: [{formula: '(1){-}(4)\ \Rightarrow\ \exists\,U(\vect{x})\ \text{continua}', zona: "1", tam: 0.8, color: rojo}]
        apoyo: {grafico: esquema-axiomas, capa: 6, zona: "2"}
        guion: "Lexicográficas: racionales, no continuas, sin utilidad"
        apunte: "Teorema de Debreu: racionalidad (1-3) y continuidad (4) bastan para una utilidad continua"
      - di: "Los demás le dan forma. La monotonía, más es mejor, hace la utilidad creciente y lleva a gastar toda la renta; basta su versión débil, la insaciabilidad local."
        borrar: ["2"]
        pizarra: [{formula: '(5)\ \vect{x}\geq\vect{y},\ \vect{x}\neq\vect{y}\ \Rightarrow\ \vect{x}\succ\vect{y}', zona: "1", tam: 0.8, alinear: izquierda}]
        apoyo: {grafico: esquema-axiomas, capa: 7, zona: "2"}
        guion: "5. Monotonía: U creciente; se gasta la renta"
      - di: "La convexidad: si dos cestas son al menos tan buenas como una tercera, también lo es cualquier combinación de ellas. Es el gusto por la diversificación, y hace la utilidad cuasicóncava."
        borrar: ["2"]
        pizarra: [{formula: '(6)\ \vect{x},\vect{y}\succcurlyeq\vect{z}\ \Rightarrow\ \tau\vect{x}+(1-\tau)\vect{y}\succcurlyeq\vect{z}', zona: "1", tam: 0.8, alinear: izquierda}]
        apoyo: {grafico: esquema-axiomas, capa: 9, zona: "2"}
        guion: "6. Convexidad: U cuasicóncava"
      - di: "La convexidad estricta, que da una demanda única, y la diferenciabilidad, que permite usar el cálculo, solo simplifican. En suma: [pausa] con cuatro axiomas existe la utilidad; con los siete, es regular."
        borrar: ["2"]
        apoyo: {grafico: esquema-axiomas, capa: 12, zona: "2"}
        guion: "6′. Convexidad estricta y 7. diferenciabilidad: para simplificar"
        apunte: "Con 1-4 existe U; monotonía y convexidad le dan sus propiedades; 6′ y 7 simplifican"

  - bloque: "I. Fundamentos de la elección racional"
    titulo: "I.1. Ingredientes: función de utilidad"
    modo: pizarra
    rejilla: "42|58"
    pasos:
      - di: "La función de utilidad asigna a cada cesta un número real y representa las preferencias: equis uno es al menos tan buena como equis dos si y solo si su utilidad es mayor o igual."
        pizarra: [{formula: '\vect{x}^1\succcurlyeq\vect{x}^2\ \Leftrightarrow\ U(\vect{x}^1)\geq U(\vect{x}^2)', zona: "1", tam: 0.85}]
        apunte: "U asigna un número real a cada cesta y representa las preferencias: «numera» los conjuntos de indiferencia"
      - di: "Ese número no mide nada: [pausa] solo ordena. La utilidad es ordinal, y cualquier transformación creciente representa las mismas preferencias."
        pizarra: [{formula: 'V=f(U),\ \ f\ \text{creciente}', zona: "1", tam: 0.85}]
        guion: "Ordinal: solo ordena; no es única"
        apunte: "Pareto: utilidad ordinal; la cardinal solo admite transformaciones afines (von Neumann y Morgenstern)"
      - di: "En tres dimensiones, en el apoyo, la utilidad es una colina sobre el plano de las cantidades."
        apoyo: {grafico: superficie-utilidad-repaso, capa: 2, zona: "2"}
        guion: "La «colina de la utilidad» sube hacia el nordeste"
      - di: "Si la corto a la altura uno y proyecto el corte sobre la base, obtengo una curva de indiferencia."
        borrar: ["2"]
        apoyo: {grafico: superficie-utilidad-repaso, capa: 3, zona: "2"}
        guion: "Corte a U = 1, proyectado"
      - di: "Y cortando a las alturas dos y tres, el mapa de curvas de indiferencia, como las curvas de nivel de un mapa topográfico."
        borrar: ["2"]
        apoyo: {grafico: superficie-utilidad-repaso, capa: 5, zona: "2"}
        guion: "Cortes a U = 1, 2, 3: el mapa de curvas de indiferencia"
      - di: "Lo escribo: [pausa] las curvas de indiferencia son los conjuntos de nivel de la utilidad, las cestas con la misma utilidad que equis cero."
        pizarra: [{formula: 'I(\vect{x}^0)=\{\vect{x}\in S:\ U(\vect{x})=U(\vect{x}^0)\}', zona: "1", tam: 0.85}]
        apunte: "U continua (4), creciente (5) y cuasicóncava (6); no es única"

  - bloque: "I. Fundamentos de la elección racional"
    titulo: "I.1. Ingredientes: curvas de indiferencia"
    modo: pizarra
    rejilla: "40|60"
    pasos:
      - di: "Sus propiedades salen de los axiomas. Primera: tienen pendiente negativa, por la monotonía. En el primer panel marco una cesta, equis cero, y trazo una horizontal y una vertical que dividen el plano en cuatro cuadrantes."
        pizarra: [{grafico: propiedades-curvas-indiferencia-pizarra, capa: 2, zona: "2"}]
        guion: "(a) Pendiente negativa: monotonía"
      - di: "Al nordeste, las cestas con más de todo, mejores; al sudoeste, las que tienen menos de todo, peores. La curva solo puede pasar por los otros dos: [pausa] más de un bien exige menos del otro."
        pizarra: [{grafico: propiedades-curvas-indiferencia-pizarra, capa: 5}]
      - di: "Segunda: cuanto más lejos del origen, más utilidad, también por la monotonía. En el segundo panel trazo los ejes y dibujo tres curvas de indiferencia, u cero, u uno y u dos, cada una más alejada del origen que la anterior."
        pizarra: [{grafico: propiedades-curvas-indiferencia-pizarra, capa: 7}]
        guion: "(b) Más alejadas, más utilidad: monotonía"
      - di: "Un rayo desde el origen las corta en A, be y ce, cada una con más de ambos bienes que la anterior: la utilidad crece hacia fuera."
        pizarra: [{grafico: propiedades-curvas-indiferencia-pizarra, capa: 8}]
      - di: "Tercera: no se cortan, por la transitividad. Supongamos que dos curvas, u uno y u dos, se cortaran en A. Tomo be en una y ce en la otra, en la misma vertical, de modo que be tiene más bien dos."
        pizarra: [{grafico: propiedades-curvas-indiferencia-pizarra, capa: 13}]
        guion: "(c) No se cortan: transitividad"
      - di: "Be es indiferente a A, y A a ce; por la transitividad, be sería indiferente a ce. Pero be tiene más, así que es preferida. [pausa] Contradicción: dos curvas distintas no se cortan."
        pizarra: [{formula: 'B\sim A,\ A\sim C\ \Rightarrow\ B\sim C,\ \ \text{pero}\ B\succ C', zona: "1", tam: 0.8}]
      - di: "Cuarta: son convexas, por la convexidad. En el último panel sombreo las cestas al menos tan buenas como equis prima y marco en su curva dos cestas indiferentes, equis prima y equis dos primas."
        pizarra: [{grafico: propiedades-curvas-indiferencia-pizarra, capa: 17}]
        guion: "(d) Convexas: convexidad"
      - di: "Cualquier combinación de las dos es al menos tan buena: el segmento queda por encima de la curva. Y son continuas y sin vértices."
        pizarra: [{grafico: propiedades-curvas-indiferencia-pizarra, capa: 18}]
        guion: "Además: continuas (continuidad) y sin vértices (diferenciabilidad)"
      - di: "Su pendiente, en valor absoluto, es la relación marginal de sustitución: [pausa] cuánto bien dos cede el consumidor por una unidad más del bien uno. Es el cociente de las utilidades marginales y, por la convexidad, decrece."
        pizarra: [{formula: '\mathrm{RMS}_{12}\equiv-\left.\frac{dx_2}{dx_1}\right|_{U=\overline{U}}=\frac{U_1}{U_2}', zona: "1", tam: 0.85}]
        guion: "Teorema de la función implícita; decreciente por la convexidad"
      - di: "Como depende de las unidades, la sustituibilidad se mide con la elasticidad de sustitución, sigma: la variación porcentual de la proporción entre los bienes ante la de la relación marginal de sustitución."
        pizarra: [{formula: '\sigma\equiv\frac{d\ln(x_2/x_1)}{d\ln\mathrm{RMS}_{12}}', zona: "1", tam: 0.85}]
        guion: "σ: número puro; mide la curvatura"
      - di: "La CES la mantiene constante y anida los casos clásicos: Leontief, con sigma cero; Cobb-Douglas, con sigma uno, y la lineal, con sigma infinita."
        apoyo: {grafico: ces-curvas-indiferencia, capa: 5, zona: "1"}
        guion: "σ = 0: Leontief · σ = 1: Cobb-Douglas · σ = ∞: lineal"
        apunte: "CES (Arrow, Chenery, Minhas y Solow, 1961): elasticidad de sustitución constante"

  - bloque: "I. Fundamentos de la elección racional"
    titulo: "I.1. Ingredientes: restricción presupuestaria"
    modo: pizarra
    rejilla: "36|64"
    pasos:
      - di: "El segundo ingrediente, la restricción presupuestaria: con precios dados, una cesta es asequible si su coste no supera la renta, uve doble barra. Es el conjunto presupuestario walrasiano."
        pizarra: [{formula: 'B(\vect{p},\overline{W})=\{\vect{x}\in S:\ \vect{p}\cdot\vect{x}\leq\overline{W}\}', zona: "1", tam: 0.8}]
        guion: "Precios paramétricos: el consumidor es precio-aceptante"
        apunte: "Conjunto presupuestario: no vacío, cerrado, acotado si todos los precios son positivos, y convexo"
      - di: "Con dos bienes, lo sombreo bajo la recta de balance, pe uno equis uno más pe dos equis dos igual a la renta, que corta cada eje en la renta entre su precio."
        pizarra: [{grafico: conjunto-presupuestario, capa: 2, zona: "2"}]
        guion: "Recta de balance"
      - di: "Su pendiente, menos pe uno entre pe dos, es el coste de oportunidad que fija el mercado, y el vector de precios es perpendicular a la recta."
        pizarra: [{grafico: conjunto-presupuestario, capa: 4}]
        guion: "Pendiente −p₁/p₂: coste de oportunidad de mercado"
      - di: "Si sube el precio del bien uno, la recta gira hacia dentro sobre su corte con el eje del bien dos. Con preferencias y presupuesto, ya podemos plantear el problema."
        pizarra: [{grafico: conjunto-presupuestario, capa: 7}]
        guion: "Sube p₁: la recta gira hacia dentro"

  # Desde I.2, la columna 1 (22 %) es la esquina de las funciones clave: el PMU y la demanda
  # marshalliana, en morado y recuadradas. Se conservan hasta el final, aunque cambie la rejilla.
  - bloque: "I. Fundamentos de la elección racional"
    titulo: "I.2. Problema de maximización de la utilidad: el equilibrio"
    modo: pizarra
    rejilla: &R1 "22|39|39"
    pasos:
      - di: "Una vez analizados los ingredientes, paso al problema de maximización de la utilidad. Lo escribo recuadrado en la esquina, porque volveremos a él: el máximo, eligiendo equis, de u de equis; sujeto a que el gasto no supere la renta, y a que las cantidades no sean negativas."
        pizarra: [{formula: '\funcionclave{\optim{\max}{\vect{x}}{U(\vect{x})}{\vect{p}\cdot\vect{x}\leq\overline{W}\\ \vect{x}\geq\vect{0}}}', zona: "1", tam: 0.6}]
        guion: "Función clave: se queda en la esquina"
        apunte: "Weierstrass: el óptimo existe; con cuasiconcavidad estricta y conjunto convexo, es global y único"
      - di: "Como hay desigualdades, se resuelve con Kuhn y Tucker. La lagrangiana: la utilidad más lambda por la renta menos el gasto. [pausa] Lambda es el precio sombra de la renta: su utilidad marginal."
        pizarra: [{formula: '\mathcal{L}=U(\vect{x})+\lambda\big(\overline{W}-\vect{p}\cdot\vect{x}\big)', zona: "2", tam: 0.8}]
        guion: "λ: utilidad marginal de la renta"
        apunte: "Kuhn y Tucker (1951)"
      - di: "Las condiciones: la utilidad marginal de cada bien no supera su coste en utilidad, lambda por pe i, y la holgura complementaria: o el bien se consume y vale la igualdad, o no compensa y no se compra."
        pizarra: [{formula: 'U_i-\lambda p_i\leq 0,\ \ x_i\geq 0,\ \ x_i(U_i-\lambda p_i)=0', zona: "2", tam: 0.8}]
        guion: "Holgura complementaria: o se consume, o no compensa"
      - di: "Por la insaciabilidad local, lambda es positiva y la restricción se satura: [pausa] el consumidor gasta toda su renta."
        pizarra: [{formula: '\lambda>0\ \Rightarrow\ \vect{p}\cdot\vect{x}^*=\overline{W}', zona: "2", tam: 0.8}]
        guion: "λ > 0: se gasta toda la renta"
        apunte: "Con un punto de saturación dentro del presupuesto, la restricción no operaría y λ = 0"
      - di: "En una solución interior, las condiciones se cumplen con igualdad: la utilidad marginal por euro es la misma en todos los bienes, e igual a lambda. [pausa] Es la segunda ley de Gossen. Con dos bienes, la relación marginal de sustitución iguala el cociente de precios."
        pizarra: [{formula: '\frac{U_1}{p_1}=\dots=\frac{U_n}{p_n}=\lambda\ \Rightarrow\ \mathrm{RMS}_{12}=\frac{p_1}{p_2}', zona: "3", tam: 0.8}]
        apunte: "Segunda ley de Gossen (1854): igual utilidad marginal por unidad monetaria en todos los bienes"
      - di: "Lo vemos en el plano. Sombreo el conjunto presupuestario y trazo tres curvas: u cero, que se puede mejorar; u asterisco, y u dos, inalcanzable."
        pizarra: [{grafico: solucion-interior-esquina, capa: 4, zona: "2-3"}]
        guion: "La curva más baja se puede mejorar; la más alta es inalcanzable"
      - di: "El óptimo, equis asterisco, es la tangencia: la relación marginal de sustitución, lo que el consumidor está dispuesto a intercambiar, iguala el cociente de precios, lo que exige el mercado."
        pizarra: [{grafico: solucion-interior-esquina, capa: 6}]
        guion: "Tangencia: RMS = p₁/p₂"
      - di: "Pero la solución puede ser de esquina. A la derecha, otra recta y otras tres curvas: la más alta alcanzable toca la recta en el eje, y el bien dos no se consume."
        pizarra: [{grafico: solucion-interior-esquina, capa: 11}]
        guion: "Esquina: un bien no se consume"
      - di: "Ahí, la relación marginal de sustitución es mayor o igual que el cociente de precios: el consumidor valora el bien uno más de lo que le cuesta."
        pizarra: [{grafico: solucion-interior-esquina, capa: 13}]
        guion: "RMS ≥ p₁/p₂: valora el bien 1 más de lo que cuesta"
        apunte: "Arrow y Enthoven (1961): con U cuasicóncava, las condiciones de primer orden son suficientes"

  - bloque: "I. Fundamentos de la elección racional"
    titulo: "I.3. Solución: demanda marshalliana y función indirecta de utilidad"
    modo: pizarra
    rejilla: *R1
    pasos:
      - di: "Una vez planteado el problema, paso a su solución. Las cantidades óptimas, como funciones de los precios y de la renta, forman el sistema completo de demandas marshallianas: equis asterisco igual a equis de pe y uve doble barra, una demanda por bien. La recuadro bajo el problema: es la otra función clave."
        borrar: ["2", "3"]
        pizarra: [{formula: '\funcionclave{\vect{x}^*=\vect{x}(\vect{p},\overline{W})=\begin{pmatrix} x_1(\vect{p},\overline{W})\\ \vdots\\ x_n(\vect{p},\overline{W})\end{pmatrix}}', zona: "1", tam: 0.6}]
        guion: "Existe, es única y continua"
        apunte: "Existencia: Weierstrass; unicidad: convexidad estricta; continuidad: teorema del máximo de Berge"
      - di: "Dos propiedades son clave. Es homogénea de grado cero: si multiplicamos precios y renta por kappa, el conjunto presupuestario no cambia, y la cesta tampoco. [pausa] No hay ilusión monetaria."
        pizarra: [{formula: '\vect{x}(\kappa\vect{p},\kappa\overline{W})=\vect{x}(\vect{p},\overline{W})', zona: "2", tam: 0.85}]
        guion: "Homogénea de grado cero: sin ilusión monetaria"
      - di: "Y cumple la ley de Walras: por la insaciabilidad local, el consumidor gasta toda su renta."
        pizarra: [{formula: '\vect{p}\cdot\vect{x}(\vect{p},\overline{W})=\overline{W}', zona: "2", tam: 0.85}]
        guion: "Ley de Walras: se agota la renta"
      - di: "Sustituyéndola en la utilidad sale la función indirecta de utilidad, uve de pe y la renta: la utilidad máxima que alcanza con esos precios y esa renta."
        pizarra: [{formula: 'V(\vect{p},\overline{W})=U\big(\vect{x}(\vect{p},\overline{W})\big)', zona: "3", tam: 0.85}]
        guion: "Función indirecta de utilidad: depende indirectamente de precios y renta"
        apunte: "FIU: continua, homogénea de grado 0, creciente en la renta, no creciente en los precios y cuasiconvexa"
      - di: "Y de ella se recupera la demanda derivando, con la identidad de Roy: menos su derivada respecto al precio, entre su derivada respecto a la renta."
        pizarra: [{formula: 'x_i=-\frac{\partial V/\partial p_i}{\partial V/\partial\overline{W}}', zona: "3", tam: 0.85}]
        guion: "Identidad de Roy: teorema de la envolvente"
        apunte: "Roy (1947); dar la vuelta al problema (minimizar el gasto) lleva a la dualidad"

  - bloque: "I. Fundamentos de la elección racional"
    titulo: "I.3. Solución: curva de demanda de mercado"
    modo: pizarra
    pasos:
      - di: "Falta la demanda de mercado: la suma de las individuales, gráficamente una suma horizontal. Primer problema: [pausa] en general depende de toda la distribución de la renta, no solo de su total."
        pizarra: [{formula: 'X_i=\sum_{h=1}^{H}x_{hi}(\vect{p},\overline{W}_h)', zona: "2", tam: 0.8}]
        guion: "¿Depende solo de la renta total?"
      - di: "Gorman demuestra que solo depende de la renta total si la función indirecta de cada consumidor tiene su forma polar: un término propio más un coeficiente de la renta común a todos."
        pizarra: [{formula: 'V_h=a_h(\vect{p})+b(\vect{p})\,\overline{W}_h', zona: "3", tam: 0.8}]
        guion: "Forma polar de Gorman, con b(p) común"
        apunte: "Gorman (1953, 1961): la economía actúa como un consumidor representativo"
      - di: "Por la identidad de Roy, equivale a curvas de Engel rectas y paralelas, una por consumidor: el mismo efecto renta. Si pasamos renta de uno a otro, lo que deja de comprar el primero lo compra el segundo."
        pizarra: [{grafico: engel-gorman, capa: 4, zona: "2"}]
        guion: "Mismo efecto renta: la redistribución no cambia la demanda"
      - di: "Lo cumplen las homotéticas idénticas y las cuasilineales, con efecto renta nulo: cómodo, pero sin bienes inferiores. Segundo problema: [pausa] la agregada no hereda todas las propiedades, y por el teorema de Sonnenschein, Mantel y Debreu casi cualquier exceso de demanda es posible."
        guion: "Homotéticas idénticas o cuasilineales · la agregada no hereda todas las propiedades"
        apunte: "Sonnenschein (1973), Mantel (1974), Debreu (1974): ni unicidad ni estabilidad garantizadas"
      - di: "Recapitulando: de las preferencias y el presupuesto sale una demanda homogénea de grado cero que agota la renta y, con condiciones exigentes, la de mercado. [pausa] ¿Cómo responde a la renta y a los precios?"
        guion: "Idea clave: agregar exige curvas de Engel rectas y paralelas"

  # ==================================================================== II
  # La misma rejilla: en la esquina (1) siguen el PMU y la demanda marshalliana. 3: el esquema de la
  # clasificación de los bienes, que crece de II.1 a II.2 (no se borra entre las dos escenas).
  - bloque: "II. Estática comparativa"
    titulo: "II.1. Variaciones en la renta"
    modo: pizarra
    rejilla: *R1
    pasos:
      - di: "Paso al segundo bloque: la estática comparativa, que compara el óptimo antes y después de un cambio en la renta o en los precios. Adelanto la conclusión: [pausa] todo cambio de precio tiene un efecto sustitución, nunca positivo, y un efecto renta de signo variable, y eso explica la clasificación de los bienes."
        borrar: ["2", "3"]
        guion: "Conclusión anticipada: efecto sustitución ≤ 0 y efecto renta de signo variable"
        apunte: "Marshall (1890) introduce las elasticidades: números puros y medidas locales"
      - di: "Empiezo por la renta. Con la recta inicial, el consumidor elige E cero. Si la renta sube con los precios constantes, la recta se desplaza en paralelo hacia fuera, y el nuevo óptimo es E uno."
        pizarra: [{grafico: renta-consumo-engel, capa: 4, zona: "2"}]
        guion: "Sube la renta: la recta se desplaza en paralelo"
      - di: "Con más renta, E dos. Uniendo los óptimos sale la curva de renta-consumo; con preferencias homotéticas sería una semirrecta desde el origen."
        pizarra: [{grafico: renta-consumo-engel, capa: 7}]
        guion: "Curva de renta-consumo (semirrecta si son homotéticas)"
      - di: "Debajo llevo cada óptimo a otro plano, con la renta en horizontal y la cantidad del bien uno en vertical: es la curva de Engel. Marco las tres rentas y sus tres cantidades. [pausa] Su pendiente es el efecto renta."
        pizarra: [{grafico: renta-consumo-engel, capa: 10}]
        guion: "Curva de Engel: su pendiente es el efecto renta"
      - di: "Aquí el bien es normal a rentas bajas e inferior a rentas altas, como la comida rápida o las marcas blancas."
        pizarra: [{grafico: renta-consumo-engel, capa: 11}]
        guion: "Normal a rentas bajas, inferior a rentas altas"
      - di: "Para no depender de las unidades, la elasticidad-renta: la variación porcentual de la cantidad ante una variación porcentual de la renta, es decir, la derivada por la renta entre la cantidad."
        pizarra: [{formula: '\varepsilon_{x_i,\overline{W}}\equiv\frac{\partial x_i}{\partial\overline{W}}\cdot\frac{\overline{W}}{x_i}', zona: "3", tam: 0.85}]
        guion: "Elasticidad-renta"
      - di: "Con ella clasifico los bienes en un esquema que iremos completando. Sobre un eje, la elasticidad-renta, con el cero y el uno: a la izquierda del cero, los inferiores; a la derecha, los normales."
        pizarra: [{grafico: elasticidades-renta-precio, capa: 2, zona: "3"}]
        guion: "< 0: inferiores · > 0: normales"
      - di: "Y entre los normales, los necesarios, entre cero y uno, cuyo peso en el gasto cae con la renta, y los de lujo, por encima de uno."
        pizarra: [{grafico: elasticidades-renta-precio, capa: 3}]
        guion: "Entre 0 y 1: necesarios · > 1: de lujo"
      - di: "Además, derivando la ley de Walras respecto a la renta sale la agregación de Engel: la media de las elasticidades-renta, ponderada por el peso de cada bien en el gasto, es uno. [pausa] No todos los bienes pueden ser inferiores."
        borrar: ["2"]
        pizarra: [{formula: '\sum_i s_i\,\varepsilon_{x_i,\overline{W}}=1', zona: "2", tam: 0.85}]
        guion: "Alguno tiene elasticidad-renta ≥ 1"
      - di: "La ley de Engel lo confirma: los alimentos son un bien necesario. En España, en 2025, el quintil de menor gasto les dedicó el 19,6 por ciento de su presupuesto, y el de mayor gasto, el 12,3."
        apoyo: {grafico: epf-alimentos-quintil, capa: 2, zona: "2"}
        guion: "Ley de Engel (1857): los alimentos, un bien necesario"
        apunte: "INE, Encuesta de Presupuestos Familiares 2025 (tabla 73828): media del 16,0 %"

  - bloque: "II. Estática comparativa"
    titulo: "II.2. Variaciones en los precios: precio propio"
    modo: pizarra
    rejilla: *R1
    pasos:
      - di: "Una vez vista la renta, pasamos a los precios, primero al propio. Si baja el precio del bien uno, la recta gira hacia fuera, y los óptimos dan la curva de precio-consumo y la demanda marshalliana, como en el apoyo."
        borrar: ["2"]
        apoyo: {grafico: precio-consumo-demanda, capa: 10, zona: "2"}
        guion: "De la curva de precio-consumo a la curva de demanda"
      - di: "La elasticidad-precio propia mide su respuesta porcentual. Si es negativa, el bien es ordinario, con demanda elástica o inelástica según pase o no de menos uno; si es positiva, es un bien Giffen: [pausa] su demanda sube cuando sube su precio."
        borrar: ["2"]
        pizarra: [{formula: '\varepsilon_{x_i,p_i}\equiv\frac{\partial x_i}{\partial p_i}\cdot\frac{p_i}{x_i}', zona: "2", tam: 0.8}]
        guion: "< 0: ordinario (elástica si < −1) · > 0: Giffen"
      - di: "¿Cómo puede ser? Un cambio de precio altera el precio relativo y el poder adquisitivo, y la ecuación de Slutsky los separa. La escribo como cabecera de una tabla: el efecto total, la derivada de la marshalliana respecto a su precio, es el efecto sustitución, la derivada de la demanda compensada o hicksiana, que mantiene la utilidad, más el efecto renta: menos la cantidad por el efecto renta del bien."
        pizarra: [{grafico: slutsky-propio, capa: 1, zona: "3"}]
        guion: "Efecto total = efecto sustitución (hicksiana) + efecto renta"
        apunte: "Slutsky (1915); demanda hicksiana: la del problema dual de minimización del gasto"
      - di: "Gráficamente: con la recta inicial y la curva u cero, el óptimo es A."
        pizarra: [{grafico: efecto-sustitucion-renta, capa: 3, zona: "2"}]
        guion: "Óptimo inicial A"
      - di: "Baja el precio del bien uno: la recta gira hacia fuera, y el nuevo óptimo es ce, en la curva u uno."
        pizarra: [{grafico: efecto-sustitucion-renta, capa: 6}]
        guion: "Baja p₁: nuevo óptimo C"
      - di: "Ahora compenso la renta: una recta con la nueva pendiente, tangente a la curva inicial, da be. De A a be, el efecto sustitución: [pausa] se compra más de lo que se ha abaratado."
        pizarra: [{grafico: efecto-sustitucion-renta, capa: 9}]
        guion: "De A a B: efecto sustitución"
      - di: "De be a ce, el efecto renta, y de A a ce, el efecto total."
        pizarra: [{grafico: efecto-sustitucion-renta, capa: 11}]
        guion: "De B a C: efecto renta · de A a C: efecto total"
      - di: "En el panel de abajo, con el precio en vertical, bajo las guías desde A, be y ce, y trazo la demanda marshalliana, que pasa por A y ce."
        pizarra: [{grafico: efecto-sustitucion-renta, capa: 14}]
        guion: "Marshalliana: por A y C"
      - di: "La hicksiana pasa por A y be: para un bien normal es más inclinada, porque solo recoge el efecto sustitución."
        pizarra: [{grafico: efecto-sustitucion-renta, capa: 16}]
        guion: "Hicksiana: por A y B, más inclinada"
      - di: "Ya podemos clasificar. El efecto sustitución es siempre no positivo. Si el bien es normal, el efecto renta también es negativo, los dos empujan igual y el bien es ordinario: [pausa] es la ley de la demanda."
        pizarra: [{grafico: slutsky-propio, capa: 2}]
        guion: "Normal: los dos efectos en el mismo sentido: ordinario"
      - di: "Si el bien es inferior, el efecto renta va en contra del efecto sustitución. Mientras domine el efecto sustitución, el bien sigue siendo ordinario: es el caso más habitual entre los inferiores."
        pizarra: [{grafico: slutsky-propio, capa: 3}]
        guion: "Inferior: ordinario si domina el efecto sustitución"
      - di: "Si domina el efecto renta, es Giffen. Todo Giffen es inferior, pero no al revés: tiene que pesar mucho en el gasto. La mejor evidencia es la de Jensen y Miller: subvencionaron el arroz a hogares pobres de Hunan, y su consumo cayó."
        pizarra: [{grafico: slutsky-propio, capa: 4}]
        guion: "Giffen: domina el efecto renta"
        apunte: "Jensen y Miller (2008): el arroz en Hunan; las patatas irlandesas no están documentadas"
      - di: "Vuelvo al esquema de la clasificación y lo completo con un segundo eje, debajo del primero: la elasticidad-precio propia, con su cero algo desplazado a la izquierda. A un lado del cero, con elasticidad positiva, los bienes Giffen; al otro, los ordinarios."
        pizarra: [{grafico: elasticidades-renta-precio, capa: 5}]
        guion: "Segundo eje: Giffen y ordinarios"
      - di: "Y los relaciono: los dos ceros no coinciden. Todo bien normal es ordinario, todo Giffen es inferior, y entre los dos ceros quedan los inferiores ordinarios. Distinto es el efecto Veblen: [pausa] si el precio entra en las preferencias, Slutsky ya no vale."
        pizarra: [{grafico: elasticidades-renta-precio, capa: 8}]
        guion: "Todo bien normal es ordinario · todo Giffen es inferior"
        apunte: "Veblen (1899): consumo ostentoso; Leibenstein (1950): efectos arrastre y esnob"

  - bloque: "II. Estática comparativa"
    titulo: "II.2. Variaciones en los precios: precio cruzado"
    modo: pizarra
    rejilla: *R1
    pasos:
      - di: "Pasamos ahora al precio de otro bien. La elasticidad cruzada define las relaciones brutas: sustitutivos brutos si es positiva, complementarios si es negativa. Como incluyen efectos renta, [pausa] no son simétricas."
        borrar: ["2", "3"]
        pizarra: [{formula: '\varepsilon_{x_i,p_j}\equiv\frac{\partial x_i}{\partial p_j}\cdot\frac{p_j}{x_i}', zona: "2", tam: 0.85}]
        guion: "> 0: sustitutivos brutos · < 0: complementarios brutos"
      - di: "Derivando la ley de Walras respecto a un precio sale la agregación de Cournot: la media ponderada de las elasticidades respecto a pe jota es menos el peso del bien jota. Y de la homogeneidad, que las elasticidades precio y renta de cada bien suman cero."
        pizarra: [{formula: '\sum_i s_i\,\varepsilon_{x_i,p_j}=-s_j\qquad\sum_j\varepsilon_{x_i,p_j}+\varepsilon_{x_i,\overline{W}}=0', zona: "3", tam: 0.8}]
        guion: "Agregación de Cournot · homogeneidad"
        apunte: "Engel, Cournot y homogeneidad: solo la restricción presupuestaria; simetría y negatividad: maximización"
      - di: "La simetría y el signo del efecto sustitución exigen, además, que el consumidor maximice, como en el problema de la esquina. Slutsky separa también aquí los dos efectos, y lo escribo como cabecera de otra tabla: el efecto total cruzado, la derivada de la marshalliana del bien i respecto al precio del bien jota, es el efecto sustitución cruzado, el de la hicksiana, más el efecto renta cruzado: menos la cantidad del bien jota por el efecto renta del bien i. Debajo, tres columnas: el efecto sustitución, que define las relaciones netas; el efecto renta, según sea el bien i, y el efecto total, que da las brutas."
        pizarra: [{grafico: slutsky-cruzado, capa: 1, zona: "2-3"}]
        guion: "Efecto sustitución cruzado: relaciones netas · efecto total: brutas"
        apunte: "Sustitutivos netos si el efecto sustitución cruzado es positivo; complementarios netos si es negativo"
      - di: "Primera fila: sustitutivos netos, con efecto sustitución positivo. Si el bien i es normal, el efecto renta es negativo y va en contra, así que el efecto total es ambiguo: depende de cuál domine."
        pizarra: [{grafico: slutsky-cruzado, capa: 2}]
        guion: "Sustitutivos netos e i normal: ambiguo"
      - di: "Si el bien i es inferior, en cambio, una subida del precio del bien jota le resta renta real y eleva su demanda: los dos efectos suman, y son sustitutivos brutos con seguridad."
        pizarra: [{grafico: slutsky-cruzado, capa: 3}]
        guion: "Sustitutivos netos e i inferior: sustitutivos brutos"
      - di: "Segunda fila: complementarios netos, como el café y el azúcar: aunque se compense la renta, si se encarece uno se compra menos del otro. Si el bien i es normal, el efecto renta también es negativo: los dos efectos van en el mismo sentido, se suman, y los bienes son complementarios brutos con seguridad."
        pizarra: [{grafico: slutsky-cruzado, capa: 4}]
        guion: "Complementarios netos e i normal: complementarios brutos"
      - di: "Y si el bien i es inferior, el efecto renta va en contra del efecto sustitución, y el resultado vuelve a ser ambiguo."
        pizarra: [{grafico: slutsky-cruzado, capa: 5}]
        guion: "Complementarios netos e i inferior: ambiguo"
      - di: "Debajo anoto la diferencia clave: los efectos sustitución cruzados son simétricos, y las relaciones netas también; [pausa] las brutas, no, porque los efectos renta no coinciden. Y como la demanda compensada es homogénea en los precios, cada bien tiene al menos un sustitutivo neto."
        pizarra: [{grafico: slutsky-cruzado, capa: 6}]
        guion: "Netas simétricas; brutas, no"
        apunte: "Cada bien tiene al menos un sustitutivo neto; con dos bienes, son sustitutivos netos"

  - bloque: "II. Estática comparativa"
    titulo: "II.3. Valoración"
    modo: guion
    pasos:
      - di: "Con la estática comparativa completamos la teoría ordinal, y conviene valorarla. Da restricciones contrastables, pero tiene límites que abren el tercer bloque: las preferencias no se observan, consumir no lleva tiempo y los bienes no tienen calidad ni características."
        guion: ["Restricciones contrastables: homogeneidad, Walras, Engel, Cournot, signo del efecto sustitución", "Limitaciones:", "> Preferencias inobservables: preferencia revelada", "> Sin tiempo de consumo: producción doméstica", "> Sin calidad ni características: precios hedónicos"]
      - di: "Recapitulando: [pausa] la ley de la demanda vale siempre para la compensada, y para la marshalliana solo si el efecto renta no domina. ¿Podemos llegar a esto desde lo observable?"
        guion: ["Idea clave: la ley de la demanda vale siempre para la compensada", "> Para la marshalliana, solo si el efecto renta no domina"]

  # ==================================================================== III
  - bloque: "III. Otros desarrollos"
    titulo: "III.1. La teoría de la preferencia revelada"
    modo: pizarra
    rejilla: *R1
    pasos:
      - di: "Paso al tercer bloque: otros desarrollos de la teoría de la demanda. Adelanto la conclusión: [pausa] los tres responden a esas limitaciones y acercan la teoría a lo observable. El primero, la preferencia revelada de Samuelson. La idea: en lugar de partir de unas preferencias que no vemos, partir de las elecciones. Es un enfoque inductivo, frente al deductivo de la teoría ordinal."
        borrar: ["2", "3"]
        guion: "Samuelson (1938): de las elecciones a las preferencias"
        apunte: "Samuelson (1938, 1948): la demanda sin recurrir a la utilidad; Nobel de 1970"
      - di: "Supone un consumidor que, ante cada vector de precios y renta, elige una única cesta y gasta toda su renta. En el gráfico, con los precios pe cero elige equis cero, aunque podía comprar equis uno: [pausa] equis cero se revela directamente preferida."
        pizarra: [{grafico: adpr-efecto-sustitucion, capa: 5, zona: "2-3", alto: 0.52}]
        guion: "Supuestos: función de demanda y ley de Walras"
      - di: "El axioma débil exige coherencia: si con otros precios, pe uno, se elige equis uno, equis cero no puede ser asequible. La nueva recta tiene que dejarla fuera."
        pizarra: [{grafico: adpr-efecto-sustitucion, capa: 7}]
        guion: "Axioma débil: coherencia entre elecciones"
      - di: "En símbolos: si con pe cero equis uno era asequible, con pe uno equis cero tiene que costar más que equis uno."
        pizarra: [{formula: '\vect{p}^0\cdot\vect{x}^1\leq\vect{p}^0\cdot\vect{x}^0\ \Rightarrow\ \vect{p}^1\cdot\vect{x}^0>\vect{p}^1\cdot\vect{x}^1', zona: "2", tam: 0.75}]
        apunte: "ADPR (Samuelson, 1938): compara dos situaciones de precios y renta cualesquiera"
      - di: "Su implicación principal es el signo del efecto sustitución. En el segundo panel parto de equis cero, elegida con los precios pe cero."
        pizarra: [{grafico: adpr-efecto-sustitucion, capa: 10}]
        guion: "Implicación: el signo del efecto sustitución"
      - di: "Bajo el precio del bien uno y compenso la renta para que pueda seguir comprando equis cero. El tramo de la nueva recta a su izquierda ya era asequible, y no se eligió."
        pizarra: [{grafico: adpr-efecto-sustitucion, capa: 12}]
        guion: "Baja p₁ con compensación de Slutsky"
      - di: "Así que elegirá una cesta a la derecha de equis cero, equis uno, con más bien uno: ha bajado el precio y, compensada la renta, compra más. [pausa] Es la ley de la demanda compensada: el resultado de Slutsky, sin hablar de utilidad."
        pizarra: [{grafico: adpr-efecto-sustitucion, capa: 15}]
        guion: "Ley de la demanda compensada, sin utilidad"
      - di: "Analíticamente, la variación de los precios por la de las cantidades no es positiva. Pero con más de dos bienes el axioma débil no garantiza la simetría."
        pizarra: [{formula: '(\vect{p}^1-\vect{p}^0)\cdot(\vect{x}^1-\vect{x}^0)\leq 0', zona: "2", tam: 0.75}]
        apunte: "El ADPR da una matriz de Slutsky semidefinida negativa, pero no simétrica"
      - di: "Por eso Houthakker formula el axioma fuerte, la transitividad de las preferencias reveladas, y demuestra que equivale a maximizar unas preferencias racionales, como en el problema de la esquina: [pausa] los dos enfoques son equivalentes."
        pizarra: [{formula: '\text{AFPR}\ \Leftrightarrow\ \succcurlyeq\ \text{racionales}', zona: "2", tam: 0.75}]
        guion: "Teorema de Houthakker: equivalencia"
        apunte: "Houthakker (1950): axioma fuerte de la preferencia revelada"
      - di: "Samuelson muestra además cómo acotar una curva de indiferencia. A la derecha, otra elección, equis cero, con los precios pe cero: las cestas de ese presupuesto, que pudo comprar y no compró, se revelan peores que equis cero."
        pizarra: [{grafico: preferencia-revelada-indiferencia, capa: 4, zona: "3"}]
        guion: "El presupuesto de x⁰: revelado peor"
      - di: "Si con los precios pe uno elige equis uno pudiendo comprar equis cero, equis uno y las cestas con más de todo forman la región revelada mejor. La curva queda entre las dos regiones, y cada observación nueva, como equis dos, la acota más."
        pizarra: [{grafico: preferencia-revelada-indiferencia, capa: 8}]
        guion: "La curva de indiferencia queda entre ambas regiones"
      - di: "Como extensión, el teorema de Afriat da la condición para que unos datos finitos sean compatibles con maximizar una utilidad, el axioma generalizado, y Varian lo convierte en un contraste práctico, sin formas funcionales, con datos de hogares y experimentos."
        guion: "Extensiones: Afriat (1967), índices de precios · evidencia: Varian (1982)"
        apunte: "GARP: base del contraste no paramétrico de la racionalidad"
      - di: "Su valoración: obtiene la demanda sin utilidad y equivale a la teoría ordinal, pero Sen critica que identifica elección y bienestar. Y, como la teoría ordinal, olvida que consumir lleva tiempo."
        guion: "Valoración: sin utilidad y equivalente (Houthakker) · Sen (1973): elección ≠ bienestar"

  - bloque: "III. Otros desarrollos"
    titulo: "III.2. La producción doméstica"
    modo: pizarra
    rejilla: "22|78"
    conservar: ["1"]
    pasos:
      - di: "Ese es el segundo desarrollo: la producción doméstica. La idea, de Becker: el hogar es una pequeña fábrica que combina bienes de mercado y tiempo para producir lo que de verdad le satisface: una comida, una noche de cine o el cuidado de los hijos. Lancaster propone la otra tecnología del consumo: los bienes producen características, y la utilidad depende de ellas. Es el antecedente de los precios hedónicos."
        guion: "Becker (1965): el hogar, una pequeña fábrica"
        apunte: "Becker (1965): nueva economía de la familia; Nobel de 1992. Lancaster (1966): características"
      - di: "Frente al problema de la esquina, el hogar maximiza una utilidad sobre esos bienes finales, zeta, eligiendo bienes, tiempos y horas de trabajo; sujeto a que cada bien final se produzca con bienes y tiempo; a la restricción presupuestaria, en la que el gasto iguala el salario por las horas de trabajo más la renta no laboral, y a la de tiempo, que reparte el total entre el trabajo y la producción en casa."
        pizarra: [{formula: '\optim{\max}{\{x_i,t_i\},\,t_w}{U(Z_1,\dots,Z_m)}{Z_i=f_i(x_i,t_i),\quad i=1,\dots,m\\ \sum_i p_ix_i=w\,t_w+\overline{W}\\ \sum_i t_i+t_w=T}', zona: "2", tam: 0.85}]
        guion: "Producción doméstica, restricción de renta y restricción de tiempo"
      - di: "Sustituyendo las horas de trabajo, las dos restricciones se funden en una: la renta completa, lo que ganaría el hogar si dedicara todo su tiempo al mercado."
        pizarra: [{formula: '\sum_i\left(p_ix_i+w\,t_i\right)=w\,T+\overline{W}', zona: "2", tam: 0.85}]
        guion: "Renta completa"
      - di: "Con coeficientes fijos, cada bien final tiene un precio sombra, pi, que suma el precio de los bienes y el coste de oportunidad del tiempo. [pausa] El salario es también un precio del consumo."
        pizarra: [{formula: '\pi_i=p_ib_i+w\,\ell_i', zona: "2", tam: 0.85}]
        guion: "Precio sombra: bienes + coste del tiempo"
      - di: "La implicación: si sube el salario, se encarecen las actividades intensivas en tiempo, y los hogares sustituyen tiempo por bienes: comida preparada, guarderías, electrodomésticos. Ayuda a explicar la incorporación de la mujer al mercado de trabajo."
        pizarra: [{formula: 'w\uparrow\ \Rightarrow\ t_i\downarrow,\ x_i\uparrow', zona: "2", tam: 0.85, color: rojo}]
        guion: "Sube el salario: se sustituye tiempo por bienes"
      - di: "Gronau distingue además el trabajo doméstico del ocio. Su valoración: extiende la elección a la familia y la educación, y muestra que el PIB omite la producción del hogar. Pero cada bien sigue siendo homogéneo, sin calidad ni características."
        guion: "Gronau (1977): trabajo doméstico ≠ ocio · el PIB omite la producción del hogar"

  - bloque: "III. Otros desarrollos"
    titulo: "III.3. Precios hedónicos"
    modo: pizarra
    rejilla: "22|32|46"
    conservar: ["1"]
    pasos:
      - di: "Lo resuelve el tercer desarrollo, los precios hedónicos. La idea: una vivienda, un coche o un ordenador son paquetes de características que no se venden por separado, y el método descompone su precio en el valor de cada una. [pausa] Lo que se paga revela cómo se valoran. Court acuña el término en 1939, con automóviles; Griliches lo usa para ajustar por calidad los índices de precios, y Rosen le da fundamento teórico."
        guion: "Bienes diferenciados: paquetes de características"
        apunte: "Court (1939): automóviles; Griliches (1961): índices ajustados por calidad; Rosen (1974): la teoría"
      - di: "Rosen supone un mercado competitivo de un producto diferenciado, con agentes precio-aceptantes que conocen las características. El precio de una variedad con características zeta es la función hedónica, pe de zeta, y su derivada, el precio implícito de cada característica."
        pizarra:
          - {formula: 'p(\vect{z}),\qquad\frac{\partial p(\vect{z})}{\partial z_j}', zona: "2", tam: 0.85}
          - {grafico: funcion-hedonica-rosen, capa: 2, zona: "3"}
        guion: "Función hedónica y precio implícito"
      - di: "El consumidor compra una unidad: maximiza su utilidad sobre las características y un bien numerario, i griega, sujeto a que el precio de la variedad más el numerario agoten su renta. E iguala su relación marginal de sustitución al precio implícito: [pausa] la tangencia del problema de la esquina, sobre una restricción no lineal."
        pizarra:
          - {formula: '\optim{\max}{\vect{z},\,y}{U(\vect{z},y)}{p(\vect{z})+y=\overline{W}}', zona: "2", tam: 0.8}
          - {formula: '\frac{\partial U/\partial z_j}{\partial U/\partial y}=\frac{\partial p(\vect{z})}{\partial z_j}', zona: "2", tam: 0.85}
        guion: "RMS = precio implícito"
      - di: "Cada consumidor tiene una curva de puja, theta mayúscula: lo máximo que pagaría por cada variedad sin cambiar su utilidad. Dibujo la de dos consumidores."
        pizarra: [{grafico: funcion-hedonica-rosen, capa: 4}]
        guion: "Curva de puja Θ: lo máximo que pagaría"
      - di: "Y cada productor, una curva de oferta, fi: lo mínimo que aceptaría con un beneficio dado, be. Dibujo dos."
        pizarra: [{grafico: funcion-hedonica-rosen, capa: 6}]
        guion: "Curva de oferta φ: lo mínimo que aceptaría"
      - di: "En equilibrio, en cada variedad, la puja y la oferta son tangentes a la función hedónica, que es su envolvente. [pausa] El precio implícito es a la vez la valoración marginal del comprador y el coste marginal del vendedor."
        pizarra: [{grafico: funcion-hedonica-rosen, capa: 8}]
        guion: "Envolvente: un lugar geométrico de equilibrios"
        apunte: "Rosen (1974): la función hedónica es la envolvente de las curvas de puja y de oferta"
      - di: "Su pendiente en zeta uno es el precio implícito. Pero no es una demanda, sino un lugar de equilibrios. Se estima en dos etapas: primero, una regresión semilogarítmica del precio sobre las características; después, las demandas de cada una, con un serio problema de identificación."
        pizarra:
          - {grafico: funcion-hedonica-rosen, capa: 9}
          - {formula: '\ln p_v=\beta_0+\sum_j\beta_jz_{vj}+u_v', zona: "2", tam: 0.85}
        guion: "Dos etapas: precios implícitos y demandas (identificación)"
        apunte: "Ekeland, Heckman y Nesheim (2004): identificación de la segunda etapa"
      - di: "Se extiende a bienes sin mercado: el aire limpio o la cercanía a un parque se capitalizan en el precio de la vivienda. Y al mercado de trabajo, para estimar el valor estadístico de la vida."
        guion: "Bienes sin mercado · salarios hedónicos"
        apunte: "Método de valoración indirecta: herramienta del análisis coste-beneficio"
      - di: "En cuanto a la evidencia, el informe Boskin estimó que el IPC estadounidense sobrestimaba la inflación en 1,1 puntos al año, en buena parte por no corregir la calidad. Hoy se usa sobre todo en electrónica y en vivienda: el INE lo aplica en su Índice de Precios de Vivienda."
        guion: "Boskin (1996) · Eurostat y BLS: electrónica y vivienda · IPV del INE"
        apunte: "Boskin (1996): unos 0,6 de los 1,1 puntos, por calidad y productos nuevos"
      - di: "Su valoración: depende de la forma funcional, la segunda etapa está mal identificada, supone un mercado competitivo en equilibrio y los precios implícitos son marginales: no sirven para cambios grandes. Recapitulando el bloque: [pausa] los tres desarrollos llevan la teoría a lo observable: las elecciones, el tiempo y las características."
        guion: "Límites: forma funcional, identificación, competencia"
        apunte: "Idea clave: los tres desarrollos acercan la teoría de la demanda a lo observable"

  # ==================================================================== CONCLUSIÓN
  - bloque: Conclusión
    titulo: Conclusión
    modo: guion
    estructura: [Recapitulación, Relevancia, Extensiones, Opinión, Idea final]
    pasos:
      - di: "En conclusión, de unos pocos axiomas y un presupuesto sale una demanda que agota la renta; Slutsky explica los bienes normales, inferiores y Giffen, y tres desarrollos la acercan a los datos."
        parte: Recapitulación
        guion: ["De los axiomas a la demanda marshalliana; agregar exige Gorman", "Slutsky: efecto sustitución y efecto renta", "Preferencia revelada, producción doméstica, precios hedónicos"]
      - di: "Es una de las construcciones más acabadas de la economía, y se usa a diario."
        parte: Relevancia
        guion: ["De las preferencias a la demanda, y vuelta (Houthakker)"]
      - di: "Deja abiertas la dualidad y la medida del bienestar, los sistemas de demanda, la incertidumbre y el tiempo."
        parte: Extensiones
        guion: ["Dualidad, bienestar y sistemas de demanda", "Incertidumbre e intertemporalidad"]
      - di: "En mi opinión, su lógica es más sólida que su evidencia, y la economía conductual la amplía más que sustituirla."
        parte: Opinión
        guion: ["Simon, Kahneman y Tversky, Thaler", "> La amplían más que sustituirla"]
      - di: "¿Puede, entonces, una teoría explicar lo que elegimos sin ver lo que queremos? [pausa 800] Sí, con matices: las elecciones delatan las preferencias, y basta pedirles coherencia para obtener una demanda que los datos pueden refutar. Por eso la teoría de la demanda es el primer ladrillo del análisis de los mercados: sin ella no puede explicarse cómo se forman los precios, ni medirse la inflación con bienes cuya calidad cambia, ni valorarse el bienestar que una política gana o pierde. [pausa] Lo que esa coherencia no recoge, el riesgo, el tiempo o los sesgos, es lo que el resto de la teoría económica viene a explicar."
        parte: Idea final
        guion: ["Sí, con matices: las elecciones delatan las preferencias", "> Primer ladrillo: precios, inflación con calidad cambiante, bienestar", "> El resto (riesgo, tiempo, sesgos), otras partes de la teoría"]
