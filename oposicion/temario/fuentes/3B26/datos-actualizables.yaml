tema: 3B26
fecha_inventario: 2026-11-12
# Fase 2 (datos, 12/11/2026); fase 3 (integración, 12/11/2026): los «texto» son ya las frases
# literales del 3B26.tex (sin las órdenes de LaTeX). Quedan fuera los hechos históricos cerrados (fechas de 2007-2008 y de
# 2023, cifras del TARP y de las ayudas de Estado 2008-2017, umbrales del Comité de Basilea de 1996):
# solo cambian si cambia la norma o se corrige el documento. Los CSV están en datos/.
datos:
  - id: vivienda-eeuu
    texto: "en Estados Unidos, el precio de la vivienda casi se duplicó entre 2000 y mediados de 2006 y cayó después un 27 % hasta 2012, y un 35 % en las 20 mayores ciudades"
    donde: [3B26.tex]
    valor: [84.6, -27.4, -35.1, -35]
    unidad: "% de variación del índice (enero de 2000 = 100)"
    periodo: 2000-01 a 2012-03
    fuente: [FRED2026CaseShiller, FRED2026IPCEEUU]
    organismo: S&P Dow Jones Indices (vía FRED); BLS
    serie: "CSUSHPINSA (nacional, sin desestacionalizar), SPCS20RNSA (20 ciudades), CPIAUCNS (deflactor). Comprobación: FHFA USSTHPI (otro índice: -19 %, 2007T1-2012T2)"
    url: https://fred.stlouisfed.org/series/CSUSHPINSA
    periodicidad: mensual (último martes de cada mes, con 2 meses de retraso); la parte 2000-2016 apenas se revisa
    proxima: 2026-11
    familia: case-shiller
    depende: [datos/vivienda-eeuu.csv]
    frase: "II.4 a) Las causas (literal en 3B26.tex) y gráfico de datos fig:vivienda-eeuu; tabla tab:cronologia del anexo (máximo de julio de 2006). Si se añade el nivel actual (agosto de 2026: 336,7, un 82 % por encima del máximo de 2006), actualizarlo cada mes"

