# Guion de escenas del vídeo del cante del tema 3.A.12 (formato en scripts/temario/generar-video.py).
# Dice lo mismo que guion-cante.md: el texto de cada «di» es el del cante.
# Pizarra según las «Instrucciones para el vídeo» de revision.md: en el bloque I, el esquema de
# dualidad de la empresa crece por capas a la derecha durante todo el bloque; a la izquierda se
# dibujan y se borran mb-un-factor, mc, concavidad-c, el gráfico conjunto mb-mc y la recuperación
# de la isocuanta. Funciones clave (\funcionclave del tema, criterios del 16/10/2026): la función de
# costes como problema de mínimo y el lema de Shephard, recuadrados en morado abajo a la izquierda
# (celda 1b, 24 % del ancho y 45 % del alto en todas las rejillas desde I.2): se quedan hasta el
# final con «conservar», porque el bloque II empieza por la función de costes, la translog usa
# Shephard y la ineficiencia X la multiplica.
# Autor: Víctor Gutiérrez Marcos
tema: 3.A.12
duracion: 1800
voz: {motor: voicestudio, motor_tts: omnivoice, velocidad: 1.0, referencia: /mnt/c/Users/vgutierrez/Documents/voz/referencia-12s.wav}   # voz clonada de Víctor con OmniVoice (VoiceStudio)
pronunciacion:
  Kuhn: Kun
  Tucker: Táker
  Châtelier: Shatelié
  Viner: Váiner
  Wicksell: Víksel
  McFadden: Makfáden
  Nerlove: Nérlof
  Christensen: Krístensen
  Jorgenson: Yórguenson
  Lau: Láu
  Greene: Grin
  Farrell: Fárel
  Leibenstein: Láibenstain
  Stigler: Estígler
  Young: Iang
  Hanoch: Jánok
  Berndt: Bernt
  Wood: Gud
  Caves: Kéivs
  Tretheway: Trézuei
  Lieberman: Líberman
  Aigner: Áigner
  Lovell: Lóvel
  Schmidt: Shmit
  Charnes: Charns
  Cooper: Kúper
  Rhodes: Róuds
  Harberger: Járberguer
