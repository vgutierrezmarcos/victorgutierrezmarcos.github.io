    contradicciones:
    - tema: 3.A.19
      que: 'Repite el gráfico «Situación de Bertrand con producto diferenciado» (su Imagen 5 = Imagen 10 del 3.A.18 original)
        y remite aquí el oligopolio diferenciado (nota 13): al revisarlo, resumir en una línea y remitir a II.2 (Singh-Vives,
        ficha oligopolio-diferenciado) y II.3.2 (Hotelling). Su nota 15 (Shaked y Sutton, 1983) concuerda con III.1. Conserva
        el enganche antiguo común (Marshall; aspectos técnicos, de costes y organizativos), que el 3.A.18 ya no comparte. Remite
        la teoría de juegos al 3.A.10 (es 3.A.14) y el equilibrio de Bertrand al 3.A.23 (es 3.A.22). φ para la función de
        reacción → R_i (D016). La lista común de supuestos (tab:supuestos) debe ser idéntica a la del 3.A.16-3.A.18, con
        la fila 4 levantada.'
    - tema: 3.B.6
      que: 'Repite entera la demanda de Dixit-Stiglitz (CES, ρ, preferencia por la variedad, l. 472-483 del Word) en lugar de
        resumir y remitir (fichas dixit-stiglitz y krugman-1979); al revisarlo, usar P, μ, σ y x_i/q como el 3.A.18. Usa F
        para el coste fijo (admitido en comercio, D103). Su «μ depende negativamente de σ» es correcta. Trata Shaked-Sutton
        y Falvey: coherente con III.1.'
    - tema: 3.A.7
      que: 'Usa Dixit-Stiglitz con continuo de variedades, σ y P_t(i) sin remitir al 3.A.18 (coherente con P): al revisarlo,
        \vertema{3.A.18} para la demanda y el margen μ = σ/(σ−1).'
    - tema: 3.A.15
      que: 'Sin fuente. Barreras de entrada y mercados impugnables: el 3.A.18 remite allí; la proliferación de marcas (Schmalensee,
        1978; Judd, 1985) se resume en III.2 del 3.A.18: al redactarlo, remitir aquí si la cita (ficha salop).'
    - tema: 3.A.20
      que: 'Sin fuente. La definición del mercado relevante (correlación de precios, test SSNIP) es su epígrafe: el anexo G
        del 3.A.18 solo resume y remite.'
    - tema: 4.B.2
      que: '«Downs-Hotelling (1947)»: Hotelling (1929) y Downs (1957) (ficha downs-hotelling). Su falta de remisión al 3.A.18
        (Hotelling como base de Downs) se resuelve con la ficha hotelling.'
    - tema: 3.A.24
      que: 'Al revisarlo, la competencia electoral con la ciudad lineal de precios fijos (solo el efecto demanda) y remisión
        al 3.A.18 (ficha hotelling); el 3.A.18 ya remite allí. Resuelto en su revisión (22/10/2026: III.2.1 y anexo D).'
    - tema: 3.A.14
      que: 'En revisión en paralelo. Debía dar con su notación el EN, la inducción hacia atrás y el ENPS que el 3.A.18 usa
        en II y III, Cournot como ejemplo de acciones continuas remitido al 3.A.19, sin desarrollar Bertrand ni Cournot diferenciados.
        Resuelto en la revisión del 3.A.14 (19/10/2026): ficha equilibrio-nash, juegos en 2 etapas con \vertema{3.A.18}.'
    - tema: 3.A.25
      que: 'El Word «3A-18_v11.doc» que se consultó es el 3.A.18 antiguo (mercado de trabajo), hoy 3.A.25: anotarlo en las
        fuentes del 3.A.25 cuando se revise (duda 10 del 3.A.18).'
