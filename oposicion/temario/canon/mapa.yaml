      uso: ampliar
    - a: 4.B.15
      por_que: 'Opcional: la empresa pública como alternativa a la regulación del monopolio natural (anexo A, nota de la competencia por el mercado); el tema no depende de ella.'
      uso: ampliar
    contradicciones:
    - tema: 3.A.25
      que: 'Su anexo copia el anexo 1 del 3.A.17 original con sus errores: llama al GMg «curva de oferta de trabajo», dice que el monopsonio provoca paro involuntario (nota 36) y usa W y Π. Al revisarlo, resumir III.1 del 3.A.17 con w_L(L), ε_{L,w_L}, VPMg_L, GMg_L, B y el gráfico monopsonio.tex, sin paro involuntario y con el salario mínimo por tramos, y remitir al 3.A.17 (ficha monopsonio).'
    - tema: 3.A.27
      que: 'Desarrolla el sindicato monopolista (Dunlop, 1944), la Nash generalizada con γ, el derecho a gestionar y los contratos eficientes sin remitir al 3.A.17 para el monopolio bilateral como estructura de mercado (Bowley, indeterminación). Al revisarlo, usar w, L, γ (sindicato) y 1 − γ (empresa), U_S = wL − v(L) o el salario de reserva y U_S^0, B^0, como el 3.A.17, y remitir (ficha monopolio-bilateral).'
    - tema: 3.A.13
      que: 'La nota 13 remite el modelo de Laffont y Tirole (1991) al 3.A.20; hoy la referencia es el 3.A.17 (anexo A) y pasará al 3.A.20 cuando se revise (P21-02, 21/10/2026). No menciona la discriminación de 2.º grado como aplicación del screening: remitir al 3.A.17 (II.1.2) con el mismo lenguaje (PC, IC, renta informativa, no distorsión arriba). Resuelto en la revisión del 3.A.13 (19/10/2026): Laffont y Tirole (1993) con \vertema{3.A.17} y la discriminación de 2.º grado en las extensiones de Rothschild-Stiglitz con ese lenguaje («allí t_1 < t_2»).'
    - tema: 3.A.22
      que: 'Su comentario inicial pide «en el tema 3.A.17… sustituir la variable x por la variable q»: resuelto en el 3.A.17 revisado (la demanda es x(p) y el monopolista vende q = x(p), p = p(q)); la referencia del 3.A.22 al 3.A.17 era un comentario privado y queda como sobra.'
    - tema: 3.A.18, 3.A.19
      que: 'Comparten el enganche del 3.A.17 original (paradoja de Barbie y Marshall; contradicción X1 del 3.A.12): cada uno necesita el suyo (el 3.A.17 usa el refrán «Quien parte y reparte» y la sentencia de Google). El 3.A.18 debe remitir al 3.A.17 para el índice de Lerner de cada variedad y el 3.A.19 para el cártel como monopolio multiplanta (faltan); si escriben una lagrangiana junto a 𝓛, sin 𝓛 (notacion.md § 0). 3.A.18 resuelto en su revisión (19/10/2026): enganche propio y remisión al 3.A.17 para el Lerner de cada variedad, sin lagrangiana 𝓛; queda el 3.A.19.'
    - tema: 3.A.23
      que: 'Remite «libre entrada y salida» a 3.A.17 y 3.A.19 (ya marcado corregir -> 3.A.15, 3.A.16) y el índice 1.3.1 «Poder de mercado» a 3.A.15-3.A.17 (corregir -> 3.A.17-3.A.20).'
    - tema: 4.B.15
      que: 'Subaditividad remitida a 3.A.10 (es 3.A.17); tarifa de punta CF/n + CMg·q (el error que el 3.A.17 corrigió: p_p = b + β); Averch-Johnson con r y P mayúscula (canon w_K, p, z_K, z_L, s); transferencia de Laffont-Tirole con el signo cambiado (t = a − b(C − C^a)). Al revisarlo, reutilizar regulacion-monopolio-natural.tex y averch-johnson.tex del 3.A.17 (fichas monopolio-natural, averch-johnson, laffont-tirole, tarifa-dos-partes).'
    - tema: 4.A.12
      que: 'Remite el price cap al 3.A.20 en lugar del 3.A.17 (hoy en su anexo A); queda bien, porque la referencia pasa al 3.A.20 (P21-02, Víctor, 21/10/2026). Escribe ṗ ≤ IPC − X (canon p_{t+1} ≤ p_t(1 + IPC_t − X)).'
    - tema: 3.A.20
      que: 'Sin fuente. Decidido (P21-02, Víctor, 21/10/2026): al redactarlo pasa a ser el tema de referencia de averch-johnson, price-cap, laffont-tirole y yardstick (información asimétrica en el título), con la presentación y los gráficos del anexo A del 3.A.17 (averch-johnson.tex, algoritmo-regulacion.tex, pico-valle.tex, pcmg-beneficios.tex); el 3.A.17 queda en mención, con su anexo A resumido y \vertema{3.A.20} (pendientes-coherencia.md). Monopolio natural, Ramsey-Boiteux y tarifa en dos partes se quedan en el 3.A.17. Resuelto en la revisión del 3.A.20 (22/10/2026): referencia de los 4 y de la captura, con averch-johnson.tex, algoritmo-regulacion.tex y regulacion-monopolio-natural.tex copiados (pico-valle y pcmg-beneficios no hacen falta: punta y valle va de palabra); falta aplicar al 3.A.17 su parte con --fase coherencia.'
    - tema: 3.A.14
      que: 'Al revisarlo, la negociación de Nash y Rubinstein con la notación del 3.A.17 y del 3.A.21 (puntos de desacuerdo U^0, γ para el poder de negociación, tasas de descuento ρ; γ = ρ_B/(ρ_S + ρ_B) en el límite de Binmore, Rubinstein y Wolinsky) y el monopolio bilateral como aplicación, con remisión al 3.A.17; propuesta de ficha nash-negociacion con el 3.A.14 como referencia. Resuelto en la revisión del 3.A.14 (19/10/2026): solución de Nash generalizada con u_i^0 y γ, Rubinstein con β_1, β_2 y BRW con γ = ρ_2/(ρ_1 + ρ_2) (misma fórmula con jugadores genéricos), monopolio bilateral como aplicación con \vertema{3.A.17}; ficha nash-negociacion creada.'
    - tema: 4.B.8
      que: 'Al revisarlo, la incidencia con monopolio con la notación y los resultados de la anotación de I.2 del 3.A.17 (IMg = CMg + t; (1 − t)IMg = CMg; traslación t/2 con demanda lineal y mayor que t con isoelástica, Bulow y Pfleiderer, 1983) y remisión al 3.A.17 (ficha monopolio).'
