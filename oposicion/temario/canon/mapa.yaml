        revisarlo, el mismo nombre (IC, «condición de no escaqueo» como su nombre en Shapiro-Stiglitz) y e para el esfuerzo,
        como el 3.A.13 (fichas principal-agente y salarios-eficiencia).'
    - tema: 3.A.14
      que: 'Sin fuente completa (su Word solo esboza trabajadores «buenos y malos»). Tendrá que desarrollar lo que le remite el
        3.A.13: los juegos bayesianos y el equilibrio bayesiano perfecto, la señalización de Spence como juego (creencias μ,
        separadores, agrupadores, criterio intuitivo de Cho y Kreps) con la notación de la ficha spence-senalizacion (y, ŷ,
        c_A, c_B, w_A, w_B), el principio de revelación (Gibbard; Dasgupta, Hammond y Maskin; Myerson) y el diseño de mecanismos
        (ficha diseno-mecanismos, referencia en el 3.A.14). Resuelto en la revisión del 3.A.14 (19/10/2026): juegos bayesianos (EBN) y EBP, juego de señalización con y, ŷ, c_A, c_B, w_A, w_B, ν y μ(y), criterio intuitivo con el separador más barato, principio de revelación con el enunciado común y diseño de mecanismos en III.2 (fichas equilibrio-nash, spence-senalizacion y diseno-mecanismos).'
    - tema: 3.A.23
      que: 'Su índice «1.3.2 Información asimétrica [Tema 3.A.13]» y el supuesto «información perfecta sobre precios y características
        [ver tema 3.A.13]» son correctos. Al revisarlo, resumir la información asimétrica con la terna de condiciones (información
        oculta, heterogeneidad, conflicto de intereses) y las soluciones públicas de I.3.3 del 3.A.13 (información obligatoria
        y garantías legales, seguro obligatorio, aseguramiento público, límites a la discriminación), sin repetir los modelos
        (ficha akerlof-lemons).'
    - tema: 3.A.25
      que: 'Presenta Spence como alternativa al capital humano con remisión al 3.A.13 y la misma nota (32) que la nota 18 del
        3.A.13 original: coherente. Al revisarlo, y para la educación (D129), sin el «arrepentimiento» de Spence (sin fuente):
        supone que la educación no aumenta la productividad para aislar la señal (ficha spence-senalizacion).'
    - tema: 3.A.15
      que: 'Sin fuente. El 3.A.13 le remite la separación entre propiedad y control con los costes de agencia de Jensen y Meckling
        (1976), los contratos incompletos y derechos de propiedad (Grossman-Hart-Moore, Nobel de Hart en 2016) y el precio límite
        como señal (Milgrom y Roberts, 1982): al redactarlo, desarrollarlos con la terminología del 3.A.13 (coste de agencia,
        relación de agencia, PC e IC; ficha principal-agente).'
    - tema: 3.A.20
