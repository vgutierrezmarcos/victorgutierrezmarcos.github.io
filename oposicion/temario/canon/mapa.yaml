        (aplicaciones de I.1, nota y aplicaciones de II.1, extensiones de la conclusión) pasan de 3.A.17 a 3.A.20 (pendientes-coherencia.md).'
    - tema: 3.A.10
      que: 'En revisión en paralelo; se coordina por el canon y por su P59. Su original titulaba la demanda de seguros «Modelo
        de Rothschild y Stiglitz, 1976» (es Mossin, 1968) y usaba A = (p_1, p_2; W, W − P) y «−dx_2/dx_1 = −(1−r)/r», los
        mismos errores que el 3.A.13. Su .tex en revisión ya usa Mossin, la lotería (W̄, W̄ − L; 1 − π, π), el punto A, γ
        y la pendiente −(1 − γ)/γ, como el 3.A.13: lo comprueba su propia fase canon. Resuelto en la revisión del 3.A.10
