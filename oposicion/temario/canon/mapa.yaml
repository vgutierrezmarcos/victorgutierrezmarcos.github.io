      uso: ampliar
      nota: 'Ampliación; el 3.A.14 no depende de ella (D138).'
    - a: 4.A.15
      estado: ok
      contexto: 'Programas de clemencia (I.2.1 y III.1); colusión en licitaciones, sanción de la CNMC de 2022 (III.3.2), solo
        para ampliar (D138)'
      uso: ampliar
      nota: 'Ampliación; el 3.A.14 no depende de ella (D138).'
    - a: 4.B.11
      estado: ok
      contexto: 'Imposición óptima con información privada (III.1 y III.2), solo para ampliar (D138)'
      uso: ampliar
      nota: 'Ampliación; el 3.A.14 no depende de ella (D138).'
    - a: 4.B.26
      estado: ok
      contexto: 'Subastas del Tesoro (III.3.3), solo para ampliar (D138)'
      uso: ampliar
      nota: 'Ampliación; el 3.A.14 no depende de ella (D138).'
    faltan:
    - a: 3.A.20
      por_que: 'Decidido (P21-02, Víctor, 21/10/2026): la regulación con información asimétrica tiene su referencia en el 3.A.20, revisado el 22/10/2026: l. 1089 y 1150 pasan de \vertema{3.A.17} a \vertema{3.A.20} con --fase coherencia cuando Víctor apruebe el 3.A.20 (pendientes-coherencia.md).'
    contradicciones:
    - tema: 4.B.26
      que: 'Las subastas del Tesoro están hoy en el Word guardado como «Tema 4.A.19» (numeración antigua; el 4.A.19 actual son
        las entidades de crédito), que llama «holandesa» a la de precio único y «americana» a la de precio múltiple (jerga del
        Tesoro, opuesta a la teoría: holandesa = descendente, que con varias unidades es discriminatoria). Al revisar el 4.B.26:
        «de precio único (uniforme)» y «de precio ofrecido (discriminatoria)», con la nota de terminología del 3.A.14, el
        formato «convencional corregida» y \vertema{3.A.14} (ficha subastas; D8 del 3.A.14).'
    - tema: 3.A.19
      que: 'Su anexo 1 «Teoría de juegos» resume lo que desarrolla el bloque I del 3.A.14: reducirlo a remitir. Desarrolla
        el Cournot bayesiano (en el 3.A.14 es una caja: coherente si lo conserva, con c_A, c_B y π). φ para la función de
        reacción → R_i (D016). Remite Theory of Games y la teoría de juegos al 3.A.10 (es 3.A.14). La colusión con el gatillo
        (Friedman, 1971) remite al 3.A.14 el teorema de tradición oral (D4 del 3.A.14; fichas equilibrio-nash y dilema-prisionero).'
    - tema: 3.A.27
      que: 'Desarrolla Nash axiomático (f(N,d), u^N, d) y Rubinstein en extenso con otra notación: al revisarlo, resumen aplicado
        con u_i^0 (o U_S^0, B^0), γ, ρ y remisión al 3.A.14 para los axiomas y Rubinstein (ficha nash-negociacion; D5 del 3.A.14).'
    - tema: 3.B.7, 3.B.8
      que: '«Johnson (1953) demostró que existirá un equilibrio de Nash [ver tema 3.A.19]» → \vertema{3.A.14} (ficha dilema-prisionero).'
    - tema: 4.A.15
      que: 'Clemencia como dilema del prisionero «[ver tema 3.A.16]» → \vertema{3.A.14}; bid rigging con la sanción de la CNMC
        de 2022 (recurrida: no decir que es firme).'
    - tema: 3.A.6, 3.A.36, 3.A.41, 3.A.44
      que: 'Remiten los juegos repetidos de Barro-Gordon a 3.A.17 o 3.A.19: el concepto (repetición, reputación) es del 3.A.14
        y el modelo del 3.A.36 (fichas equilibrio-nash y barro-gordon).'
    - tema: 3.A.1, 3.A.22, 3.A.24
      que: 'Ultimátum y dictador: el 3.A.14 los menciona en la evidencia de la negociación (Güth, Schmittberger y Schwarze,
        1982) y en III.1; al revisarlos, remitir allí la versión de juegos (ENPS con agentes egoístas). 3.A.22 y 3.A.24: hechos (21 y 22/10/2026).'
    - tema: 3.A.18
      que: 'En revisión en paralelo. Su nota 25 remitía la teoría de juegos al 3.A.10. Resuelto en la revisión del 3.A.18
        (19/10/2026): \vertema{3.A.14} en la contextualización, II.1, II.3.3, III.1 y la conclusión; Bertrand y Cournot diferenciados
