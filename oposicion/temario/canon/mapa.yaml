    - a: 3.A.22
      estado: ok
      contexto: 'Sin precio-aceptación falla el 1TFEB (introducción); 1TFEB y eficiencia (I.3 a); primer y segundo óptimo frente a condiciones de primer y segundo orden (nota de II.2.3)'
    - a: 3.A.23
