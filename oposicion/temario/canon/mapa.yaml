temas:
  3.A.1:
    titulo: Objeto y métodos de la ciencia económica. Cuestiones y debates actuales, con especial referencia a la economía
      conductual.
    bloque: historia-del-pensamiento-economico
    fuente_disponible: si
    referencias:
    - a: 3.A.8-3.A.10; 3.A.11-3.A.12; 3.A.16-3.A.19
      estado: ok
      contexto: marginalistas sientan los cimientos de la teoría de la demanda, producción y costes y estructuras de mercado
    - a: 3.A.22-3.A.24
      estado: ok
      contexto: 'Economía del bienestar: contribuciones de Pareto, Pigou y Coase'
    - a: 3.A.13
      estado: ok
      contexto: Economía de la información desde los años 70 con Akerlof
    - a: 3.A.25-3.A.27
      estado: ok
      contexto: Economía del mercado de trabajo, de Marshall y Pigou o Hicks hasta Becker
    - a: 3.B.5-3.B.9
      estado: ok
      contexto: 'Comercio internacional: Ohlin, Samuelson, Krugman y Melitz'
    - a: 3.B.23-3.B.25
      estado: ok
      contexto: 'Economía financiera: modelo media-varianza de Markowitz'
    - a: 3.A.43-3.A.45
      estado: ok
      contexto: 'ramas de la macro con modelos dinámicos microfundamentados: crecimiento'
    - a: 3.A.42
      estado: ok
      contexto: teoría de ciclos económicos
    - a: 3.B.15-3.B.16
      estado: corregir -> 3.B.14
      contexto: Economía internacional (modelos de la NOEM)
    - a: 3.A.29
      estado: ok
      contexto: la macroeconomía moderna le debe más a Irving Fisher que a Keynes
    - a: 3.A.8
      estado: ok
      contexto: teoría del consumidor como ejemplo de enfoque deductivo
    - a: 3.A.15
      estado: ok
      contexto: Escuela de Harvard de Organización Industrial parte de la observación empírica
    - a: 3.B.28
      estado: ok
      contexto: Randomized Control Trials como método inductivo
    - a: 3.A.10
      estado: ok
      contexto: Daniel Bernoulli resolvió la paradoja de San Petersburgo con matemáticas
    - a: 3.A.13
      estado: corregir -> 3.A.14
      contexto: juegos de información incompleta de Harsanyi, útiles para los economistas de la información
    - a: 3.A.15
      estado: ok
      contexto: Simon sustituye la maximización por la racionalidad limitada de los gerentes
    - a: 3.A.24
      estado: corregir -> 3.A.14
      contexto: 'economía conductual: motivaciones distintas al puro interés individual (índice)'
    - a: 3.A.29
      estado: ok
      contexto: preferencias intertemporales inconsistentes dinámicamente (índice)
    - a: 3.A.10
      estado: ok
      contexto: efecto dotación (índice)
    - a: 3.A.24
