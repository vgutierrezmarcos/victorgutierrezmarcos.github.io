# Mapa del canon del temario TCEE: modelos compartidos (2+ temas) con su tema de referencia,
# y por tema: bloque, fuente, referencias «[ver tema …]» con su estado, referencias que faltan,
# modelos (ids canónicos, ver _inventario/alias.json) y fecha de revisión.
# Generado en el paso 1 de la consolidación (13 oct. 2026) a partir de _inventario/*.json.
# fuente_disponible: si | parcial (incompleta o con restos del título anterior) | renumerado (el contenido está en el Word de otro número del temario antiguo) | otro-titulo (Word del título antiguo, se aprovecha lo que encaja) | no.
# tema_referencia: un tema, o una lista de dos cuando es doble (uno del 3.er ejercicio y otro del 4.º, cada uno completo para su examen). decision: id de decisiones.json que lo fijó (aprobadas el 13/10/2026). En temas, el papel es el objetivo; «(hoy …)» indica lo que hay ahora en la fuente.
# uso: ampliar (en una referencia o una que falta de un tema del 3.er ejercicio a uno del 4.º): remisión solo para ampliar; el tema del 3.º no depende de ella (D138). nota: aclaración de la referencia.
# contradicciones (en temas revisados): errores o desajustes que la revisión del tema ha detectado en OTROS temas; no se tocan
#   esos temas, se corrigen cuando se revisen (o con --fase coherencia si ya están revisados; ver pendientes-coherencia.md).
# Autor: Víctor Gutiérrez Marcos
