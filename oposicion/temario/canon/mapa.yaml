  3.A.21:
    titulo: La teoría del equilibrio general.
    bloque: modelo-neoclasico-basico
    fuente_disponible: si
    referencias:
    - a: 3.A.8
      estado: ok
      contexto: 'Individualismo metodológico (introducción); axiomas de las preferencias (I.1); demandas y ley de Walras individual
        (I.2.2); axioma débil que la demanda agregada no hereda (II.1.2, anexo B)'
    - a: 3.A.16
      estado: ok
      contexto: 'Equilibrio parcial frente a general (introducción, conclusión); precio-aceptación (I.1); exceso de demanda en
        un mercado (nota de I.2.3); estabilidad en un mercado, ajuste walrasiano y marshalliano (II.1.3, anexo D)'
    - a: 3.A.2
      estado: ok
      contexto: 'Quesnay y Smith, sin modelo cerrado (contextualización); ley de Say frente a ley de Walras (nota de I.2.4)'
    - a: 3.A.3
      estado: ok
      contexto: 'Walras y la escuela de Lausana (contextualización)'
    - a: 3.A.22
      estado: ok
      contexto: 'Teoremas del bienestar (relevancia, estructura); eficiencia en la producción (I.2.1); Pareto y los dos teoremas
        resumidos (II.2, anexo C)'
    - a: 3.A.23
      estado: ok
      contexto: 'Fallos de mercado como justificación de la intervención (relevancia); externalidades y bienes públicos (nota
        de I.1; antes 3.A.22); el equilibrio deja de ser eficiente (II.2, anexo C, conclusión)'
    - a: 3.A.11
      estado: ok
      contexto: 'Tecnología convexa y rendimientos (I.1); caja de la producción, curva de contrato y FPP con el gráfico
        caja-edgeworth-fpp (I.2.1); isocuantas estrictamente convexas sin rendimientos y z⃗ de factores (notas); netputs (anexo
        A); formas funcionales de los MEGC (III.5)'
    - a: 3.A.12
      estado: ok
      contexto: 'Maximización del beneficio en dos etapas y Hotelling (I.2.1, anexo A); función de beneficios (anexo A); Shephard
        en los requerimientos unitarios (anexo E)'
    - a: 3.B.6
      estado: ok
      contexto: 'FPP convexa con rendimientos crecientes (nota de I.2.1); competencia imperfecta con no convexidades (III.2)'
    - a: 3.A.9
      estado: ok
      contexto: 'Propiedades de la demanda individual (Slutsky) que la agregación borra (nota del teorema SMD, II.1.2)'
    - a: 3.A.14
      estado: ok
      contexto: 'Nash y el punto fijo (nota de II.1.1); poder negociador en el intercambio de Edgeworth (III.1); núcleo de los
        juegos cooperativos (III.2); diseño de mecanismos (recuadro de III.2)'
    - a: 3.A.4
      estado: ok
      contexto: 'Ley de Say y Keynes (nota de I.2.4); procesos sin tanteo y desequilibrio (II.1.3); efecto saldos reales en
        el desequilibrio (III.3); críticas de Clower y Leijonhufvud (conclusión)'
    - a: 3.A.13
      estado: ok
      contexto: 'Información asimétrica como fallo (II.2, conclusión); diseño de mecanismos (recuadro de III.2); mercados
        que faltan (III.4)'
    - a: 3.A.24
      estado: ok
      contexto: 'Óptimo social, FBS e incompletitud de Pareto (II.2, anexo C, conclusión)'
    - a: 3.A.19
      estado: ok
      contexto: 'Equilibrio de Cournot-Walras (III.2, comportamiento estratégico)'
    - a: 3.A.17
      estado: ok
      contexto: 'Rendimientos crecientes y monopolio natural (III.2, no convexidades)'
    - a: 3.A.35
      estado: ok
      contexto: 'Demanda de dinero tipo Cambridge (III.3)'
    - a: 3.A.29
      estado: ok
      contexto: 'Dinero como depósito de valor en generaciones solapadas (III.3); ineficiencia dinámica (III.4)'
    - a: 3.A.10
      estado: ok
      contexto: 'Preferencia por el estado (III.4)'
    - a: 3.A.31
      estado: ok
      contexto: 'Matrices de contabilidad social en la calibración de los MEGC (III.5)'
    - a: 3.B.31
      estado: ok
      contexto: 'Modelo DICE de Nordhaus (III.5); economía del clima (conclusión)'
    - a: 3.A.6
      estado: ok
      contexto: 'DSGE como versión agregada e intertemporal (III.5, conclusión)'
    - a: 3.A.42
      estado: ok
      contexto: 'Macroeconomía de equilibrio general dinámico y estocástico (conclusión)'
    - a: 3.B.5
      estado: ok
      contexto: 'Heckscher-Ohlin como equilibrio general (relevancia, conclusión); Stolper-Samuelson y Rybczynski (nota de II.1.2,
        anexo E)'
    faltan: []
    contradicciones:
    - tema: 3.A.22
      que: 'Criterio de Pareto (ventajas y cinco críticas) y 1TFEB idénticos al 3.A.21 original; supuestos del 1TFEB de equilibrio
        parcial (MWG, «bien no numerario»); «modelo 2×2×2» con 10 incógnitas; |RMST|; su anexo 3 atribuye el 2TFEB a 3.A.24. Al
        revisarlo: desarrollar los TFEB con la notación D035/D045 (ω⃗), la versión de equilibrio general y la especificación del
        anexo A del 3.A.21 (I, J, n); reutilizar los gráficos caja-intercambio-teoremas y caja-produccion-precios del 3.A.21.'
    - tema: 3.A.23
      que: 'Copia el modelo 2×2×2×2 y los TFEB; usa w, r; su introducción («nos vamos a centrar en la intervención por eficiencia…»)
        estaba pegada al final del II.2.2 del 3.A.21; su anexo 1 atribuye el 2TFEB a 3.A.24. Remitir a 3.A.21 y 3.A.22.'
    - tema: 3.A.24
      que: 'Su anexo 3 atribuye el 2TFEB a 3.A.24: es de 3.A.22 (ya corregir -> 3.A.22). Resuelto en su revisión (22/10/2026).'
    - tema: 3.A.16
      que: 'Misma estabilidad que el 3.A.21 original (idea, Musgrave, ajustes, imágenes 8-9, tabla, nota del tanteo; «exceso
        de oferta negativo») y una imagen con fuente «Tema 3A-21» de otro opositor. Al revisarlo: desarrollar los dos ajustes
        con el gráfico estabilidad-parcial y la tabla de color del anexo D del 3.A.21 (ficha tatonnement), p^D(q), p^S(q), y acortar
        la nota histórica del tanteo, que va completa en 3.A.21 (I.1). Resuelto en la revisión del 3.A.16 (17/10/2026): gráfico y tabla copiados sin cambios, p^D y p^S, nota del tanteo acortada; Musgrave con un matiz que el 3.A.21 no tiene (pendientes-coherencia.md).'
    - tema: 3.A.10
      que: 'Mismo texto de los bienes contingentes y el paraguas (comentario «Coordinar en temas 3.A.10 y 3.A.21»): quedarse con
        la elección individual y remitir a 3.A.21 para el equilibrio (ficha arrow-debreu-incertidumbre). Resuelto en la revisión
        del 3.A.10 (19/10/2026): I.3 se queda con la elección individual, la misma tangencia y el mismo ejemplo, con remisión
        al 3.A.21.'
    - tema: 3.A.25
      que: '«Se cumplen las propiedades de existencia, unicidad y estabilidad por trabajar con supuestos competitivos [ver tema
        3.A.14]»: la competencia no garantiza unicidad ni estabilidad (SMD) y la remisión es a 3.A.21 (ya corregir -> 3.A.21).'
    - tema: 3.A.35
      que: 'Fecha a Patinkin en 1951; canon Money, Interest and Prices (1956; 2.ª ed. 1965) o, si se citan los artículos previos,
        1948-1949 (ficha patinkin).'
    - tema: 3.A.4
      que: 'La historia de Patinkin en cuatro pasos (desequilibrio) estaba en el 3.A.21 original: es materia de 3.A.4 (D111),
        que debe desarrollarla; 3.A.21 solo da la versión de equilibrio general (dicotomía inválida, problema de Hahn).'
    - tema: 3.A.14
      que: 'Define el núcleo como «vector de pagos» con utilidad transferible y lo mezcla con el valor de Shapley; falta la remisión
        al núcleo de una economía (3.A.21; ficha nucleo, coalición T ⊆ N en juegos y 𝒮 en la economía). Resuelto en la revisión del 3.A.14 (19/10/2026): núcleo con utilidad transferible y signo correcto (ficha nucleo-shapley), separado del valor de Shapley, con una viñeta de Debreu-Scarf y \vertema{3.A.21}.'
    - tema: 3.A.3
      que: '«Walras caracterizó las condiciones de existencia y estabilidad»: decir que Walras planteó el problema contando
        ecuaciones y que la primera demostración de la existencia es de Wald (1935-1936), como 3.A.21.'
    - tema: 3.B.5
      que: 'Usa la caja de Edgeworth y el equilibrio general sin remitir a 3.A.21; al revisarlo, álgebra de Jones con s_{Lj}, ℓ_{Lj}
        y x̂ (notacion.md § 10) y los gráficos costes-unitarios y rybczynski del 3.A.21 (ficha heckscher-ohlin).'
