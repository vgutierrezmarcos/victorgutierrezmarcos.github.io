  3.A.10:
    titulo: Teoría de la demanda del consumidor (III). Elección del consumidor en situaciones de riesgo e incertidumbre.
    bloque: informacion-y-poder-de-mercado
    fuente_disponible: si
    referencias:
    - a: 3.A.1
      estado: ok
      contexto: 'Los fallos de la utilidad esperada como origen de la economía conductual (relevancia práctica y de la conclusión);
        anomalías que explica la teoría de las perspectivas (evidencia de II.2); caja de finanzas conductuales (anotación de
        II.2)'
    - a: 3.A.8
      estado: ok
      contexto: 'Individualismo metodológico (enganche); el método de la teoría del consumidor y su esquema de ingredientes
        (I.1, gráfico esquema-tue); función indirecta de utilidad (nota de los resultados monetarios); preferencias como en
        certidumbre (axiomas); CRRA con la misma ecuación (I.1.2); Cobb-Douglas en logaritmos y recta de balance (seguros, I.2.1);
        efecto dotación (II.2); utilidad cardinal de vNM (anexo A, 2 remisiones)'
    - a: 3.A.11
      estado: ok
      contexto: 'Empresa aversa al riesgo de Sandmo (1971): cumple la remisión del 3.A.11 (nota y implicaciones de I.2.3)'
    - a: 3.A.12
      estado: ok
      contexto: 'Costes ciertos C(w⃗,q) con w⃗ fijo en la empresa aversa al riesgo (supuestos de I.2.3)'
    - a: 3.A.13
      estado: ok
      contexto: 'Seguros e información asimétrica (relevancia y conclusión); la demanda de seguros como base de Rothschild-Stiglitz
        (nota de I.2 y valoración de I.2.1); mercados que faltan con información asimétrica (extensiones de la conclusión)'
    - a: 3.A.14
      estado: ok
      contexto: 'Pagos esperados en la teoría de juegos y las subastas (relevancia y conclusión)'
    - a: 3.A.21
      estado: ok
      contexto: 'Equilibrio general con mercados contingentes (relevancia); reparto óptimo del riesgo (nota de la valoración
        de I.2.1); equilibrio, títulos de Arrow y mercados que faltan (preferencia por el estado, I.3); reparto eficiente
        con mercados completos (extensiones de la conclusión)'
    - a: 3.A.24
      estado: ok
      contexto: 'La independencia de las alternativas irrelevantes de Arrow no es el axioma de independencia (nota de I.1.1);
        maximin de Wald como criterio de Rawls frente a Harsanyi (nota de III.2)'
    - a: 3.A.29
      estado: ok
      contexto: 'CRRA: ESI = 1/θ (I.1.2 y extensiones de la conclusión)'
    - a: 3.A.33
      estado: ok
      contexto: 'Consumo y ahorro con incertidumbre (relevancia); Hall con utilidad cuadrática sin ahorro precautorio (prudencia,
        I.1.2); la prudencia explica el ahorro precautorio que Hall excluye (extensiones de la conclusión)'
    - a: 3.A.34
      estado: ok
      contexto: 'Incertidumbre e irreversibilidad de la inversión (extensiones de la conclusión)'
    - a: 3.A.35
      estado: ok
      contexto: 'Demanda de dinero como activo (relevancia y conclusión); motivo especulación con el dinero como activo seguro
        (extensiones de I.2.2)'
    - a: 3.B.23
      estado: ok
      contexto: 'Teoría de carteras de Markowitz, Tobin y Sharpe (media-varianza, I.1.2; extensiones de I.2.2; nota del Nobel
        de Markowitz, II.1; anexo D, 2 remisiones; pregunta del tribunal, anexo F); caja de finanzas conductuales (II.2);
        relevancia de la conclusión'
    - a: 3.B.26
      estado: ok
      contexto: 'Diamond-Dybvig: desarrollo, regulación y casos recientes (anexo C, entrada e implicaciones)'
    - a: 3.B.27
      estado: ok
      contexto: 'Diamond-Dybvig: garantía de depósitos, resolución y regulación (anexo C, entrada e implicaciones)'
    faltan:
    - a: 3.B.25
      por_que: El enfoque de preferencia por el estado y los activos de Arrow-Debreu (activos contingentes) se relacionan con
        la valoración de derivados; opcional y no usada (el tema no habla de derivados).
    contradicciones:
    - tema: 3.B.23
      que: 'Tiene la misma caja de enigmas financieros (prima de las acciones, exceso de volatilidad, efecto disposición, dividendos)
        que el 3.A.10 original, casi literal, con «más de 6 puntos» sin fuente y «hasta ahora tributaban más». Al revisarlo,
        desarrollar la eficiencia (ficha emh) y dejar la explicación conductual resumida con remisión al 3.A.10 (o al revés,
        sin repetirla), con las cifras con fuente del 3.A.10 (≈ 6 puntos sobre letras y ≈ 5 sobre bonos; Damodaran, UBS;
        dividendos hasta 2003); 𝔼(r_p) y no E(r_p) en Markowitz (ficha markowitz).'
    - tema: 3.A.1
      que: '«Efecto dotación [ver tema 3.A.10]» (2 veces) y San Petersburgo «[ver tema 3.A.10]»: se cumplen (II.2 y anexo B
        del 3.A.10). Al revisarlo, la teoría de las perspectivas solo en resumen (función de valor en S, λ ≈ 2,25, efecto
        dotación), con w(π_s) si escribe la ponderación (ficha prospect-theory).'
    - tema: 3.A.24
      que: 'Dice que, según Harsanyi, los individuos tras el velo «serán neutrales al riesgo»: con utilidad esperada son neutrales
        respecto a la utilidad (maximizan la utilidad media), no respecto a la renta. Precisarlo al revisarlo. Su remisión del
        maximin de Rawls a 3.A.10 se cumple (III.2, criterio de Wald; fichas fbs-rawlsiana y utilidad-esperada-vnm). Resuelto en su revisión (22/10/2026).'
    - tema: 3.A.29
      que: 'El 3.A.10 original escribía «ESI ≡ σ = 1/θ»; al revisar el 3.A.29, ESI = 1/θ sin símbolo propio (D001) y la CRRA
        con la misma ecuación que el 3.A.8 y el 3.A.10 (θ, el −1, ln con θ = 1; ficha aversion-riesgo-arrow-pratt).'
    - tema: 3.A.33
      que: 'Leland (1968) y Sandmo (1970) en su tabla: añadir Kimball (1990), la condición u‴ > 0 como necesaria y suficiente
        del ahorro precautorio (no la aversión) y DARA ⇒ prudencia, con la redacción del 3.A.10 (I.1.2 y anexo E); Hall
        con cuadrática sin motivo precaución (fichas hall y aversion-riesgo-arrow-pratt).'
    - tema: 3.B.27
      que: 'Diamond-Dybvig con τ, r_1, r_2, r_1^d, r_2^d y 4 gráficos: canon π, R, L, c_1, c_2 (D064) y resumen si la referencia
        es 3.B.26 (D042). El 3.A.10 lo deja ya resumido en su anexo C, con el gráfico diamond-dybvig.tex en la notación canónica,
        que el 3.B.26 puede reutilizar (ficha diamond-dybvig).'
    - tema: 4.A.20
      que: 'Diamond-Dybvig con τ (fracción de impacientes, choca con τ coste iceberg y tipos), r_1 < 1 < r_2 y r_1^d, r_2^d:
        canon π, R, L, c_1, c_2; resumen aplicado con lo imprescindible para cantarse sin el 3.B.26 (ficha diamond-dybvig).
        Garantía de depósitos con la Directiva (UE) 2026/804 y los FGD financiados por las entidades (objetivo 0,8 %), como
        el anexo C del 3.A.10.'
    - tema: 3.A.14
      que: 'Tendrá que usar los pagos esperados de vNM con la notación del 3.A.10 (U(x̃) = 𝔼[u(x̃)], u de Bernoulli) y fechar
        Theory of Games en 1944, con la teoría de la utilidad en el apéndice de la 2.ª edición (1947) (ficha utilidad-esperada-vnm).
        3.A.18 y 3.A.19 remiten a 3.A.10 la teoría de juegos como extensión de la decisión con incertidumbre: es 3.A.14 (ya
        corregir -> 3.A.14). Resuelto en la revisión del 3.A.14 (19/10/2026): U_i = 𝔼[u_i] de vNM, Theory of Games de 1944 con el apéndice de 1947, maximin de Wald y Laplace frente al minimax con remisión al 3.A.10.'
    - tema: 3.A.35
      que: 'El 3.A.10 le remite la demanda de dinero por motivo especulación con el dinero como activo seguro (I.2.2): al revisarlo,
        Tobin (1958) con la aversión al riesgo del 3.A.10 (r_A, u cóncava) y la presentación de la ficha tobin-cartera, con
        remisión al 3.A.10.'
    - tema: 3.B.2, 3.B.3
      que: '«El coste de capital sería la Teoría de la Utilidad Esperada [ver tema 3.A.10]» y el coeficiente α del equivalente
        cierto: remisiones correctas. Al revisarlos, equivalente cierto ξ (nunca EC) y la distinción riesgo-incertidumbre de
        Knight con las palabras del 3.A.10.'
    modelos:
