    contradicciones:
    - tema: 3.A.21
      que: 'X1. Su revision.md (tabla de marcas, l. 51) dice que Musgrave se quitó de la estabilidad, pero 3A21.tex (II.1.3 a,
        l. 529) lo mantiene, sin el matiz de que la estabilización de Musgrave es del conjunto de la economía. El 3.A.16 sigue
        el .tex con el matiz. Ver pendientes-coherencia.md.'
    - tema: 3.A.21
      que: 'X2. Anexo D (l. 1389): «oferta con economías externas o rendimientos crecientes»; en competencia la oferta de la
        industria solo es decreciente por economías externas a la empresa (industria de costes decrecientes, 3.A.16 III.3 c);
        con rendimientos crecientes internos no hay oferta competitiva. Ver pendientes-coherencia.md.'
    - tema: 3.A.12
      que: 'X3 (menor). l. 443: «la inversa del tramo creciente del coste marginal por encima del mínimo del coste medio» sin
        el matiz del plazo (CVMe a corto, CMe a largo, como su nota y l. 1129). Ver pendientes-coherencia.md.'
    - tema: 3.A.8
      que: 'X4. Numerario x_0 y U_h = x_0 + φ_h(x_1,…,x_n) en la nota de agregación (l. 560); el 3.A.16 usa n_i y U_i = n_i + φ_i(x_i).
        No conviven (en el 3.A.8 los bienes van indexados); solo se cambia si Víctor decide unificar (D10).'
    - tema: 3.A.17
      que: 'X5. Word: comentario que dice que en 3.A.11, 3.A.12, 3.A.16 y 3.A.19 la demanda ya se escribe con q (en el 3.A.16
        es x(p) y la oferta q(p)); P mayúscula y ε_{q^D,P}. En revisión en paralelo (17/10/2026): demanda inversa p(q) en el monopolio
        y la comparación p = CMg (3.A.16) frente a IMg = CMg con la misma notación. Resuelto en la revisión del 3.A.17 (17/10/2026): x(p) demanda, q = x(p) y p(q) en el monopolio, p minúscula, ε_{q,p}, p^c y q^c como referencia competitiva y la misma notación de excedentes y colores que el 3.A.16.'
    - tema: 4.B.8
      que: 'X6. Casos extremos al revés (demanda perfectamente elástica: «productores 0 %», es 100 %), «añadirle el impuesto»
        → deducirle, P_C/P_V → p_c/p_v. Al revisarlo, reutilizar el gráfico incidencia.tex del 3.A.16 (ficha incidencia-equilibrio-parcial).'
    - tema: 3.A.22, 3.A.23, 3.A.24
      que: 'X7. Sus anexos de relación de temas, gemelos del anexo 1 del 3.A.16 original, atribuyen el 2TFEB a 3.A.24 (es 3.A.22).
        El 3.A.16 los sustituye por «Qué estudia cada tema del bloque» en su anexo D. Resuelto en los 3 (el 3.A.24, 22/10/2026: anexo F).'
    - tema: 3.A.3
      que: 'X8. Tema de referencia de marshall-equilibrio-parcial: al revisarlo, reutilizar el gráfico marshall-periodos.tex del
        3.A.16 (antes «Imagen 5») y la referencia exacta de las tijeras (libro V, cap. III, § 7).'
    - tema: 3.A.5, 3.A.6
      que: 'Telaraña (ficha telarana): 3.A.6 debe citar que Muth (1961) parte de este mercado y 3.A.5, si escribe las expectativas
        adaptativas, hacerlo como el anexo E del 3.A.16 (p^e_t = p^e_{t−1} + γ(p_{t−1} − p^e_{t−1})), con \vertema{3.A.16}.'
