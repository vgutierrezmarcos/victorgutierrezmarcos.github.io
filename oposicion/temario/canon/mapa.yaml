  3.A.9:
    titulo: Teoría de la demanda del consumidor (II). Dualidad e integrabilidad de las preferencias. Sistemas de demanda utilizados
      en estudios empíricos. Medidas de cambio en el bienestar.
    bloque: modelo-neoclasico-basico
    fuente_disponible: si
    referencias:
    - a: 3.A.8
      estado: ok
      contexto: 'Primal, axiomas (insaciabilidad local), solución de esquina, caja de teoremas y demandas de la Cobb-Douglas
        (I.1-I.3); historia del ordinalismo (introducción); agregación de Gorman y consumidor representativo (II.1); anexo
        de sistemas con las mismas ecuaciones (II.2); preferencia revelada y contrastes no paramétricos (II.2, III.1); gráfico
        de la descomposición de Slutsky y tablas de clasificación (III.2); cuasiconcavidad como propiedad ordinal (anexo C).
        19 remisiones.'
    - a: 3.A.11
      estado: ok
      contexto: 'Nota de la Cobb-Douglas: estimación de 1928 (3/4 trabajo, 1/4 capital) y Douglas senador de 1949 a 1967;
        la función de producción se estudia allí (D005)'
    - a: 3.A.12
      estado: ok
      contexto: 'Dualidad en sentido amplio en la empresa (minimización de costes y tecnología; maximización del beneficio
        no es dual estricto); la misma dualidad en la conclusión (función de costes, Shephard, demandas condicionadas);
        la función de costes tiene las mismas propiedades que la de gasto (anexo C)'
    - a: 3.A.16
      estado: ok
      contexto: 'Bienestar en equilibrio parcial con productores (III.3, idea); excedente exacto con efecto renta nulo
        (cuasilineal); Willig justifica usar el excedente en equilibrio parcial; conclusión'
    - a: 3.A.22
      estado: ok
      contexto: 'Bienestar en equilibrio general (III.3, idea); VC para diseñar compensaciones como en el criterio de Kaldor-Hicks;
        criterios de compensación (conclusión)'
    - a: 3.A.24
      estado: ok
      contexto: 'Bienestar agregado y funciones de bienestar social (III.3, idea; conclusión)'
    - a: 3.A.3
      estado: ok
      contexto: 'Nota: Walras trata el precio como variable independiente y Marshall lo dibuja en el eje vertical (III.2)'
    - a: 3.A.10
      estado: ok
      contexto: 'Elección con riesgo como extensión (conclusión)'
    - a: 3.A.29
      estado: ok
      contexto: 'Decisiones intertemporales como extensión (conclusión)'
    - a: 3.A.30
      estado: ok
      contexto: 'Deflactor del PIB como Paasche encadenado (caja del deflactor; conclusión)'
    - a: 3.A.33
      estado: ok
      contexto: 'Límite del marco estático: hábitos, bienes duraderos, expectativas y restricciones de liquidez (II.3, valoración)'
    - a: 4.A.1
      estado: ok
      contexto: 'Sistemas de demanda para construir índices de precios (relevancia); metodología del IPC (caja del IPC); IPC
        y deflactor (caja del deflactor; conclusión)'
      uso: ampliar
      nota: 'Metodología estadística; la teoría de los índices se desarrolla entera en el 3.A.9 (D138).'
    - a: 4.B.6
      estado: ok
      contexto: 'VC y VE como base del análisis coste-beneficio (relevancia, III.3, conclusión)'
      uso: ampliar
      nota: 'Aplicación; el 3.A.9 define VC y VE como disposición a pagar y a aceptar sin depender de él (D138).'
    - a: 4.B.9
      estado: ok
      contexto: 'Exceso de gravamen EG = −VE − T (relevancia, nota al opositor de III.3, conclusión)'
      uso: ampliar
      nota: 'Aplicación; la nota da la definición completa con MWG §3.I (D138).'
    - a: 4.B.11
      estado: ok
      contexto: 'Elasticidades de los sistemas de demanda para la imposición indirecta óptima y la reforma del IVA (relevancia,
        II.1, usos de II.2)'
      uso: ampliar
      nota: 'Aplicación de los sistemas de demanda (D138).'
    faltan: []
    contradicciones:
    - tema: 3.A.8
      que: 'Anexo der:matriz-slutsky (3A08.tex, l. 1268-1281): escribe s_{ij} (choca con la participación s_i); canon y 3.A.9:
        S_{ij}. En pendientes-coherencia.md.'
    - tema: 3.A.8
      que: 'Anexo anexo:sistemas (l. 1394-1395): utilidad en minúscula, u(x)=Σα_i ln x_i y u(x)=Σα_i ln(x_i−γ_i) (canon U(x);
        u es la de Bernoulli); el LES «no admite bienes inferiores ni complementarios»: son complementarios netos (con γ_j>0
        puede haber complementariedad bruta). En pendientes-coherencia.md.'
    - tema: 3.A.8
      que: 'Hessiana, concavidad y cuasiconcavidad: el anexo C de 3.A.9 (anexo:hessiana) se propone como versión común;
        la nota de la cuasiconcavidad del 3.A.8 (l. 301) puede remitir a él. En pendientes-coherencia.md.'
    - tema: 3.A.12
      que: 'Sus anexos tienen las mismas capturas en inglés sobre hessiana y concavidad que tenía el 3.A.9 («Coordinar en
        temas 3.A.8, 3.A.9 y 3.A.12»): sustituirlas por la versión del anexo C de 3.A.9 adaptada a C(w,q) (concavidad en
        w, Shephard). Notación de la matriz de sustitución de factores con mayúscula (no s_{ij}) y efecto «escala» siempre
        igual (ficha slutsky). Aplicaciones empíricas: misma translog que la ficha sistemas-demanda.'
    - tema: 4.A.1
      que: 'IPC: base 2025 desde enero de 2026 (dice «nueva base (2001)»), Laspeyres encadenado con precios de diciembre
        del año anterior y ponderaciones anuales (no de base fija con w_{i0}: canon ω_{i,t−1}); EPF anual desde 2006 (la
        presenta como trimestral en el título y anual en el texto; la trimestral era la ECPF, 1985-2005); deflactor del PIB
        como Paasche encadenado. Fichas ipc e indices-precios.'
    - tema: 4.B.9
      que: 'Signo de VC y VE: convención de MWG (positivas si mejora); EG = −VE − T (ficha exceso-gravamen corregida); VC y
        VE de Hicks (1939-1943, sistematizadas en 1956) y Willig (1976), no «Willings»; «Haussman» → Hausman.'
    - tema: 4.B.11
      que: 'Misma convención de signo de VE y EG que 3.A.9 y 4.B.9; las elasticidades compensadas cruzadas salen de sistemas
        de demanda (AIDS): remitir a 3.A.9.'
