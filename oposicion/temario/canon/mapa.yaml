      que: 'Teorema de May mal enunciado (nota 20: «la única regla que produce siempre un vencedor»; ficha may); la nota 23 dice que con
        U una regla «será inmune a la manipulación»; Gibbard-Satterthwaite con «U, P y no dictadura», sin sobreyectividad; «Downs-Hotelling
        (1947)» (Hotelling, 1929; Downs, 1957); repite casi literal el bloque de Arrow y Condorcet del 3.A.24 original (canon: resumen).
        Al revisarlo: el ejemplo de los 3 vecinos (tab:condorcet) y el de Borda con 5 vecinos (tab:borda) con las mismas letras, y los
        gráficos condorcet.tex y buchanan-tullock.tex del 3.A.24; su promesa de la demostración de Arrow en los anexos del 3.A.24 se
        cumple (anexo B).'
    - tema: 4.B.3
      que: 'Rawls «dada una aversión absoluta al riesgo» (canon: aversión infinita a la incertidumbre); Lorenz con CL_A, CL_D (canon L_Y,
        L_{Y-T}, C_T sobre lorenz.tex); IG = 2 × área, coherente; Atkinson sin fórmula ni ϵ: al revisarlo, la misma ϵ, y_EDE y A_ϵ con
        I individuos y \vertema{3.A.24}.'
