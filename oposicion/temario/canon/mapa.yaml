        (I.3), integrabilidad (I.3.1), ecuación de Slutsky de los factores (II.1.2; antes marcada corregir -> 3.A.8, desfasado
        por D139), translog del consumidor (IV.1), hessiano orlado y anexos; conclusión'
    - a: 3.A.11
      estado: ok
      contexto: 'Restricciones técnicas, isocuantas, axiomas de 𝒴 y convexidad, netputs (I.3.2), elasticidad de sustitución,
        ejemplos Leontief y Cobb-Douglas, isoclina, elasticidad de escala local, tecnología en S, ley de proporciones variables,
        producción conjunta y alcance (III.4.2)'
    - a: 3.A.15
      estado: ok
      contexto: 'Organización de la empresa (introducción); críticas desde la organización industrial (III.3); agencia y contratos
        incompletos (Leibenstein); tamaño eficiente y economías de alcance (III.4.2); causas de la ineficiencia (IV.3); conclusión'
    - a: 3.A.16-3.A.19
      estado: ok
      contexto: 'Cuánto producir y a qué precio según la estructura del mercado (introducción)'
    - a: 3.A.16
      estado: ok
      contexto: 'Oferta competitiva desde los costes (relevancia, I.3), tamaño indeterminado con rendimientos constantes (II.1.1,
        III.1.2), mínimos de explotación (II.2), competencia perfecta (III.1); conclusión'
    - a: 3.A.17
      estado: ok
      contexto: 'Subaditividad y número de empresas (relevancia), monopolio natural uni y multiproducto (III.1), Harberger e ineficiencia
        X (III.3.2), separación generación-redes (IV.2), monopsonio (opinión), tecnologías con rendimientos crecientes (anexo
        de geometría)'
    - a: 3.A.19
      estado: ok
      contexto: 'Oligopolio (conclusión)'
    - a: 3.A.20
      estado: ok
      contexto: 'Regulación del monopolio natural (III.1.2, IV.2); regulación por comparación de Shleifer con DEA y frontera estocástica
        (IV.3, conclusión)'
      nota: 'El tema de referencia del yardstick era 3.A.17 (D091) y por eso IV.3 lleva las 2 remisiones (hecho, 14/10/2026); desde el 22/10/2026 es el 3.A.20 (P21-02): basta \vertema{3.A.20} en la l. 1132 (opcional, pendientes-coherencia.md).'
    - a: 3.A.21
      estado: ok
      contexto: 'Precios de los factores endógenos en equilibrio general (opinión de la conclusión)'
    - a: 3.A.25
      estado: ok
      contexto: 'Demanda derivada de trabajo: demandas no condicionadas y Hotelling (I.2.1); conclusión'
    - a: 3.B.6
      estado: ok
      contexto: 'Economías de escala internas y externas y comercio intraindustrial (relevancia, III.2, conclusión)'
    - a: 3.B.8
      estado: ok
      contexto: 'Industria naciente: economías externas y de aprendizaje (III.2, III.4.3, conclusión)'
    faltan: []
    contradicciones:
    - tema: 3.A.11
      que: 'Anexo anexo:productor: «B(p,w⃗) creciente en p, decreciente en w⃗»; es no decreciente en p (estrictamente creciente
        si q > 0) y no creciente en w⃗ (MWG prop. 5.C.1). Siglas PMg, PMe, RMST, CMg en cursiva en las fórmulas (canon: redonda,
        notacion.md § 0). Ver pendientes-coherencia.md.'
    - tema: 3.A.16
      que: 'Escribe C_i(q̄_i,w⃗) y C_i(w⃗,q_i) (canon C(w⃗,q)); la matriz de sustitución de la función de costes sin letra (S(w⃗,q));
        duda entre F estrictamente cóncava y cuasicóncava (cóncava para la MB; para los costes basta la cuasiconcavidad); remite
        a 3.A.11 para la oferta (corregir -> 3.A.12, ya marcado). Mismo enganche que el 3.A.12 original (aspectos técnicos,
        de costes y organizativos): necesita uno propio. Resuelto en la revisión del 3.A.16 (17/10/2026): C_j(w⃗,q_j), la matriz sale del tema, nota con los supuestos de concavidad, remisión a 3.A.12 y enganche propio (el aceite de oliva).'
    - tema: 3.A.17
      que: 'Monopolio natural multiproducto: «el concepto clave no sería la subaditividad, sino las economías de alcance»; la
        definición sigue siendo la subaditividad (alcance necesario, no suficiente; Baumol, Panzar y Willig, 1982). Captura de
        Policonomics de la subaditividad: usar el gráfico subaditividad del 3.A.12. Menciona la ineficiencia X sin el rectángulo
        de costes inflados. Mismo enganche que el 3.A.12 original. Resuelto en la revisión del 3.A.17 (17/10/2026): subaditividad como definición también en el multiproducto, gráfico subaditividad-sostenibilidad sobre la base del de 3.A.12, franja de costes inflados (con CMg creciente) además del triángulo de Harberger, isocostes curvas con monopsonio y enganche propio (refrán y sentencia de Google); la enumeración de aspectos técnicos, de costes y organizativos queda como contexto, no como enganche.'
    - tema: 3.A.18, 3.A.19
      que: 'Mismo enganche que el 3.A.12 original (aspectos técnicos, de costes y organizativos, con «[tema 3.A.12]»): cada
        uno necesita el suyo. 3.A.18 resuelto en su revisión (19/10/2026): enganche propio («En la variedad está el gusto»); queda el 3.A.19.'
    - tema: 3.B.4
      que: 'Stigler (1939) con la captura de Policonomics y la nota «Coordinar en temas 3.A.11, 3.A.12 y 3.B.4»: remitir a 3.A.12
        y usar su gráfico stigler (ficha stigler-costes). Policonomics no se enlaza (spam oculto inyectado).'
    - tema: 3.A.43
