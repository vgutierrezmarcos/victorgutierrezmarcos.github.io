temas:
  3.A.1:
    titulo: Objeto y métodos de la ciencia económica. Cuestiones y debates actuales, con especial referencia a la economía
      conductual.
    bloque: historia-del-pensamiento-economico
    fuente_disponible: si
    referencias:
    - a: 3.A.8-3.A.10; 3.A.11-3.A.12; 3.A.16-3.A.19
      estado: ok
      contexto: marginalistas sientan los cimientos de la teoría de la demanda, producción y costes y estructuras de mercado
    - a: 3.A.22-3.A.24
      estado: ok
      contexto: 'Economía del bienestar: contribuciones de Pareto, Pigou y Coase'
    - a: 3.A.13
      estado: ok
      contexto: Economía de la información desde los años 70 con Akerlof
    - a: 3.A.25-3.A.27
      estado: ok
      contexto: Economía del mercado de trabajo, de Marshall y Pigou o Hicks hasta Becker
    - a: 3.B.5-3.B.9
      estado: ok
      contexto: 'Comercio internacional: Ohlin, Samuelson, Krugman y Melitz'
    - a: 3.B.23-3.B.25
      estado: ok
      contexto: 'Economía financiera: modelo media-varianza de Markowitz'
    - a: 3.A.43-3.A.45
      estado: ok
      contexto: 'ramas de la macro con modelos dinámicos microfundamentados: crecimiento'
    - a: 3.A.42
      estado: ok
      contexto: teoría de ciclos económicos
    - a: 3.B.15-3.B.16
      estado: corregir -> 3.B.14
      contexto: Economía internacional (modelos de la NOEM)
    - a: 3.A.29
      estado: ok
      contexto: la macroeconomía moderna le debe más a Irving Fisher que a Keynes
    - a: 3.A.8
      estado: ok
      contexto: teoría del consumidor como ejemplo de enfoque deductivo
    - a: 3.A.15
      estado: ok
      contexto: Escuela de Harvard de Organización Industrial parte de la observación empírica
    - a: 3.B.28
      estado: ok
      contexto: Randomized Control Trials como método inductivo
    - a: 3.A.10
      estado: ok
      contexto: Daniel Bernoulli resolvió la paradoja de San Petersburgo con matemáticas
    - a: 3.A.13
      estado: corregir -> 3.A.14
      contexto: juegos de información incompleta de Harsanyi, útiles para los economistas de la información
    - a: 3.A.15
      estado: ok
      contexto: Simon sustituye la maximización por la racionalidad limitada de los gerentes
    - a: 3.A.24
      estado: corregir -> 3.A.14
      contexto: 'economía conductual: motivaciones distintas al puro interés individual (índice)'
    - a: 3.A.29
      estado: ok
      contexto: preferencias intertemporales inconsistentes dinámicamente (índice)
    - a: 3.A.10
      estado: ok
      contexto: efecto dotación (índice)
    - a: 3.A.24
      estado: corregir -> 3.A.14
      contexto: Existen motivaciones distintas al puro interés individual (epígrafe, 'Coordinar en temas 3.A.1 y 3.A.24')
    - a: 3.A.24
      estado: corregir -> 3.A.14
      contexto: consideraciones éticas y de justicia mediante el juego del ultimátum y el juego del dictador
    - a: 3.A.29
      estado: ok
      contexto: Preferencias intertemporales inconsistentes dinámicamente (epígrafe, descuento hiperbólico)
    - a: 3.A.10
      estado: ok
      contexto: Efecto dotación (epígrafe, 'Coordinar en temas 3.A.1 y 3.A.10')
    - a: 3.B.23
      estado: ok
      contexto: media-varianza de Markowitz como aplicación de von Neumann-Morgenstern
    - a: 3.A.23
      estado: ok
      contexto: el sector público no dispone de información para actuar como planificador benevolente
    - a: 3.A.24
      estado: ok
      contexto: 'nota: Condorcet o Borda y sus sistemas de votaciones'
    faltan:
    - a: 3.A.6
      por_que: trata la crítica de Lucas y los EGDE (aplicación de Kuhn a la NMC) sin remitir al tema donde se desarrollan
    - a: 3.A.4
      por_que: aplica Kuhn a la revolución keynesiana sin remitir
    - a: 3.A.7
      por_que: aplicación de Kuhn a la Nueva Economía Keynesiana sin remitir
    - a: 3.A.3
      por_que: Methodenstreit (Menger-Schmoller) y revolución marginalista sin remitir
    - a: 3.A.5
      por_que: Friedman (1953), 'The Methodology of Positive Economics', en el debate sobre la relevancia de los supuestos;
        3.A.5 lo cita como desarrollo
    - a: 3.A.14
      por_que: Nash, Selten y Harsanyi (nota 31) y juegos experimentales
    - a: 3.A.21
      por_que: debate equilibrio parcial vs equilibrio general sin remitir
    modelos:
    - akerlof-lemons
    - costes-transaccion
    - critica-lucas
    - descuento-hiperbolico
    - economia-conductual
    - efecto-dotacion
    - egde
    - estructura-conducta-resultado
    - friedman-metodologia
    - methodenstreit
    - metodologia-feyerabend
    - metodologia-kuhn
    - metodologia-lakatos
    - metodologia-popper
    - nash-negociacion
    - positivismo-logico
    - prospect-theory
    - rct
    - sen-liberal
    - utilidad-esperada-vnm
    revisado: null
  3.A.2:
    titulo: Los economistas clásicos y Marx.
    bloque: historia-del-pensamiento-economico
    fuente_disponible: si
    referencias:
    - a: 3.B.5
      estado: ok
      contexto: 'índice: Comercio internacional (Smith)'
    - a: 3.B.5
      estado: ok
      contexto: 'índice: Comercio internacional (Ricardo)'
    - a: 3.B.5
      estado: ok
      contexto: 'índice: Comercio internacional (Mill)'
    - a: 3.B.5
      estado: ok
      contexto: 'Comercio internacional: Adam Smith (1776) criticó duramente las teorías mercantilistas'
    - a: 3.A.3
      estado: ok
      contexto: Ricardo ya trabaja en el margen, pero no lo formaliza como la revolución marginalista
