        corregir -> 3.A.12. Resuelto en la revisión del 3.A.16 (17/10/2026): remite a 3.A.12.'
    - tema: 3.A.21, 3.A.22
      que: 'La caja de Edgeworth de la producción está tres veces con texto casi idéntico (3.A.11, 3.A.21, 3.A.22); 3.A.22 usa
        |RMST_L^K| (canon RMST^X_{LK} positiva); 3.A.21 supone a la vez convexidad estricta del conjunto (que con la inacción sí
