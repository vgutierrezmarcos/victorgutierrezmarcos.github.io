  3.A.17:
    titulo: Análisis de mercados (II). Teoría del monopolio. Discriminación de precios. Monopolio natural. Producción conjunta.
      Análisis de eficiencia y bienestar. Monopsonio. Monopolio bilateral.
    bloque: informacion-y-poder-de-mercado
    fuente_disponible: si
    referencias:
    - a: 3.A.8
      estado: ok
      contexto: 'Individualismo metodológico (enganche); demanda de consumidores con utilidad cuasilineal (I.2, supuestos)'
    - a: 3.A.9
      estado: ok
      contexto: 'Excedente del consumidor como medida exacta del bienestar con utilidad cuasilineal (I.3, supuestos)'
    - a: 3.A.11
      estado: ok
      contexto: 'Aspectos técnicos de las decisiones del productor (introducción)'
    - a: 3.A.12
      estado: ok
      contexto: 'Aspectos de costes (introducción); C(w⃗,q) con w⃗ fijo (I.2); costes fijos a corto plazo y todos evitables a largo en la viabilidad (I.2); ineficiencia X, C^obs = (1+χ)C (I.3); subaditividad como definición (II.2.1) y economías de alcance (II.2.2); complementariedad de costes y aprendizaje (II.3.1 y nota); reparto entre plantas como minimización del coste (II.3.3); isocostes curvas con monopsonio (III.1); medición de la eficiencia con DEA y frontera estocástica (anexo A, yardstick)'
    - a: 3.A.13
      estado: ok
      contexto: 'Autoselección (screening) en la discriminación de 2.º grado (II.1.2); el 3.er grado como información asimétrica (nota de II.1.3); problemas de información e incentivos de la regulación (anexo A.3) y teoría de la agencia (anotación de coste incrementado y precio fijo)'
    - a: 3.A.14
      estado: ok
      contexto: 'Inconsistencia temporal en la conjetura de Coase (nota de II.1.4); Rubinstein y Binmore-Rubinstein-Wolinsky (III.2); la negociación en la teoría de juegos (conclusión)'
    - a: 3.A.15
      estado: ok
      contexto: 'Aspectos organizativos y límites de la empresa (introducción); barreras de entrada (I.1); Modigliani (1958) y la disuasión de la entrada (nota de la contextualización); mercados impugnables (II.2.1); integración vertical y doble marginalización (III.2); no condenar de antemano las concentraciones y mercados impugnables como principios (anexo A.2); amenaza de entrada (conclusión)'
    - a: 3.A.16
      estado: ok
      contexto: 'Mercado en el que vende la empresa y las 4 estructuras (introducción y nota); equilibrio parcial marshalliano (nota); diferencia con la competencia perfecta (I.1); demanda de consumidores con utilidad cuasilineal (I.2); 1TFEB en equilibrio parcial y excedentes (I.3 a y nota)'
    - a: 3.A.18
      estado: ok
      contexto: 'Estructuras de mercado (introducción y nota); competencia monopolística entre los 2 polos (conclusión)'
    - a: 3.A.19
      estado: ok
      contexto: 'Estructuras de mercado (introducción y nota); el cártel resuelve el problema del monopolio multiplanta (II.3.3); oligopolio entre los 2 polos (conclusión)'
    - a: 3.A.20
      estado: ok
      contexto: 'Regulación de los monopolios naturales (relevancia, conclusión); regulación con información asimétrica y teoría positiva en el anexo A (notaopositor de la introducción, II.2.3 i y c, anexo A y A.4); mercado relevante (conclusión)'
      nota: 'Con el 3.A.20 revisado (22/10/2026), el anexo A pasa a resumen con \vertema{3.A.20}, se quitan fig:averch-johnson y anexo:aj, la notaopositor de la l. 1126 dice «se resumen» y las l. 765 y 823 remiten al resumen del anexo y al 3.A.20 (pendiente de --fase coherencia).'
    - a: 3.A.21
      estado: ok
