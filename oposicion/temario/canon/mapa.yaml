      estado: ok
      contexto: 'Cobb-Douglas como tecnología de los ciclos reales'
    - a: 3.A.43
      estado: ok
      contexto: 'Cobb-Douglas macro Y = AK^α L^(1−α); Solow (1956) usa ya una CES; neutralidad de Harrod y Uzawa; tamaño indeterminado con rendimientos constantes; forma intensiva y = f(k) (anexo)'
    - a: 3.A.44
      estado: ok
      contexto: 'Crecimiento endógeno: CES con σ > 1 y rendimientos crecientes; definición del capital'
    - a: 3.A.45
      estado: ok
      contexto: 'Participaciones factoriales, PTF con neutralidad de Hicks, caída de la participación salarial'
    - a: 3.B.5
      estado: ok
      contexto: 'Ricardo y Heckscher-Ohlin: diferencias de tecnología e intensidad factorial'
    - a: 3.B.6
      estado: ok
      contexto: 'Rendimientos crecientes y comercio intraindustrial; FPP convexa con rendimientos crecientes'
    - a: 3.B.9
      estado: ok
      contexto: 'Sesgo del progreso técnico por sectores y sus efectos sobre el comercio y la RRI (II.3)'
    faltan: []
    contradicciones:
    - tema: 3.B.9
      que: 'Definiciones antiguas de neutralidad (l. 552-558: «en Hicks… la cantidad de factores utilizados disminuye»; Harrod
        «la relación capital-producto permanece constante») y confusión de progreso aumentador del capital con sesgado hacia
        el capital. Adoptar las de 3.A.11 II.3 y la ficha progreso-tecnico-neutral.'
    - tema: 3.A.45
      que: 'Nota 13: copia las definiciones antiguas de neutralidad del 3.A.11; mismas correcciones que 3.B.9.'
    - tema: 3.A.12
      que: 'Copia la elasticidad de escala con la notación vieja (ε_{Q,λ}, λ, Q, f(z)): usar t, q, F(z), ε_{q,t} y ε_{q,t}(z)
        (ficha rendimientos-escala). Sus remisiones a 3.A.11 (isoclina, proporciones variables, rendimientos) son válidas.'
    - tema: 3.A.9
      que: 'Nota 26: historia de la Cobb-Douglas («70 % y 30 %», Douglas senador «1949-1966», fue hasta 1967). Según D005 va
        en 3.A.11 (estimación de 1928, q ≈ 1,01 z_K^{1/4} z_L^{3/4}); una línea y \vertema{3.A.11}.
        Resuelto en la revisión del 3.A.9 (13/10/2026).'
    - tema: 3.A.43
      que: 'Remite a 3.A.11 para la indeterminación del tamaño con rendimientos constantes: ya está (II.2). La remisión «3.A.10
        y 3.A.11» sigue siendo corregir -> 3.A.11, 3.A.12.'
    - tema: 3.A.2
      que: 'Nota 38: ley de Turgot fechada en 1765; 3.A.11 usa 1767 (Observations sur le mémoire de M. de Saint-Péravy, Humphrey,
        1997).'
    - tema: 3.A.16
      que: 'Remite a 3.A.11 para la curva de oferta individual y de mercado: es 3.A.12 (problema del productor); ya marcado
        corregir -> 3.A.12.'
    - tema: 3.A.21, 3.A.22
      que: 'La caja de Edgeworth de la producción está tres veces con texto casi idéntico (3.A.11, 3.A.21, 3.A.22); 3.A.22 usa
        |RMST_L^K| (canon RMST^X_{LK} positiva); 3.A.21 dice que la convexidad estricta del conjunto implica rendimientos decrecientes.
        Repartir según la ficha equilibrio-general-walras.'
    - tema: 3.A.8
      que: 'Bibliografía: la clave FulekyAnatomy no lleva año en 3A08.bib (en 3A11.bib, 2006). Ver pendientes-coherencia.md.'
    modelos:
    - cambridge-capital
    - ces
    - cobb-douglas
    - conjunto-tecnologico
    - edgeworth-produccion
    - equilibrio-general-walras
    - funcion-produccion
    - isocuantas-rmst
    - leontief
    - productividad-corto-plazo
    - progreso-tecnico-neutral
    - rendimientos-escala
    revisado: 2026-10-13
