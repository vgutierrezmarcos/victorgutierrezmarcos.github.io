        de III.1 y conclusión)'
    - a: 3.A.10
      estado: ok
      contexto: 'Decisión frente a la naturaleza y Theory of Games con el apéndice de 1947 (contextualización); pagos esperados
        de vNM (I.1 y mixtas de I.2.2); maximin de Wald y Laplace frente al minimax (I.2.2); pujadores aversos al riesgo (III.3.2)'
    - a: 3.A.13
      estado: ok
      contexto: 'Selección adversa como información incompleta y riesgo moral como imperfecta (I.1); subastas y selección adversa
        como juegos bayesianos (II.1); Spence como juego, doble desigualdad y coste de la señal (II.2); información asimétrica
        (III.1); autoselección (III.2); extensiones (conclusión)'
    - a: 3.A.15
      estado: ok
      contexto: 'Entrada en los mercados (relevancia); compromiso de capacidad para disuadir la entrada (I.3.1); precio límite
        como señal (II.2 y III.1)'
    - a: 3.A.16
      estado: ok
      contexto: 'En competencia perfecta no hay interdependencia estratégica (contextualización)'
    - a: 3.A.17
      estado: ok
      contexto: 'En monopolio no hay rivales (contextualización); conjetura de Coase como inconsistencia temporal (I.3.1); indeterminación
        de Bowley y monopolio bilateral (II.3.1); regulación con información asimétrica (III.1) y discriminación de 2.º grado
        (III.2); valor virtual como el ingreso marginal del monopolista (III.3.2). Decidido (P21-02, 21/10/2026): la regulación
        con información asimétrica pasará a remitirse al 3.A.20 cuando se revise'
    - a: 3.A.18
      estado: ok
      contexto: 'Juegos en 2 etapas: localización o calidad y después precios (extensiones de I.3.1); diferenciación resuelta
        por etapas (III.1)'
    - a: 3.A.19
      estado: ok
      contexto: 'Oligopolio (relevancia, III.1 y conclusión); el cártel como dilema (I.2.1); función de reacción y Cournot y Bertrand
        con acciones continuas (I.2.2); Stackelberg como ENPS (I.3.1); colusión tácita (I.3.2); Cournot con costes privados
        (II.1)'
    - a: 3.A.21
      estado: ok
      contexto: 'Existencia del EN por el punto fijo, como el equilibrio walrasiano (I.2.2); indeterminación de Edgeworth (II.3.1);
        Debreu-Scarf (II.3.2) y Aumann (II.3.3); cálculo socialista y Hurwicz (III.2); subasta de reloj como tanteo (III.3.3)'
    - a: 3.A.23
