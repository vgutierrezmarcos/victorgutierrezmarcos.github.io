        y 3.A.11» sigue siendo corregir -> 3.A.11, 3.A.12.'
    - tema: 3.A.2
      que: 'Nota 38: ley de Turgot fechada en 1765; 3.A.11 usa 1767 (Observations sur le mémoire de M. de Saint-Péravy, Humphrey,
        1997).'
    - tema: 3.A.16
