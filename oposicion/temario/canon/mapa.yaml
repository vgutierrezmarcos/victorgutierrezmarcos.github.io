      que: 'Revisados: lo que prometen al 3.A.24 se cumple con sus palabras (Condorcet y el consumidor representativo; Kaldor-Hicks;
        Rawls, Harsanyi e independencia de vNM; Shapley-Shubik, Gibbard-Satterthwaite, principio de revelación y ENPS del ultimátum;
        Pareto incompleto y Foley; Downs-Hotelling con precios fijos; Pareto y los teoremas con sus gráficos; Bowen, logrolling, Wicksell,
        Lindahl, Clarke-Groves y Niskanen).'
