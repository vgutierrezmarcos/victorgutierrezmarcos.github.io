      que: 'Escribe ṗ ≤ IPC − X (canon p_{t+1} ≤ p_t(1 + IPC_t − X)); al revisarlo, la X del DORA 2027-2031 (+0,33 %, que se suma), el servicio universal y la interconexión con \vertema{3.A.20} (fichas price-cap y precio-acceso).'
    - tema: 4.B.15
      que: 'Escribe t = a + b(C − C^a) (el signo canónico es −, b = 1 precio fijo) y Averch-Johnson con r (canon w_K, s); remite al «3.A.15» antiguo (hoy 3.A.20). Al revisarlo, resumir Laffont-Tirole, captura, price cap, yardstick, precio de acceso y concesiones remitiendo al 3.A.20.'
    - tema: 4.A.15
      que: 'No cita el 3.A.20 para el mercado relevante y la regulación eficiente (faltan); al revisarlo, la Comunicación de 2024 y los umbrales con las mismas cifras (ficha mercado-relevante).'
    - tema: 3.A.6, 3.A.36, 3.A.41
      que: 'Citan «[ver te [ver tema 3.A.20]» (remisión duplicada en el original) para la consistencia dinámica en la regulación: el 3.A.20 lo cumple en II.5 (Kydland y Prescott, \vertema{3.A.36}); al revisarlos, una sola remisión.'
    - tema: canon
      que: 'Fase canon (22/10/2026): referencia en el 3.A.20 de averch-johnson (nombre «tasa de rentabilidad»), laffont-tirole (con Baron-Myerson y la escala de la potencia), price-cap (X del DORA comprobada), yardstick (alias loeb-magat) y captura-regulador (con Peltzman y su gráfico); fichas nuevas mercado-relevante, competencia-por-mercado y precio-acceso ([decidir], duda 4). Dudas de Víctor abiertas: refrán del enganche y pegatinas, Baron-Myerson en el cuerpo, reparto 7′30″/11′30″/7′30″, DORA como price cap (informe-repaso.md § 20).'
