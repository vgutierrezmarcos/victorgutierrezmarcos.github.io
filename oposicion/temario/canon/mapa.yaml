    - tema: 3.A.16, 3.A.22, 3.A.23
      que: 'Revisados. Su anexo:bloque describe el 3.A.24 con palabras distintas (3.A.16 l. 1219 y 3.A.22 l. 1061: «el óptimo que maximiza
        el bienestar social no tiene por qué coincidir…»; 3.A.23 l. 1397: «cómo elegir entre los óptimos y cómo decide la sociedad»).
