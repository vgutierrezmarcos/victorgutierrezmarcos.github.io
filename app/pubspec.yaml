name: tcee_app
description: "Oposición TCEE · DCE, de Víctor Gutiérrez Marcos y Manuel Cabado García: agenda de cantes, sorteos, temario, test y preparadores para las oposiciones a Técnico Comercial y Economista del Estado y a Diplomado Comercial del Estado."
publish_to: "none"
version: 1.15.5+29

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Firebase (mismo proyecto que la web: web-vgm)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.0

  # Datos y caché
  hive_flutter: ^1.1.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  web: ^1.1.0

  # UI
  fl_chart: ^0.69.0
  # Fórmulas LaTeX de las preguntas del test (como MathJax en la web)
  flutter_math_fork: ^0.7.4
  table_calendar: ^3.3.0
  pdfx: ^2.8.0
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  intl: ^0.20.2

  # Dispositivo
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  record: ^7.1.1
  audioplayers: ^6.1.0
  vibration: ^3.2.1
  package_info_plus: ^10.2.2
  # Actualizaciones dentro de la app (Google Play)
  in_app_update: ^5.0.0
  wakelock_plus: ^1.8.0
  workmanager: ^0.10.10
  home_widget: ^0.10.0

  # Importar un cronograma propio (Excel, Word, PDF, CSV o texto)
  file_picker: ^13.1.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  # Tipografías de la web: TeX Gyre Pagella (equivalente libre de Palatino) y
  # Source Sans 3. Licencias en assets/fonts.
  fonts:
    - family: Pagella
      fonts:
        - asset: assets/fonts/texgyrepagella-regular.otf
        - asset: assets/fonts/texgyrepagella-italic.otf
          style: italic
        - asset: assets/fonts/texgyrepagella-bold.otf
          weight: 700
        - asset: assets/fonts/texgyrepagella-bolditalic.otf
          weight: 700
          style: italic
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
    # Latin Modern Roman (la de LaTeX), la de la web de DCE de Manuel Cabado García.
    - family: LMRoman
      fonts:
        - asset: assets/fonts/lmroman10-regular.otf
        - asset: assets/fonts/lmroman10-italic.otf
          style: italic
        - asset: assets/fonts/lmroman10-bold.otf
          weight: 700
        - asset: assets/fonts/lmroman10-bolditalic.otf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#5F2987"
  adaptive_icon_foreground: "assets/icon/icon_frente.png"
  remove_alpha_ios: true
