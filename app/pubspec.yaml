name: tcee_app
description: "Oposición TCEE · Víctor Gutiérrez Marcos. App complementaria de victorgutierrezmarcos.es: test, temario, planificación y blog."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Firebase (mismo proyecto que la web: web-vgm)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.0

  # Datos y caché
  hive_flutter: ^1.1.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  xml: ^6.5.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  pdfx: ^2.8.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  intl: ^0.20.2

  # Dispositivo
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  record: ^5.2.0
  audioplayers: ^6.1.0
  vibration: ^2.0.1
  package_info_plus: ^8.1.1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#5F2987"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true
