name: Pedir a Google que indexe (tanda diaria)

# Cada día a las 8:00 de Madrid manda a la Indexing API de Google hasta 10 URL
# del sitemap por orden de relevancia: primero las que aún no están indexadas y
# luego las que cambiaron desde el último rastreo (ver scripts/indexar-google.py).
# Se programa a las 6:00 y a las 7:00 UTC para cubrir el horario de verano y el
# de invierno; el script solo actúa si en Madrid son ya las 8 y hoy no lo hizo.
# A mano (workflow_dispatch) manda la tanda sin mirar la hora.

on:
  schedule:
    - cron: '0 6,7 * * *'
  workflow_dispatch:

concurrency:
  group: indexar-google
  cancel-in-progress: false

jobs:
  indexar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Mandar la tanda
      env:
        GOOGLE_INDEXACION_CLAVE: ${{ secrets.GOOGLE_INDEXACION_CLAVE }}
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          python3 scripts/indexar-google.py --hora 8
        else
          python3 scripts/indexar-google.py
        fi

    - name: Guardar el registro
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add scripts/indexacion-google.json
        if git diff --cached --quiet; then exit 0; fi
        git commit -m "Indexación en Google: tanda del $(TZ=Europe/Madrid date +%F) [skip ci]"
        for i in 1 2 3; do
          git pull --rebase origin main && git push origin HEAD:main && exit 0
          sleep 10
        done
        exit 1
