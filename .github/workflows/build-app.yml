name: Build app Android (APK)

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Sin este secreto la app compila igualmente, pero sin inicio de sesión.
      - name: Credenciales Firebase (secreto GOOGLE_SERVICES_JSON, base64)
        if: ${{ env.GSJ != '' }}
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GSJ" | base64 -d > android/app/google-services.json

      # Sin estos secretos se firma con una clave de depuración distinta en cada
      # ejecución y el inicio de sesión con Google no funcionará en ese APK.
      - name: Clave de firma (secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD)
        if: ${{ env.KS != '' }}
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/tcee-upload.jks
          printf 'storeFile=tcee-upload.jks\nstorePassword=%s\nkeyAlias=tcee\nkeyPassword=%s\n' "$KP" "$KP" > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: oposicion-tcee-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          name: App ${{ github.ref_name }}
          body: |
            APK de prueba de la app Oposición TCEE, para instalar directamente en Android.
