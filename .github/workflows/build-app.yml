name: Build app Android (APK)

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Las carpetas nativas no están en el repo: se generan aquí.
      - name: Generar proyecto nativo
        run: flutter create --org es.victorgutierrezmarcos --project-name tcee_app --platforms android .

      - name: Credenciales Firebase (secreto GOOGLE_SERVICES_JSON, base64)
        if: ${{ env.GSJ != '' }}
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GSJ" | base64 -d > android/app/google-services.json
          # Plugin de Google Services
          sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle || true

      - name: Ajustes Android (minSdk 23, permisos)
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'; s=open(p).read()
          perms=''.join(f'    <uses-permission android:name="android.permission.{x}"/>\n' for x in ['INTERNET','RECORD_AUDIO','POST_NOTIFICATIONS','VIBRATE','RECEIVE_BOOT_COMPLETED'])
          s=s.replace('<application',perms+'    <application',1)
          open(p,'w').write(s)
          PY

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          name: App ${{ github.ref_name }}
          body: |
            APK de prueba de la app Oposición TCEE. Firmado con la clave de depuración: solo para pruebas internas.
