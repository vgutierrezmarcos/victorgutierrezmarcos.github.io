name: Reportes del test

# Manda por correo a Víctor los reportes de «Reportar respuesta» de la app
# (colección reportesTest de Firestore), uno por correo, y los marca como
# enviados. Ver scripts/enviar-reportes-test.py.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

concurrency:
  group: reportes-test
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - name: Mandar los reportes pendientes
      env:
        FCM_CUENTA_SERVICIO: ${{ secrets.FCM_CUENTA_SERVICIO }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      run: python3 scripts/enviar-reportes-test.py
