name: Banco de países del dictamen

# Cada lunes baja del FMI (WEO) y del Banco Mundial (WDI) las series de unos 80
# países y reescribe oposicion/datos/paises-dictamen.json, del que el conector
# saca los dictámenes de práctica (preparar_dictamen). Solo hace commit si cambia
# algún dato: en la práctica, con cada WEO (abril y octubre) y las revisiones del BM.
on:
  schedule:
    - cron: '41 6 * * 1'
  push:
    paths:
      - 'scripts/paises-dictamen.py'
      - '.github/workflows/paises-dictamen.yml'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: paises-dictamen
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bajar las series del FMI y del Banco Mundial
        run: python3 scripts/paises-dictamen.py

      - name: Commit si hay datos nuevos
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add oposicion/datos/paises-dictamen.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Banco de países del dictamen: datos nuevos [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
