name: Cuadro de coyuntura

# Baja cada día los indicadores de coyuntura de España (Eurostat y BCE, API
# públicas sin clave) y actualiza oposicion/coyuntura.json, que lee la app
# (Organización y la guía del dictamen). Solo hace commit si cambia algún dato.
on:
  schedule:
    - cron: '17 10 * * *'
  push:
    paths:
      - 'scripts/coyuntura.py'
      - '.github/workflows/coyuntura.yml'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coyuntura
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bajar los indicadores
        run: python3 scripts/coyuntura.py

      - name: Commit si hay datos nuevos
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add oposicion/coyuntura.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Cuadro de coyuntura: datos nuevos [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
