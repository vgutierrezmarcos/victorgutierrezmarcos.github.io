name: Zip desde GitHub

# Los dos ZIP de «Descargar todos los materiales» (oposicion/index.html), montados por
# scripts/materiales-zip.py: materiales-tcee.zip (todos) y materiales-tcee-con-revisados.zip
# (con sesión iniciada). Se sustituyen dentro de la release materiales-latest sin borrarla,
# para que el enlace no falle mientras se suben, y solo si ha cambiado algo (huella).
# Además de los push que tocan materiales, corre cada noche: los commits [skip ci] de otras
# acciones (metadatos de los PDF) no lo lanzan.

on:
  push:
    branches: [ main ]
    paths:
      - 'oposicion/organizacion/**'
      - 'oposicion/temario/**/*.pdf'
      - 'oposicion/temario/**/*.docx'
      - 'oposicion/temario/temario.json'
      - 'oposicion/temario/revisados-web.json'
      - 'scripts/materiales-zip.py'
      - '.github/workflows/create-materials-zip.yml'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Subir aunque la huella no haya cambiado'
        type: boolean
        default: false

concurrency:
  group: materiales-zip
  cancel-in-progress: true

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Ha cambiado algo?
        id: huella
        run: |
          nueva=$(python3 scripts/materiales-zip.py --huella)
          echo "nueva=$nueva" >> "$GITHUB_OUTPUT"
          anterior=$(gh release view materiales-latest --json body --jq .body 2>/dev/null | grep -o 'huella [0-9a-f]*' | cut -d' ' -f2 || true)
          echo "Huella nueva: $nueva; en la release: ${anterior:-ninguna}"
          if [ "$nueva" = "$anterior" ] && [ "${{ inputs.forzar }}" != "true" ]; then
            echo "subir=no" >> "$GITHUB_OUTPUT"
          else
            echo "subir=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Montar los ZIP
        if: steps.huella.outputs.subir == 'si'
        run: python3 scripts/materiales-zip.py --salida salida-zip

      - name: Subir a la release materiales-latest
        if: steps.huella.outputs.subir == 'si'
        run: |
          fecha=$(date +'%d/%m/%Y')
          notas="Materiales para la oposición a TCEE de Víctor Gutiérrez Marcos (https://www.victorgutierrezmarcos.es/oposicion/). materiales-tcee.zip: todo lo de licencia CC BY-NC-ND 4.0. materiales-tcee-con-revisados.zip: además, los temas revisados (uso personal; https://www.victorgutierrezmarcos.es/condiciones-materiales.html). Actualizado el $fecha · huella ${{ steps.huella.outputs.nueva }}"
          if ! gh release view materiales-latest >/dev/null 2>&1; then
            gh release create materiales-latest --title "Materiales TCEE" --notes "$notas"
          fi
          gh release upload materiales-latest salida-zip/materiales-tcee.zip salida-zip/materiales-tcee-con-revisados.zip --clobber
          gh release edit materiales-latest --title "Materiales TCEE · $fecha" --notes "$notas"
