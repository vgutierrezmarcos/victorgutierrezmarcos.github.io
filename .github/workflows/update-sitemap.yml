name: Update Sitemap and Search Index

on:
  push:
    paths:
      - '**/*.html'
      - 'generate-sitemap.js'
      - 'build-search-index.js'
      - 'build-app-data.js'
      - '.github/workflows/update-sitemap.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate sitemap
      run: node generate-sitemap.js

    - name: Rebuild search index
      run: node build-search-index.js

    - name: Build app data (temario.json, enlaces.json)
      run: node build-app-data.js

    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add sitemap.xml search-index.json oposicion/temario/temario.json oposicion/enlaces.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update sitemap and search index [skip ci]" && git push)
